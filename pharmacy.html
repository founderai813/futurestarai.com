<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慢性處方箋領藥排程</title>
<meta name="description" content="藥局藥師工具：拍照建檔、自動安排第 2／3 次領藥日、平均分配每日通知人數（上限可設，預設每天 ≤ 50 位）。">
<meta name="theme-color" content="#0f8b7e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ---------- Tokens: light is the base ---------- */
  :root {
    --ground: #f4f7f6;
    --surface: #ffffff;
    --surface-2: #eef3f1;
    --surface-sunk: #f8fbfa;
    --ink: #16221f;
    --ink-soft: #3d4b47;
    --muted: #64756f;
    --faint: #94a39d;
    --border: #dde5e2;
    --border-strong: #c6d2ce;
    --accent: #0f8b7e;
    --accent-soft: #d5ece8;
    --accent-ink: #0a5f56;
    --accent-contrast: #ffffff;
    --good: #15803d;
    --good-soft: #dcf3e3;
    --warn: #b45309;
    --warn-soft: #fbeccf;
    --crit: #c2321f;
    --crit-soft: #fadcd6;
    --shadow: 0 1px 2px rgba(20,40,35,.05), 0 8px 24px -14px rgba(20,40,35,.22);
    --shadow-lift: 0 2px 4px rgba(20,40,35,.06), 0 16px 40px -18px rgba(20,40,35,.30);
    --radius: 14px;
    --radius-sm: 9px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1311;
      --surface: #131e1b;
      --surface-2: #1a2723;
      --surface-sunk: #0f1815;
      --ink: #e7efec;
      --ink-soft: #c2cfca;
      --muted: #90a29b;
      --faint: #66766f;
      --border: #26332e;
      --border-strong: #35463f;
      --accent: #2fbfac;
      --accent-soft: #123833;
      --accent-ink: #7fe6d7;
      --accent-contrast: #06120f;
      --good: #4ade80;
      --good-soft: #123122;
      --warn: #f0b64f;
      --warn-soft: #33260f;
      --crit: #f0806b;
      --crit-soft: #331813;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 20px 46px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1311;
    --surface: #131e1b;
    --surface-2: #1a2723;
    --surface-sunk: #0f1815;
    --ink: #e7efec;
    --ink-soft: #c2cfca;
    --muted: #90a29b;
    --faint: #66766f;
    --border: #26332e;
    --border-strong: #35463f;
    --accent: #2fbfac;
    --accent-soft: #123833;
    --accent-ink: #7fe6d7;
    --accent-contrast: #06120f;
    --good: #4ade80;
    --good-soft: #123122;
    --warn: #f0b64f;
    --warn-soft: #33260f;
    --crit: #f0806b;
    --crit-soft: #331813;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 20px 46px -18px rgba(0,0,0,.7);
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--ground);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 0;
  }
  h1, h2, h3 { line-height: 1.25; text-wrap: balance; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- App bar ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: .85rem;
    padding: .7rem clamp(.9rem, 3vw, 1.6rem);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-ink));
    color: var(--accent-contrast); box-shadow: var(--shadow);
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-txt h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: -.01em; }
  .brand-txt p { font-size: .72rem; color: var(--muted); letter-spacing: .02em; }
  .appbar-spacer { flex: 1; }
  .bar-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .48rem .8rem; border-radius: 999px;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--ink-soft); font-size: .82rem; font-weight: 600;
    transition: background .15s, border-color .15s, transform .1s, color .15s;
    white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: var(--surface-2); border-color: var(--accent); color: var(--ink); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--accent-contrast); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.sm { padding: .32rem .6rem; font-size: .76rem; }
  .btn.danger:hover { border-color: var(--crit); color: var(--crit); }
  .icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; border-radius: 11px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: clamp(.9rem, 2.5vw, 1.6rem); }

  /* Stat tiles */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin-bottom: 1.1rem; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .85rem .95rem; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .7; }
  .stat .lbl { font-size: .72rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
  .stat .val { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin-top: .1rem; }
  .stat .val small { font-size: .8rem; font-weight: 600; color: var(--faint); margin-left: .15rem; }
  .stat.tone-peak::before { background: var(--warn); }
  .stat.tone-today::before { background: var(--good); }

  .cols { display: grid; grid-template-columns: 370px 1fr; gap: 1.1rem; align-items: start; }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .panel-head {
    display: flex; align-items: center; gap: .5rem;
    padding: .85rem 1rem; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { font-size: .95rem; font-weight: 700; }
  .panel-head .hint { font-size: .74rem; color: var(--muted); margin-left: auto; }
  .panel-body { padding: 1rem; }

  .form-panel { position: sticky; top: 68px; }

  /* Form */
  .field { margin-bottom: .8rem; }
  .field > label { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .3rem; }
  .field .sub { font-weight: 400; color: var(--faint); font-size: .72rem; }
  .ctrl {
    width: 100%; padding: .55rem .65rem; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: var(--surface-sunk); color: var(--ink);
    transition: border-color .15s, box-shadow .15s; font-size: .9rem;
  }
  .ctrl:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }

  /* Photo capture */
  .photo-drop {
    position: relative; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-sunk); overflow: hidden; aspect-ratio: 16/9;
    display: grid; place-items: center; text-align: center; transition: border-color .15s, background .15s;
  }
  .photo-drop:hover { border-color: var(--accent); background: var(--surface-2); }
  .photo-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo-drop .ph { color: var(--muted); font-size: .8rem; display: grid; gap: .35rem; justify-items: center; padding: .5rem; }
  .photo-drop .ph svg { width: 26px; height: 26px; color: var(--accent); }
  .photo-drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-clear {
    position: absolute; top: .4rem; right: .4rem; z-index: 3; width: 26px; height: 26px;
    border-radius: 8px; border: none; background: rgba(0,0,0,.55); color: #fff;
    display: none; place-items: center; font-size: .9rem;
  }
  .photo-drop.has-img .photo-clear { display: grid; }
  .photo-note { font-size: .7rem; color: var(--faint); margin-top: .35rem; line-height: 1.4; }

  .chips { display: flex; gap: .45rem; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: .35rem; padding: .4rem .7rem;
    border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-sunk);
    font-size: .82rem; font-weight: 600; color: var(--ink-soft); user-select: none; transition: all .15s;
  }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .chip.on .dot { background: var(--accent); }

  .form-actions { display: flex; gap: .5rem; margin-top: .3rem; }
  .form-actions .btn { flex: 1; justify-content: center; }

  /* Settings */
  details.settings { margin-top: .9rem; border-top: 1px solid var(--border); padding-top: .8rem; }
  details.settings > summary {
    list-style: none; cursor: pointer; font-size: .82rem; font-weight: 700; color: var(--ink-soft);
    display: flex; align-items: center; gap: .4rem;
  }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings > summary .chev { transition: transform .2s; color: var(--muted); }
  details.settings[open] > summary .chev { transform: rotate(90deg); }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .8rem; }
  .mini-field label { font-size: .72rem; color: var(--muted); font-weight: 600; display: block; margin-bottom: .25rem; }
  .switch-row { grid-column: 1 / -1; display: flex; align-items: center; gap: .55rem; font-size: .8rem; color: var(--ink-soft); }
  .switch { position: relative; width: 40px; height: 23px; flex: none; }
  .switch input { position: absolute; opacity: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: background .15s; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; background: #fff; border-radius: 50%; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track + .thumb { transform: translateX(17px); }

  /* Tabs */
  .tabs { display: flex; gap: .3rem; }
  .tab {
    padding: .4rem .8rem; border-radius: 999px; border: 1px solid transparent;
    background: transparent; font-size: .82rem; font-weight: 600; color: var(--muted);
  }
  .tab.on { background: var(--accent-soft); color: var(--accent-ink); }
  .tab:hover:not(.on) { background: var(--surface-2); color: var(--ink); }

  /* Schedule day cards */
  .day-list { display: grid; gap: .8rem; }
  .day-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .day-card.is-today { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .day-top { display: flex; align-items: center; gap: .7rem; padding: .7rem .9rem; background: var(--surface-sunk); }
  .day-date { font-weight: 800; font-size: 1rem; letter-spacing: -.01em; }
  .day-date .wd { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: .3rem; }
  .day-rel { font-size: .68rem; font-weight: 700; padding: .1rem .45rem; border-radius: 999px; background: var(--good-soft); color: var(--good); }
  .day-rel.soon { background: var(--warn-soft); color: var(--warn); }
  .day-rel.later { background: var(--surface-2); color: var(--muted); }
  .load { margin-left: auto; display: flex; align-items: center; gap: .55rem; min-width: 150px; }
  .load-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .load-fill { height: 100%; border-radius: 999px; background: var(--good); transition: width .3s; }
  .load-fill.mid { background: var(--warn); }
  .load-fill.full { background: var(--crit); }
  .load-num { font-size: .78rem; font-weight: 800; color: var(--ink-soft); min-width: 48px; text-align: right; }
  .load-num .cap { color: var(--faint); font-weight: 600; }

  table.roster { width: 100%; border-collapse: collapse; }
  table.roster th { text-align: left; font-size: .68rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; padding: .45rem .9rem; border-bottom: 1px solid var(--border); }
  table.roster td { padding: .5rem .9rem; border-bottom: 1px solid var(--border); font-size: .86rem; vertical-align: middle; }
  table.roster tr:last-child td { border-bottom: none; }
  .pt-name { font-weight: 700; display: flex; align-items: center; gap: .5rem; }
  .avatar { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); display: grid; place-items: center; color: var(--faint); font-size: .8rem; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .seq-tag { font-size: .68rem; font-weight: 800; padding: .1rem .4rem; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); }
  .phone { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .phone a { color: inherit; text-decoration: none; }
  .phone a:hover { color: var(--accent); text-decoration: underline; }
  .due-cell { color: var(--muted); font-variant-numeric: tabular-nums; }
  .flag-over { font-size: .66rem; color: var(--crit); font-weight: 700; }

  .status-pills { display: inline-flex; gap: .25rem; }
  .spill {
    font-size: .7rem; font-weight: 700; padding: .22rem .5rem; border-radius: 999px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted);
  }
  .spill.on-notified { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .spill.on-dispensed { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .spill:hover { border-color: var(--accent); }

  /* Patient list */
  .plist { display: grid; gap: .5rem; }
  .prow { display: flex; align-items: center; gap: .7rem; padding: .6rem .8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .prow .meta { flex: 1; min-width: 0; }
  .prow .meta .nm { font-weight: 700; }
  .prow .meta .dt { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prow .acts { display: flex; gap: .3rem; }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
  .empty svg { width: 46px; height: 46px; color: var(--faint); margin-bottom: .6rem; }
  .empty h3 { font-size: 1rem; color: var(--ink-soft); margin-bottom: .3rem; }
  .empty p { font-size: .84rem; max-width: 34ch; margin: 0 auto .9rem; }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 1.1rem; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: .5rem; width: min(92vw, 380px); }
  .toast {
    background: var(--ink); color: var(--ground); padding: .7rem .9rem; border-radius: 11px;
    font-size: .85rem; font-weight: 600; box-shadow: var(--shadow-lift);
    display: flex; align-items: center; gap: .5rem; animation: toastIn .25s ease;
  }
  .toast.good { background: var(--good); color: #fff; }
  .toast.warn { background: var(--warn); color: #fff; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Responsive */
  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; }
    .form-panel { position: static; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .brand-txt p { display: none; }
    .bar-actions .lbl { display: none; }
    table.roster th:nth-child(3), table.roster td:nth-child(3) { display: none; }
    .load { min-width: 110px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Print — daily call sheet */
  @media print {
    .appbar, .form-panel, .stats, .tabs, .no-print, .toast-wrap { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { max-width: 100%; padding: 0; }
    .cols { display: block; }
    .panel { border: none; box-shadow: none; }
    .day-card { break-inside: avoid; border: 1px solid #999; margin-bottom: 10px; }
    .status-pills { display: none; }
    .load-bar { display: none; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M3 12h18"/>
      </svg>
    </div>
    <div class="brand-txt">
      <h1>慢性處方箋領藥排程</h1>
      <p>拍照建檔 · 自動排領藥日 · 平均分配每日通知</p>
    </div>
    <div class="appbar-spacer"></div>
    <div class="bar-actions">
      <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span class="lbl">匯出 CSV</span></button>
      <button class="btn" id="btnBackup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span class="lbl">備份</span></button>
      <button class="btn" id="btnRestore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.7 3M3 4v5h5"/></svg><span class="lbl">還原</span></button>
      <button class="btn icon-btn no-print" id="btnPrint" title="列印今日／每日通知清單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg></button>
      <button class="btn icon-btn no-print" id="btnTheme" title="切換深／淺色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
    </div>
  </header>
  <input type="file" id="restoreFile" accept="application/json" hidden>

  <main class="wrap">
    <section class="stats" id="stats"></section>

    <div class="cols">
      <!-- ============ LEFT: entry form ============ -->
      <section class="panel form-panel">
        <div class="panel-head"><h2 id="formTitle">新增病人領藥資料</h2></div>
        <div class="panel-body">
          <form id="patientForm" autocomplete="off">
            <input type="hidden" id="editId">

            <div class="field">
              <label>處方箋 / 健保卡照片 <span class="sub">（拍照建檔，存本機）</span></label>
              <div class="photo-drop" id="photoDrop">
                <input type="file" id="photoInput" accept="image/*" capture="environment" aria-label="拍照或選擇照片">
                <div class="ph" id="photoPh">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  <span>點此拍照或上傳處方箋</span>
                </div>
                <button type="button" class="photo-clear" id="photoClear" title="移除照片">✕</button>
              </div>
              <p class="photo-note">拍照可自動帶入姓名／電話欄位供對照填寫；影像僅存在此裝置瀏覽器，不會上傳。</p>
            </div>

            <div class="row2">
              <div class="field">
                <label for="fName">姓名</label>
                <input class="ctrl" id="fName" placeholder="王小明" required>
              </div>
              <div class="field">
                <label for="fPhone">聯絡電話</label>
                <input class="ctrl tnum" id="fPhone" placeholder="0912-345-678" inputmode="tel">
              </div>
            </div>

            <div class="field">
              <label for="fFirst">首次調劑日 <span class="sub">（第 1 次領藥日）</span></label>
              <input class="ctrl tnum" id="fFirst" type="date" required>
            </div>

            <div class="row2">
              <div class="field">
                <label for="fInterval">每次間隔 <span class="sub">天</span></label>
                <input class="ctrl tnum" id="fInterval" type="number" min="1" max="120" value="28">
              </div>
              <div class="field">
                <label>領藥區間 <span class="sub">要追蹤的次數</span></label>
                <div class="chips" role="group" aria-label="要排程的領藥次數">
                  <label class="chip on" id="chip2"><input type="checkbox" id="fSeq2" checked><span class="dot"></span>第 2 次</label>
                  <label class="chip on" id="chip3"><input type="checkbox" id="fSeq3" checked><span class="dot"></span>第 3 次</label>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn primary" id="submitBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>加入排程</span>
              </button>
              <button type="button" class="btn" id="cancelEdit" style="display:none">取消</button>
            </div>
          </form>

          <details class="settings" id="settings">
            <summary>
              <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              排程設定
            </summary>
            <div class="settings-grid">
              <div class="mini-field">
                <label for="sCap">每日通知上限（人）</label>
                <input class="ctrl tnum" id="sCap" type="number" min="1" max="500" value="50">
              </div>
              <div class="mini-field">
                <label for="sLead">提前通知天數</label>
                <input class="ctrl tnum" id="sLead" type="number" min="0" max="30" value="5">
              </div>
              <div class="mini-field">
                <label for="sWindow">可再提前調整（天）</label>
                <input class="ctrl tnum" id="sWindow" type="number" min="0" max="30" value="7">
              </div>
              <div class="mini-field">
                <label for="sDefInterval">預設間隔天數</label>
                <input class="ctrl tnum" id="sDefInterval" type="number" min="1" max="120" value="28">
              </div>
              <div class="switch-row">
                <span class="switch"><input type="checkbox" id="sSkipWeekend"><span class="track"></span><span class="thumb"></span></span>
                通知日跳過週六、週日
              </div>
            </div>
            <p class="photo-note" style="margin-top:.7rem">為了平均分配，系統會把「應領藥日」往前推算通知日；若某天已達上限，會自動把病人挪到更早、仍在容許區間內的日子。</p>
          </details>
        </div>
      </section>

      <!-- ============ RIGHT: schedule / patients ============ -->
      <section class="panel">
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button class="tab on" id="tabSched" role="tab">📅 通知排程</button>
            <button class="tab" id="tabPatients" role="tab">👥 病人清單</button>
          </div>
          <span class="hint" id="viewHint"></span>
        </div>
        <div class="panel-body">
          <div id="scheduleView"></div>
          <div id="patientsView" style="display:none"></div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
"use strict";
(function () {
  /* ---------------- storage ---------------- */
  const K = { patients: "rxsched.patients.v1", settings: "rxsched.settings.v1", status: "rxsched.status.v1" };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("儲存空間不足，請先匯出備份並移除舊照片", "warn"); } };

  let patients = load(K.patients, []);
  let settings = Object.assign({ cap: 50, lead: 5, window: 7, defInterval: 28, skipWeekend: false }, load(K.settings, {}));
  let status = load(K.status, {}); // { "id#seq": "notified"|"dispensed" }
  let currentTab = "sched";
  let pendingPhoto = null;

  /* ---------------- date helpers (date-only, local) ---------------- */
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
  const WD = ["日", "一", "二", "三", "四", "五", "六"];
  const today = () => ymd(new Date());

  /* ---------------- scheduling engine ---------------- */
  // Build every pickup event, then assign a notify date, balancing so no
  // day exceeds the cap. Prefer notifying earlier (more lead) when a day is full.
  function buildSchedule() {
    const cap = Math.max(1, settings.cap | 0);
    const lead = Math.max(0, settings.lead | 0);
    const win = Math.max(0, settings.window | 0);
    const skipWe = !!settings.skipWeekend;

    const events = [];
    for (const p of patients) {
      const seqs = [];
      if (p.seq2) seqs.push(2);
      if (p.seq3) seqs.push(3);
      for (const seq of seqs) {
        const due = ymd(addDays(parseD(p.first), (p.interval || 28) * (seq - 1)));
        events.push({ key: p.id + "#" + seq, id: p.id, name: p.name, phone: p.phone, photo: p.photo, seq, due });
      }
    }
    // deterministic order: by due date, then name, then id
    events.sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name, "zh-Hant") || a.id.localeCompare(b.id));

    const dayCount = {};
    const isWeekend = d => { const w = parseD(d).getDay(); return w === 0 || w === 6; };

    for (const ev of events) {
      const preferred = ymd(addDays(parseD(ev.due), -lead));
      const earliest = ymd(addDays(parseD(ev.due), -(lead + win)));
      const latest = ev.due; // never notify after the pickup day
      // candidate ring: preferred, then earlier before later at each distance
      const cands = [];
      const seen = new Set();
      const push = d => { if (d >= earliest && d <= latest && !seen.has(d)) { if (!(skipWe && isWeekend(d) && d !== latest)) { cands.push(d); seen.add(d); } } };
      push(preferred);
      const span = Math.max(lead + win, diffDays(latest, earliest)) + 1;
      for (let dist = 1; dist <= span; dist++) {
        push(ymd(addDays(parseD(preferred), -dist)));
        push(ymd(addDays(parseD(preferred), dist)));
      }
      let assigned = null;
      for (const c of cands) { if ((dayCount[c] || 0) < cap) { assigned = c; break; } }
      if (!assigned) { assigned = preferred; ev.over = true; } // couldn't fit under cap
      dayCount[assigned] = (dayCount[assigned] || 0) + 1;
      ev.notify = assigned;
      ev.status = status[ev.key] || "pending";
    }
    return { events, dayCount, cap };
  }

  /* ---------------- rendering ---------------- */
  const $ = s => document.querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initials = n => (n || "?").trim().slice(-2);

  function render() {
    const sched = buildSchedule();
    renderStats(sched);
    if (currentTab === "sched") renderSchedule(sched); else renderPatients();
    $("#viewHint").textContent = currentTab === "sched"
      ? `每日上限 ${sched.cap} 位 · 共 ${sched.events.filter(e => e.status !== "dispensed").length} 筆待通知`
      : `共 ${patients.length} 位病人`;
  }

  function renderStats(sched) {
    const t = today();
    const todayList = sched.events.filter(e => e.notify === t && e.status !== "dispensed");
    const upcoming = sched.events.filter(e => e.notify >= t && e.status === "pending");
    let peak = 0;
    for (const [d, c] of Object.entries(sched.dayCount)) { if (d >= t && c > peak) peak = c; }
    const cap = sched.cap;
    const data = [
      { lbl: "病人總數", val: patients.length, sub: "位", tone: "" },
      { lbl: "今日要通知", val: todayList.length, sub: "位", tone: "today" },
      { lbl: "待通知（未來）", val: upcoming.length, sub: "筆", tone: "" },
      { lbl: "尖峰單日", val: peak, sub: `/${cap}`, tone: peak >= cap ? "peak" : "" },
    ];
    const box = $("#stats"); box.innerHTML = "";
    for (const s of data) {
      const t2 = el("div", "stat" + (s.tone ? " tone-" + s.tone : ""));
      t2.innerHTML = `<div class="lbl">${s.lbl}</div><div class="val tnum">${s.val}<small>${s.sub}</small></div>`;
      box.appendChild(t2);
    }
  }

  function relTag(d) {
    const dd = diffDays(d, today());
    if (dd < 0) return `<span class="day-rel later">已過期 ${-dd} 天</span>`;
    if (dd === 0) return `<span class="day-rel">今天</span>`;
    if (dd === 1) return `<span class="day-rel soon">明天</span>`;
    if (dd <= 7) return `<span class="day-rel soon">${dd} 天後</span>`;
    return `<span class="day-rel later">${dd} 天後</span>`;
  }

  function renderSchedule(sched) {
    const view = $("#scheduleView"); view.innerHTML = "";
    const active = sched.events.filter(e => e.status !== "dispensed");
    if (patients.length === 0) { view.appendChild(emptyState("plus")); return; }
    if (active.length === 0) { view.appendChild(emptyState("done")); return; }

    // group by notify date
    const byDay = {};
    for (const e of active) (byDay[e.notify] = byDay[e.notify] || []).push(e);
    const days = Object.keys(byDay).sort();

    const list = el("div", "day-list");
    for (const d of days) {
      const evs = byDay[d].sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
      const count = sched.dayCount[d];
      const pct = Math.min(100, Math.round(count / sched.cap * 100));
      const cls = count >= sched.cap ? "full" : count >= sched.cap * 0.7 ? "mid" : "";
      const card = el("div", "day-card" + (d === today() ? " is-today" : ""));
      const dObj = parseD(d);
      card.innerHTML = `
        <div class="day-top">
          <span class="day-date tnum">${d.slice(5).replace("-", "/")}<span class="wd">週${WD[dObj.getDay()]}</span></span>
          ${relTag(d)}
          <div class="load" title="${count} / ${sched.cap} 位">
            <div class="load-bar"><div class="load-fill ${cls}" style="width:${pct}%"></div></div>
            <span class="load-num tnum">${count}<span class="cap">/${sched.cap}</span></span>
          </div>
        </div>`;
      const table = el("table", "roster");
      table.innerHTML = `<thead><tr><th>病人</th><th>次數</th><th>電話</th><th>應領藥日</th><th style="text-align:right">狀態</th></tr></thead>`;
      const tb = el("tbody");
      for (const e of evs) {
        const tr = el("tr");
        const av = e.photo ? `<span class="avatar"><img src="${e.photo}" alt=""></span>` : `<span class="avatar">${esc(initials(e.name))}</span>`;
        const telHref = e.phone ? `<a href="tel:${esc(e.phone.replace(/[^0-9+]/g, ""))}">${esc(e.phone)}</a>` : `<span style="color:var(--faint)">—</span>`;
        tr.innerHTML = `
          <td><span class="pt-name">${av}${esc(e.name)}${e.over ? '<span class="flag-over" title="所有可用日皆已達上限">⚠ 超載</span>' : ""}</span></td>
          <td><span class="seq-tag">第 ${e.seq} 次</span></td>
          <td class="phone">${telHref}</td>
          <td class="due-cell">${e.due.slice(5).replace("-", "/")}</td>
          <td style="text-align:right">
            <span class="status-pills">
              <button class="spill ${e.status === "notified" ? "on-notified" : ""}" data-act="notified" data-key="${e.key}">已通知</button>
              <button class="spill ${e.status === "dispensed" ? "on-dispensed" : ""}" data-act="dispensed" data-key="${e.key}">已領藥</button>
            </span>
          </td>`;
        tb.appendChild(tr);
      }
      table.appendChild(tb);
      card.appendChild(table);
      list.appendChild(card);
    }
    view.appendChild(list);
  }

  function renderPatients() {
    const view = $("#patientsView"); view.innerHTML = "";
    if (patients.length === 0) { view.appendChild(emptyState("plus")); return; }
    const box = el("div", "plist");
    const sorted = [...patients].sort((a, b) => a.first.localeCompare(b.first));
    for (const p of sorted) {
      const seqs = [p.seq2 && "第2次", p.seq3 && "第3次"].filter(Boolean).join("、") || "未選次數";
      const av = p.photo ? `<span class="avatar"><img src="${p.photo}" alt=""></span>` : `<span class="avatar">${esc(initials(p.name))}</span>`;
      const row = el("div", "prow");
      row.innerHTML = `
        ${av}
        <div class="meta">
          <div class="nm">${esc(p.name)} ${p.phone ? `<span style="font-weight:400;color:var(--muted);font-size:.8rem">${esc(p.phone)}</span>` : ""}</div>
          <div class="dt">首次 ${p.first} · 間隔 ${p.interval} 天 · ${seqs}</div>
        </div>
        <div class="acts">
          <button class="btn sm" data-edit="${p.id}">編輯</button>
          <button class="btn sm danger" data-del="${p.id}">刪除</button>
        </div>`;
      box.appendChild(row);
    }
    view.appendChild(box);
  }

  function emptyState(kind) {
    const e = el("div", "empty");
    if (kind === "done") {
      e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
        <h3>目前沒有待通知的病人</h3><p>所有已排程的領藥都已標記為「已領藥」。</p>`;
    } else {
      e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
        <h3>還沒有任何病人資料</h3><p>從左邊拍下處方箋、填入資料，系統會自動安排第 2、3 次的領藥通知日並平均分配。</p>
        <button class="btn" id="btnDemo">載入範例資料看看效果</button>`;
    }
    return e;
  }

  /* ---------------- photo handling ---------------- */
  function handlePhoto(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 800;
        let { width: w, height: h } = img;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        pendingPhoto = cv.toDataURL("image/jpeg", 0.72);
        showPhoto(pendingPhoto);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function showPhoto(src) {
    const drop = $("#photoDrop");
    let img = drop.querySelector("img.preview");
    if (!img) { img = el("img", "preview"); img.alt = "處方箋預覽"; drop.appendChild(img); }
    img.src = src; drop.classList.add("has-img"); $("#photoPh").style.display = "none";
  }
  function clearPhoto() {
    pendingPhoto = null;
    const drop = $("#photoDrop"); const img = drop.querySelector("img.preview");
    if (img) img.remove(); drop.classList.remove("has-img"); $("#photoPh").style.display = "";
    $("#photoInput").value = "";
  }

  /* ---------------- form ---------------- */
  function resetForm() {
    $("#editId").value = ""; $("#fName").value = ""; $("#fPhone").value = "";
    $("#fFirst").value = today(); $("#fInterval").value = settings.defInterval;
    $("#fSeq2").checked = true; $("#fSeq3").checked = true; syncChips();
    clearPhoto();
    $("#formTitle").textContent = "新增病人領藥資料";
    $("#submitBtn").querySelector("span").textContent = "加入排程";
    $("#cancelEdit").style.display = "none";
  }
  function syncChips() {
    $("#chip2").classList.toggle("on", $("#fSeq2").checked);
    $("#chip3").classList.toggle("on", $("#fSeq3").checked);
  }
  function editPatient(id) {
    const p = patients.find(x => x.id === id); if (!p) return;
    $("#editId").value = p.id; $("#fName").value = p.name; $("#fPhone").value = p.phone || "";
    $("#fFirst").value = p.first; $("#fInterval").value = p.interval;
    $("#fSeq2").checked = !!p.seq2; $("#fSeq3").checked = !!p.seq3; syncChips();
    pendingPhoto = p.photo || null;
    if (p.photo) showPhoto(p.photo); else clearPhoto();
    $("#formTitle").textContent = "編輯病人資料";
    $("#submitBtn").querySelector("span").textContent = "儲存變更";
    $("#cancelEdit").style.display = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("#patientForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("#fName").value.trim();
    if (!name) { toast("請輸入姓名", "warn"); return; }
    if (!$("#fSeq2").checked && !$("#fSeq3").checked) { toast("請至少選擇第 2 或第 3 次", "warn"); return; }
    const editId = $("#editId").value;
    const data = {
      name, phone: $("#fPhone").value.trim(),
      first: $("#fFirst").value || today(),
      interval: Math.max(1, parseInt($("#fInterval").value) || settings.defInterval),
      seq2: $("#fSeq2").checked, seq3: $("#fSeq3").checked,
      photo: pendingPhoto,
    };
    if (editId) {
      const p = patients.find(x => x.id === editId); Object.assign(p, data);
      toast("已更新病人資料", "good");
    } else {
      data.id = "p" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
      patients.push(data);
      toast(`已加入 ${name}，領藥通知日已排入`, "good");
    }
    save(K.patients, patients); resetForm(); render();
  });

  $("#cancelEdit").addEventListener("click", resetForm);
  $("#fSeq2").addEventListener("change", syncChips);
  $("#fSeq3").addEventListener("change", syncChips);
  $("#photoInput").addEventListener("change", e => handlePhoto(e.target.files[0]));
  $("#photoClear").addEventListener("click", clearPhoto);

  /* ---------------- delegated clicks ---------------- */
  document.body.addEventListener("click", e => {
    const t = e.target.closest("[data-act],[data-edit],[data-del],#btnDemo");
    if (!t) return;
    if (t.dataset.act) {
      const key = t.dataset.key, act = t.dataset.act;
      status[key] = (status[key] === act) ? "pending" : act; // toggle
      save(K.status, status); render();
    } else if (t.dataset.edit) {
      editPatient(t.dataset.edit);
    } else if (t.dataset.del) {
      const p = patients.find(x => x.id === t.dataset.del);
      if (confirm(`確定刪除「${p ? p.name : ""}」的所有領藥排程？`)) {
        patients = patients.filter(x => x.id !== t.dataset.del);
        delete status[t.dataset.del + "#2"]; delete status[t.dataset.del + "#3"];
        save(K.patients, patients); save(K.status, status); toast("已刪除", "good"); render();
      }
    } else if (t.id === "btnDemo") {
      seedDemo();
    }
  });

  /* ---------------- tabs ---------------- */
  $("#tabSched").addEventListener("click", () => switchTab("sched"));
  $("#tabPatients").addEventListener("click", () => switchTab("patients"));
  function switchTab(tab) {
    currentTab = tab;
    $("#tabSched").classList.toggle("on", tab === "sched");
    $("#tabPatients").classList.toggle("on", tab === "patients");
    $("#scheduleView").style.display = tab === "sched" ? "" : "none";
    $("#patientsView").style.display = tab === "patients" ? "" : "none";
    render();
  }

  /* ---------------- settings ---------------- */
  const settingsMap = { sCap: "cap", sLead: "lead", sWindow: "window", sDefInterval: "defInterval" };
  for (const [id, key] of Object.entries(settingsMap)) {
    const inp = $("#" + id); inp.value = settings[key];
    inp.addEventListener("change", () => { settings[key] = Math.max(0, parseInt(inp.value) || 0); save(K.settings, settings); render(); });
  }
  $("#sSkipWeekend").checked = settings.skipWeekend;
  $("#sSkipWeekend").addEventListener("change", e => { settings.skipWeekend = e.target.checked; save(K.settings, settings); render(); });

  /* ---------------- export / backup / restore / print ---------------- */
  $("#btnExport").addEventListener("click", () => {
    const { events } = buildSchedule();
    const active = events.filter(e => e.status !== "dispensed").sort((a, b) => a.notify.localeCompare(b.notify) || a.name.localeCompare(b.name, "zh-Hant"));
    if (!active.length) { toast("沒有可匯出的排程", "warn"); return; }
    const rows = [["通知日期", "星期", "姓名", "電話", "第幾次", "應領藥日", "狀態"]];
    for (const e of active) rows.push([e.notify, "週" + WD[parseD(e.notify).getDay()], e.name, e.phone || "", "第" + e.seq + "次", e.due, e.status === "notified" ? "已通知" : "待通知"]);
    const csv = "﻿" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    download(csv, "領藥通知排程_" + today() + ".csv", "text/csv");
    toast("已匯出通知排程 CSV", "good");
  });
  $("#btnBackup").addEventListener("click", () => {
    download(JSON.stringify({ patients, settings, status, exportedAt: new Date().toISOString() }, null, 2), "領藥排程備份_" + today() + ".json", "application/json");
    toast("已下載完整備份（含照片）", "good");
  });
  $("#btnRestore").addEventListener("click", () => $("#restoreFile").click());
  $("#restoreFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.patients)) throw 0;
        if (!confirm("還原將覆蓋目前所有資料，確定繼續？")) return;
        patients = d.patients; settings = Object.assign(settings, d.settings || {}); status = d.status || {};
        save(K.patients, patients); save(K.settings, settings); save(K.status, status);
        syncSettingsInputs(); resetForm(); render(); toast("已還原備份資料", "good");
      } catch { toast("檔案格式錯誤，無法還原", "warn"); }
      e.target.value = "";
    };
    r.readAsText(f);
  });
  function syncSettingsInputs() {
    for (const [id, key] of Object.entries(settingsMap)) $("#" + id).value = settings[key];
    $("#sSkipWeekend").checked = settings.skipWeekend;
  }
  $("#btnPrint").addEventListener("click", () => window.print());

  /* ---------------- theme ---------------- */
  const savedTheme = localStorage.getItem("rxsched.theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  $("#btnTheme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("rxsched.theme", next);
  });

  /* ---------------- utils ---------------- */
  function download(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = el("a"); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function toast(msg, kind) {
    const t = el("div", "toast" + (kind ? " " + kind : ""));
    t.textContent = msg; $("#toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s, transform .3s"; t.style.opacity = "0"; t.style.transform = "translateY(8px)"; setTimeout(() => t.remove(), 300); }, 2600);
  }

  /* ---------------- demo seed (shows load balancing) ---------------- */
  function seedDemo() {
    const surnames = "陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴徐周葉蘇莊呂江何蕭羅高潘簡朱鍾游詹胡施沈余趙盧梁";
    const givens = ["淑芬","家豪","雅婷","俊傑","美玲","志明","怡君","建宏","秀英","文雄","麗華","冠廷","佳穎","宗翰","淑惠","承恩","雅雯","柏翰","惠雯","國強","靜怡","智偉","春嬌","嘉玲","世豪"];
    const base = new Date(); base.setDate(base.getDate() - 10);
    const n = 130;
    for (let i = 0; i < n; i++) {
      const d = new Date(base); d.setDate(base.getDate() + Math.floor(Math.random() * 24)); // clustered first-dispense dates
      patients.push({
        id: "demo" + i + Date.now().toString(36) + i,
        name: surnames[Math.floor(Math.random() * surnames.length)] + givens[Math.floor(Math.random() * givens.length)],
        phone: "09" + String(Math.floor(10 + Math.random() * 89)) + "-" + String(Math.floor(100 + Math.random() * 899)) + "-" + String(Math.floor(100 + Math.random() * 899)),
        first: ymd(d), interval: 28, seq2: true, seq3: true, photo: null,
      });
    }
    save(K.patients, patients); render();
    toast(`已載入 ${n} 位範例病人，看看每天如何被壓在上限以內`, "good");
  }

  /* ---------------- init ---------------- */
  resetForm();
  render();
})();
</script>
</body>
</html>
