<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7drKkcTJ8Tr-to422Sh_r_SLz52ASJb0",
    authDomain: "joinup-a4e3d.firebaseapp.com",
    projectId: "joinup-a4e3d",
    storageBucket: "joinup-a4e3d.firebasestorage.app",
    messagingSenderId: "252645221802",
    appId: "1:252645221802:web:6d789d18a38e55c12d37d3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._fbReady = true;
  window.dispatchEvent(new Event("firebase-ready"));

  window.dbGet = async (col, id) => {
    try { const snap = await getDoc(doc(db, col, id)); return snap.exists() ? snap.data() : null; } catch(e) { return null; }
  };
  window.dbSet = async (col, id, data) => {
    try { await setDoc(doc(db, col, id), data); return true; } catch(e) { return false; }
  };
  window.dbDel = async (col, id) => {
    try { await deleteDoc(doc(db, col, id)); return true; } catch(e) { return false; }
  };
  window.dbListen = (col, id, cb) => {
    return onSnapshot(doc(db, col, id), snap => cb(snap.exists() ? snap.data() : null));
  };
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>

body { background: #080d18; font-family: 'DM Sans', sans-serif; color: #dde8f5; min-height: 100vh; }

::-webkit-scrollbar { width: 6px; height: 6px; }

::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 3px; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const DAYS_SHORT = ["一","二","三","四","五","六","日"];
const COLORS = ["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#82E0AA","#F1948A"];
const TIME_SLOTS = [
  { key:"morning",   label:"早上", time:"09:00–12:00", color:"#fbbf24" },
  { key:"lunch",     label:"午餐", time:"12:00–14:00", color:"#f97316" },
  { key:"afternoon", label:"下午", time:"14:00–17:00", color:"#34d399" },
  { key:"dinner",    label:"晚餐", time:"17:00–19:00", color:"#a78bfa" },
  { key:"evening",   label:"晚上", time:"19:00–21:00", color:"#38bdf8" },
];

const ls = {
  get: (k) => { try { const v=localStorage.getItem("ju_"+k); return v?JSON.parse(v):null; } catch{return null;} },
  set: (k,v) => { try { localStorage.setItem("ju_"+k, JSON.stringify(v)); } catch{} },
  del: (k) => { try { localStorage.removeItem("ju_"+k); } catch{} },
};

const DB = {
  get: async (col, id) => {
    if (window._fbReady) {
      const fbData = await window.dbGet(col, id);
      if (fbData) return fbData;
    }
    return ls.get(col+"_"+id);
  },
  set: async (col, id, data) => { ls.set(col+"_"+id, data); if(window._fbReady) await window.dbSet(col, id, data); },
  del: async (col, id) => { ls.del(col+"_"+id); if(window._fbReady) await window.dbDel(col, id); },
};

const fmt = (d) => d ? new Date(d).toLocaleDateString("zh-TW") : "—";

// ── SlotPicker ─────────────────────────────────────────────────────────────
function SlotPicker({ dates, mySlots={}, setMySlots=()=>{}, organizerSlots={}, otherJoiners={}, readOnly=false, countMap={}, maxCount=1, intersect={}, joiners={} }) {
  const [popup, setPopup] = useState(null);
  const [weekPage, setWeekPage] = useState(0);

  const weeks = dates ? (() => { const w=[]; for(let i=0;i<dates.length;i+=7) w.push(dates.slice(i,i+7)); return w; })() : null;
  const totalWeeks = weeks ? weeks.length : 1;
  const pageW = weeks ? weeks[weekPage] : null;
  const diOffset = weekPage * 7;
  const cols = pageW ? pageW.length : 7;
  const headers = pageW
    ? pageW.map(d => { const dt=new Date(d); return { top:`${dt.getMonth()+1}/${dt.getDate()}`, bot:DAYS_SHORT[dt.getDay()===0?6:dt.getDay()-1] }; })
    : DAYS_SHORT.map(d => ({ top:d, bot:"" }));

  const otherNames = Object.keys(otherJoiners);
  const otherCnt = (key) => otherNames.filter(n => otherJoiners[n].slots?.[key]).length;

  const handleClick = (localDi, sk) => {
    const globalDi = dates ? diOffset + localDi : localDi;
    const key = `${globalDi}-${sk}`;
    if (readOnly) {
      const cnt = countMap[key]||0;
      if (cnt===0) { setPopup(null); return; }
      const slot = TIME_SLOTS.find(s=>s.key===sk);
      const d = dates ? dates[globalDi] : null;
      const dateLabel = d ? (()=>{ const dt=new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}(${DAYS_SHORT[dt.getDay()===0?6:dt.getDay()-1]})`; })() : `週${DAYS_SHORT[globalDi]}`;
      const canNames = Object.keys(joiners).filter(n=>joiners[n].slots?.[key]);
      const cannotNames = Object.keys(joiners).filter(n=>!joiners[n].slots?.[key]);
      setPopup(popup?.key===key ? null : { key, slot, dateLabel, canNames, cannotNames });
      return;
    }
    setMySlots(p=>{const n={...p};if(n[key])delete n[key];else n[key]=true;return n;});
    setPopup(null);
  };

  const getCellStyle = (key) => {
    if (readOnly) {
      const cnt=countMap[key]||0, isX=intersect[key];
      if (isX&&maxCount>1) return {bg:"#38bdf8",border:"1px solid #7dd3fc",text:"#fff"};
      if (cnt>0) { const r=cnt/maxCount; return {bg:`rgba(56,189,248,${0.18+r*0.5})`,border:"1px solid transparent",text:"#fff"}; }
      return {bg:"#1e2d45",border:"1px solid transparent",text:"transparent",badge:null};
    }
    const isMine=!!mySlots[key], isOrg=!!organizerSlots[key], others=otherCnt(key);
    const badge = others>0 ? `+${others}` : null;
    if (isMine) return isOrg ? {bg:"#22c55e",border:"2px solid #4ade80",text:"#fff",badge} : {bg:"#16a34a",border:"2px solid #22c55e",text:"#fff",badge};
    if (isOrg) return others>0 ? {bg:"#0f3460",border:"2px solid #38bdf8",text:"#fbbf24",badge:`+${others}`} : {bg:"#0c2a4a",border:"2px solid #38bdf8",text:"transparent",badge:null};
    if (others>0) return {bg:"#2a1a0a",border:"2px solid #f97316",text:"#fb923c",badge:`+${others}`};
    return {bg:"#1a2535",border:"1px solid #2a3f5a",text:"transparent",badge:null};
  };

  return (
    <div style={{userSelect:"none"}}>
      {weeks && totalWeeks>1 && (
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8}}>
          <button onClick={()=>{setWeekPage(p=>Math.max(0,p-1));setPopup(null);}} disabled={weekPage===0}
            style={{background:"#1e2d45",border:"none",borderRadius:7,padding:"7px 14px",color:weekPage===0?"#374a5e":"#dde8f5",cursor:weekPage===0?"default":"pointer",fontWeight:700,fontSize:13,flexShrink:0}}>← 上週</button>
          <span style={{fontSize:12,color:"#6b8aa8",textAlign:"center",lineHeight:1.5}}>
            第 {weekPage+1} / {totalWeeks} 週<br/>
            <span style={{color:"#374a5e",fontSize:11}}>
              {pageW?.[0]?`${new Date(pageW[0]).getMonth()+1}/${new Date(pageW[0]).getDate()}`:""}
              {pageW?.length>1?` ~ ${new Date(pageW[pageW.length-1]).getMonth()+1}/${new Date(pageW[pageW.length-1]).getDate()}`:""}
            </span>
          </span>
          <button onClick={()=>{setWeekPage(p=>Math.min(totalWeeks-1,p+1));setPopup(null);}} disabled={weekPage===totalWeeks-1}
            style={{background:"#1e2d45",border:"none",borderRadius:7,padding:"7px 14px",color:weekPage===totalWeeks-1?"#374a5e":"#dde8f5",cursor:weekPage===totalWeeks-1?"default":"pointer",fontWeight:700,fontSize:13,flexShrink:0}}>下週 →</button>
        </div>
      )}
      <div>
        <div style={{display:"grid",gridTemplateColumns:`80px repeat(${cols},1fr)`,gap:4,marginBottom:6}}>
          <div/>
          {headers.map((h,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"#6b8aa8",lineHeight:1.5}}>{h.top}{h.bot&&<><br/>{h.bot}</>}</div>)}
        </div>
        {TIME_SLOTS.map(slot=>(
          <div key={slot.key} style={{display:"grid",gridTemplateColumns:`80px repeat(${cols},1fr)`,gap:4,marginBottom:5}}>
            <div style={{display:"flex",flexDirection:"column",justifyContent:"center",paddingRight:6}}>
              <span style={{fontSize:12,fontWeight:700,color:slot.color}}>{slot.label}</span>
              <span style={{fontSize:10,color:"#374a5e"}}>{slot.time}</span>
            </div>
            {Array.from({length:cols},(_,localDi)=>{
              const globalDi=dates?diOffset+localDi:localDi, key=`${globalDi}-${slot.key}`;
              const isActive=popup?.key===key, cs=getCellStyle(key);
              const cnt=readOnly?(countMap[key]||0):null;
              const displayText=readOnly?(cnt>0?`${cnt}/${maxCount}`:""):(cs.badge||"");
              return (
                <div key={localDi} onClick={()=>handleClick(localDi,slot.key)}
                  style={{height:40,borderRadius:8,background:cs.bg,border:isActive?"2px solid #fff":cs.border,cursor:"pointer",transition:"all .12s",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:isActive?"#fff":cs.text,transform:isActive?"scale(0.92)":"scale(1)"}}>
                  {displayText}
                </div>
              );
            })}
          </div>
        ))}
      </div>
      {!readOnly && (
        <div style={{marginTop:10,background:"#0b1523",borderRadius:8,padding:"8px 12px",display:"flex",flexDirection:"column",gap:4}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px 16px"}}>
            {[["#1a2535","1px solid #2a3f5a","沒人"],["#0c2a4a","2px solid #38bdf8","主揪可以"],["#22c55e","2px solid #4ade80","我可以"],["#2a1a0a","2px solid #f97316","其他人填了"]].map(([bg,border,label])=>(
              <span key={label} style={{fontSize:11,display:"flex",alignItems:"center",gap:4}}>
                <span style={{width:14,height:14,borderRadius:3,background:bg,border,display:"inline-block"}}/>
                {label}
              </span>
            ))}
          </div>
          <div style={{fontSize:10,color:"#374a5e"}}>點擊格子選取 / 取消 ｜ +數字 = 其他幾人可以</div>
        </div>
      )}
      {readOnly && <div style={{marginTop:6,fontSize:11,color:"#374a5e"}}>點擊格子查看誰可以參加 ｜ 顏色越深 = 越多人</div>}
      {popup && (
        <div style={{marginTop:12,background:"#080d18",border:`1px solid ${popup.slot.color}55`,borderRadius:12,padding:16,position:"relative"}}>
          <button onClick={()=>setPopup(null)} style={{position:"absolute",top:10,right:12,background:"transparent",border:"none",color:"#6b8aa8",cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>
            <span style={{color:popup.slot.color}}>●</span>{" "}
            {popup.dateLabel} <span style={{color:popup.slot.color}}>{popup.slot.label}</span>
            <span style={{fontSize:12,color:"#6b8aa8",marginLeft:6}}>（{popup.slot.time}）</span>
          </div>
          {popup.canNames.length>0&&<div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:"#34d399",fontWeight:700,marginBottom:6}}>✅ 可以參加（{popup.canNames.length}人）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{popup.canNames.map((n,i)=><span key={n} style={{background:COLORS[i%COLORS.length]+"33",border:`1px solid ${COLORS[i%COLORS.length]}66`,borderRadius:7,padding:"4px 12px",fontSize:13,color:COLORS[i%COLORS.length],fontWeight:700}}>{n}</span>)}</div>
          </div>}
          {popup.cannotNames.length>0&&<div>
            <div style={{fontSize:11,color:"#6b8aa8",fontWeight:700,marginBottom:6}}>❌ 不行（{popup.cannotNames.length}人）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{popup.cannotNames.map(n=><span key={n} style={{background:"#1e2d45",border:"1px solid #2a3f5a",borderRadius:7,padding:"4px 12px",fontSize:13,color:"#5a7a9a"}}>{n}</span>)}</div>
          </div>}
          {popup.canNames.length===0&&<div style={{fontSize:13,color:"#374a5e"}}>沒有人選這個時段</div>}
        </div>
      )}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("home");
  const [toast, setToast] = useState("");
  const [groups, setGroups] = useState({});
  const [wishes, setWishes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fbReady, setFbReady] = useState(false);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""),2800); };

  useEffect(()=>{
    const init = async () => {
      const g = await DB.get("app","groups"); if(g?.data) setGroups(g.data);
      const w = await DB.get("app","wishes"); if(w?.data) setWishes(w.data);
      setLoading(false);
    };
    const onReady = () => { setFbReady(true); init(); };
    if (window._fbReady) { setFbReady(true); init(); }
    else { window.addEventListener("firebase-ready", onReady); init(); }
    return () => window.removeEventListener("firebase-ready", onReady);
  },[]);

  const saveGroups = async (next) => {
    setGroups(next);
    await DB.set("app","groups",{data:next,updatedAt:Date.now()});
  };
  const saveWishes = async (next) => {
    setWishes(next);
    await DB.set("app","wishes",{data:next,updatedAt:Date.now()});
  };

  const getDates = (group) => {
    if (!group?.dateStart) return null;
    const start=new Date(group.dateStart), end=group.dateEnd?new Date(group.dateEnd):start;
    const ds=[];
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) ds.push(new Date(d).toISOString().slice(0,10));
    return ds.slice(0,90);
  };

  const buildCountMap = (joiners, dates) => {
    const names=Object.keys(joiners), countMap={}, intersect={};
    if(names.length===0) return {countMap,intersect};
    const cols=dates?dates.length:7;
    TIME_SLOTS.forEach(slot=>{
      Array.from({length:cols},(_,di)=>{
        const key=`${di}-${slot.key}`;
        const cnt=names.filter(n=>joiners[n].slots?.[key]).length;
        if(cnt>0){ countMap[key]=cnt; if(cnt===names.length) intersect[key]=true; }
      });
    });
    return {countMap,intersect};
  };

  const S = {
    root:{minHeight:"100vh",background:"#080d18",fontFamily:"'DM Sans',sans-serif",color:"#dde8f5",paddingBottom:80},
    topbar:{background:"#0f1729",borderBottom:"1px solid #1e2d45",padding:"18px 20px 0"},
    title:{margin:"0 0 14px",fontSize:22,fontWeight:900,fontFamily:"'Syne',sans-serif",background:"linear-gradient(90deg,#38bdf8,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"},
    nav:{display:"flex",gap:1,overflowX:"auto"},
    navBtn:(a)=>({padding:"12px 15px",border:"none",background:"transparent",color:a?"#38bdf8":"#6b8aa8",cursor:"pointer",fontWeight:a?700:500,fontSize:13,borderBottom:a?"2px solid #38bdf8":"2px solid transparent",whiteSpace:"nowrap",transition:"all .15s"}),
    card:{background:"#0f1729",border:"1px solid #1e2d45",borderRadius:14,padding:22,margin:"16px auto",maxWidth:740},
    label:{display:"block",fontSize:11,color:"#6b8aa8",marginBottom:5,fontWeight:700,letterSpacing:.6,textTransform:"uppercase"},
    input:{width:"100%",boxSizing:"border-box",background:"#080d18",border:"1px solid #1e2d45",borderRadius:8,padding:"10px 14px",color:"#dde8f5",fontSize:14,outline:"none"},
    textarea:{width:"100%",boxSizing:"border-box",background:"#080d18",border:"1px solid #1e2d45",borderRadius:8,padding:"10px 14px",color:"#dde8f5",fontSize:14,outline:"none",resize:"vertical",minHeight:72},
    btn:(v="primary")=>({padding:"10px 20px",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,transition:"all .15s",
      background:v==="primary"?"linear-gradient(90deg,#38bdf8,#0ea5e9)":v==="success"?"linear-gradient(90deg,#34d399,#10b981)":v==="danger"?"#dc2626":v==="ghost"?"transparent":"#1e2d45",
      color:v==="ghost"?"#6b8aa8":"#fff",border:v==="ghost"?"1px solid #1e2d45":"none"}),
    badge:(c="#38bdf8")=>({display:"inline-block",background:c+"22",border:`1px solid ${c}55`,borderRadius:6,padding:"2px 10px",fontSize:12,color:c,fontWeight:700}),
    sT:{fontSize:18,fontWeight:800,fontFamily:"'Syne',sans-serif",margin:"0 0 16px",color:"#e2f0ff"},
    div:{borderTop:"1px solid #1e2d45",margin:"14px 0"},
    g2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14},
    g3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:14},
  };
  const F=({label,required,children})=>(<div><label style={S.label}>{label}{required&&<span style={{color:"#f87171"}}> *</span>}</label>{children}</div>);

  // HOME
  const HomeTab=()=>{
    const ids=Object.keys(groups);
    return (<div style={S.card}>
      <h2 style={S.sT}>🎪 所有活動</h2>
      {!fbReady&&<div style={{background:"#1e0a0a",border:"1px solid #f8717144",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#f87171"}}>⚠ Firebase 未設定，資料僅存本機。請完成設定後重新整理。</div>}
      {ids.length===0&&<p style={{color:"#6b8aa8",fontSize:14}}>還沒有活動，去「開團」建立第一個吧！</p>}
      {ids.map((id,i)=>{
        const g=groups[id];
        const jc=Object.keys(g.joiners||{}).length;
        const maxP=g.maxPeople?parseInt(g.maxPeople):null;
        const joinerLimit=maxP?maxP-1:null;
        const isFull=joinerLimit&&jc>=joinerLimit;
        return (<div key={id} onClick={()=>setTab("view-"+id)} style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:12,padding:16,marginBottom:10,cursor:"pointer"}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div>
              <span style={S.badge(COLORS[i%COLORS.length])}># {id}</span>
              <span style={{fontWeight:800,fontSize:15,marginLeft:10}}>{g.activityName}</span>
              {isFull&&<span style={{marginLeft:8,background:"#dc262622",border:"1px solid #dc262655",borderRadius:6,padding:"2px 8px",fontSize:11,color:"#f87171",fontWeight:700}}>額滿</span>}
            </div>
            <span style={{fontSize:12,color:"#6b8aa8"}}>{fmt(g.dateStart)}{g.dateEnd&&g.dateEnd!==g.dateStart?` ～ ${fmt(g.dateEnd)}`:""}</span>
          </div>
          <div style={{marginTop:6,fontSize:12,color:"#8aaac8"}}>
            👤 {g.name} &nbsp;|&nbsp;
            🙋 <span style={{color:isFull?"#f87171":"#8aaac8"}}>{jc}{joinerLimit?`/${joinerLimit}`:""}人</span>
            {g.location&&<> &nbsp;|&nbsp; 📍 {g.location}</>}
            {g.cost&&<> &nbsp;|&nbsp; 💰 {g.cost}</>}
          </div>
        </div>);
      })}
    </div>);
  };

  // ORGANIZER
  const OrganizerTab=()=>{
    const [form,setForm]=useState({id:"",password:"",name:"",dateStart:"",dateEnd:"",hours:"",location:"",activityName:"",description:"",cost:"",maxPeople:""});
    const [organizerSlots,setOrganizerSlots]=useState({});
    const [done,setDone]=useState(null);
    const [idErr,setIdErr]=useState("");
    const set=(k,v)=>setForm(p=>({...p,[k]:v}));
    const submit=async()=>{
      if(!form.id.trim()){showToast("❗ 請填寫開團編號");return;}
      if(!form.password.trim()){showToast("❗ 請設定管理密碼");return;}
      if(!form.name.trim()){showToast("❗ 請填寫姓名");return;}
      if(!form.activityName.trim()){showToast("❗ 請填寫活動名稱");return;}
      const id=form.id.trim().toLowerCase();
      if(groups[id]){setIdErr("此編號已被使用，請換一個");return;}
      setIdErr("");
      const next={...groups,[id]:{...form,id,organizerSlots,joiners:{},createdAt:Date.now()}};
      await saveGroups(next);
      setDone(id); showToast("✅ 開團成功！");
    };
    if(done) return (<div style={S.card}><div style={{textAlign:"center",padding:"20px 0"}}>
      <div style={{fontSize:48}}>🎉</div>
      <h2 style={{...S.sT,textAlign:"center"}}>開團成功！</h2>
      <p style={{color:"#6b8aa8"}}>你的開團編號是：</p>
      <div style={{fontSize:32,fontWeight:900,color:"#38bdf8",letterSpacing:4,fontFamily:"monospace",margin:"10px 0"}}>{done}</div>
      <div style={{background:"#1e0a0a",border:"1px solid #f8717144",borderRadius:8,padding:"10px 16px",margin:"0 auto 16px",maxWidth:320}}>
        <span style={{color:"#f87171",fontSize:13}}>⚠ 請記住你設定的密碼！<br/>管理者頁面輸入編號＋密碼才能進入。</span>
      </div>
      <p style={{color:"#6b8aa8",fontSize:13}}>把編號分享給朋友，讓他們去「跟團」填時間！</p>

        <button style={S.btn("primary")} onClick={()=>setTab("admin")}>前往管理頁面</button>

    return (<div style={S.card}>
      <h2 style={S.sT}>🚀 開團</h2>

        <F label="管理密碼" required><input type="password" style={S.input} placeholder="設定管理用密碼" value={form.password} onChange={e=>set("password",e.target.value)}/><div style={{fontSize:10,color:"#374a5e",marginTop:3}}>管理者頁面需要此密碼</div></F>
      </div>
      <div style={S.g2}>
        <F label="開團者姓名" required><input style={S.input} placeholder="你的名字" value={form.name} onChange={e=>set("name",e.target.value)}/></F>
        <F label="活動名稱" required><input style={S.input} placeholder="例：期末慶功宴" value={form.activityName} onChange={e=>set("activityName",e.target.value)}/></F>
      </div>
      <div style={S.g2}>
        <F label="活動開始日期"><input type="date" style={S.input} value={form.dateStart} onChange={e=>set("dateStart",e.target.value)}/></F>
        <F label="活動結束日期"><input type="date" style={S.input} value={form.dateEnd} min={form.dateStart} onChange={e=>set("dateEnd",e.target.value)}/></F>
      </div>
      <div style={S.g3}>
        <F label="預計時數"><input type="number" style={S.input} placeholder="例：3" min={0} value={form.hours} onChange={e=>set("hours",e.target.value)}/></F>
        <F label="活動費用"><input style={S.input} placeholder="例：NT$500" value={form.cost} onChange={e=>set("cost",e.target.value)}/></F>
        <F label="人數上限（含主揪）"><input type="number" style={S.input} placeholder="例：20" min={1} value={form.maxPeople} onChange={e=>set("maxPeople",e.target.value)}/><div style={{fontSize:10,color:"#374a5e",marginTop:3}}>跟團者上限 = 此數字 - 1</div></F>
      </div>
      <div style={{marginBottom:14}}><F label="活動地點"><input style={S.input} placeholder="例：台北市信義區" value={form.location} onChange={e=>set("location",e.target.value)}/></F></div>
      <F label="活動內容說明"><textarea style={S.textarea} placeholder="詳細描述活動內容…" value={form.description} onChange={e=>set("description",e.target.value)}/></F>
      <div style={{height:20}}/>
      <div style={{background:"#080d18",border:"1px solid #38bdf833",borderRadius:12,padding:16}}>
        <div style={{fontWeight:700,fontSize:14,color:"#38bdf8",marginBottom:4}}>📅 主揪可以的時間 <span style={{fontSize:11,color:"#374a5e",fontWeight:400}}>(選填)</span></div>
        <div style={{fontSize:12,color:"#6b8aa8",marginBottom:12}}>填寫後跟團者可以看到你有空的時段</div>
        {form.dateStart?<SlotPicker dates={getDates(form)} mySlots={organizerSlots} setMySlots={setOrganizerSlots}/>:<div style={{fontSize:12,color:"#374a5e",padding:"12px 0"}}>請先填寫活動日期</div>}
      </div>
      <div style={{height:16}}/>
      <button style={{...S.btn("primary"),width:"100%",padding:"13px"}} onClick={submit}>🚀 開團！</button>
    </div>);
  };

  // JOINER — ✅ 新增人數上限擋截邏輯
  const JoinerTab=()=>{
    const [step,setStep]=useState(1);
    const [gid,setGid]=useState("");
    const [group,setGroup]=useState(null);
    const [name,setName]=useState("");
    const [slots,setSlots]=useState({});
    const [note,setNote]=useState("");
    const [done,setDone]=useState(false);
    const [submitting,setSubmitting]=useState(false);

    const findGroup=()=>{
      const latest=groups[gid.trim().toLowerCase()];
      if(!latest){showToast("❌ 找不到此開團編號");return;}
      setGroup(latest); setStep(2);
    };

    // 計算人數狀態
    const getCapacityInfo = (g) => {
      if (!g) return { isFull: false, joinerCount: 0, joinerLimit: null };
      const joinerCount = Object.keys(g.joiners||{}).length;
      const maxP = g.maxPeople ? parseInt(g.maxPeople) : null;
      const joinerLimit = maxP ? maxP - 1 : null;
      // 如果名字已存在（更新），不算新增
      const isExisting = name.trim() && !!g.joiners?.[name.trim()];
      const isFull = joinerLimit !== null && joinerCount >= joinerLimit && !isExisting;
      return { isFull, joinerCount, joinerLimit, isExisting };
    };

    const submit=async()=>{
      if(!name.trim()){showToast("❗ 請填寫姓名");return;}
      setSubmitting(true);
      const id=gid.trim().toLowerCase();

      // 從 Firebase 讀最新資料（雙重確認）
      const latestData = await DB.get("app","groups");
      const latest = latestData?.data || groups;
      const latestGroup = latest[id];
      if(!latestGroup){ showToast("❌ 活動不存在"); setSubmitting(false); return; }

      // 人數上限最終確認
      const { isFull, isExisting } = getCapacityInfo({ ...latestGroup, joiners: latestGroup.joiners || {} });
      // 重新算：用最新資料 + 當前填的名字
      const latestJoiners = latestGroup.joiners || {};
      const latestCount = Object.keys(latestJoiners).length;
      const maxP = latestGroup.maxPeople ? parseInt(latestGroup.maxPeople) : null;
      const joinerLimit = maxP ? maxP - 1 : null;
      const latestIsExisting = !!latestJoiners[name.trim()];
      const latestIsFull = joinerLimit !== null && latestCount >= joinerLimit && !latestIsExisting;

      if (latestIsFull) {
        showToast("❌ 很抱歉，名額已滿！");
        setGroup(latestGroup);
        setSubmitting(false);
        return;
      }

      const next={...latest,[id]:{...latestGroup,joiners:{...(latestJoiners),[name.trim()]:{slots,note,joinedAt:Date.now()}}}};
      await saveGroups(next);
      setDone(true); showToast("✅ 跟團成功！");
      setSubmitting(false);
    };

    if(done) return (<div style={S.card}><div style={{textAlign:"center",padding:"20px 0"}}>
      <div style={{fontSize:48}}>🙌</div>
      <h2 style={{...S.sT,textAlign:"center"}}>跟團成功！</h2>
      <p style={{color:"#6b8aa8"}}>已送出可用時間，等開團者確認！</p>
      <button style={{...S.btn("primary"),marginTop:16}} onClick={()=>setTab("view-"+gid.trim().toLowerCase())}>查看時間交集</button>
    </div></div>);

    const dates=group?getDates(group):null;
    const { isFull, joinerCount, joinerLimit, isExisting } = getCapacityInfo(group);

    return (<div style={S.card}>
      <h2 style={S.sT}>🙋 跟團</h2>
      {step===1&&<><F label="開團編號"><input style={S.input} placeholder="輸入開團編號" value={gid} onChange={e=>setGid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&findGroup()}/></F><button style={{...S.btn("primary"),marginTop:12}} onClick={findGroup}>查找活動 →</button></>}
      {step===2&&group&&<>
        <div style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:5}}>{group.activityName}</div>
            {/* ── 人數顯示 ── */}
            {joinerLimit !== null && (
              <div style={{
                background: isFull ? "#dc262622" : "#38bdf822",
                border: `1px solid ${isFull ? "#dc262655" : "#38bdf855"}`,
                borderRadius: 8, padding: "4px 12px", fontSize: 13, fontWeight: 700,
                color: isFull ? "#f87171" : "#38bdf8"
              }}>
                🙋 {joinerCount} / {joinerLimit} 人
                {isFull && <span style={{marginLeft:6}}>額滿</span>}
              </div>
            )}
          </div>
          <div style={{fontSize:12,color:"#8aaac8",display:"flex",flexWrap:"wrap",gap:"4px 14px"}}>
            <span>👤 {group.name}</span>
            {group.dateStart&&<span>📅 {fmt(group.dateStart)}{group.dateEnd&&group.dateEnd!==group.dateStart?` ～ ${fmt(group.dateEnd)}`:""}</span>}
            {group.location&&<span>📍 {group.location}</span>}
            {group.cost&&<span>💰 {group.cost}</span>}
          </div>
          {group.description&&<p style={{margin:"8px 0 0",fontSize:12,color:"#5a7a9a"}}>{group.description}</p>}
        </div>

        {/* ── 額滿擋截 Banner ── */}
        {isFull && !isExisting ? (
          <div style={{
            background:"#1a0a0a",
            border:"2px solid #dc2626",
            borderRadius:12,
            padding:"24px 20px",
            textAlign:"center",
            marginBottom:16
          }}>
            <div style={{fontSize:36,marginBottom:8}}>🚫</div>
            <div style={{fontSize:18,fontWeight:800,color:"#f87171",marginBottom:6}}>名額已滿</div>
            <div style={{fontSize:13,color:"#9a4a4a"}}>此活動的跟團名額已額滿（{joinerCount}/{joinerLimit} 人）</div>
            <div style={{fontSize:12,color:"#6b4a4a",marginTop:4}}>請聯絡開團者確認是否有空缺</div>
            <button style={{...S.btn("ghost"),marginTop:16}} onClick={()=>setStep(1)}>← 返回查找其他活動</button>
          </div>
        ) : (
          <>
            <div style={{marginBottom:14}}><F label="你的名字" required><input style={S.input} placeholder="你的名字" value={name} onChange={e=>setName(e.target.value)}/></F>
              {isExisting && <div style={{fontSize:11,color:"#fbbf24",marginTop:4}}>⚠ 此名字已有填寫記錄，送出後會覆蓋</div>}
            </div>
            <label style={S.label}>選擇可以的時間 <span style={{fontWeight:400,fontSize:10,color:"#374a5e"}}>(點擊格子切換)</span></label>
            <SlotPicker dates={dates} mySlots={slots} setMySlots={setSlots} organizerSlots={group.organizerSlots||{}} otherJoiners={Object.fromEntries(Object.entries(group.joiners||{}).filter(([n])=>n!==name.trim()))}/>
            <div style={{height:14}}/>
            <F label="備註"><textarea style={S.textarea} placeholder="有什麼想說的…" value={note} onChange={e=>setNote(e.target.value)}/></F>
            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button style={S.btn("ghost")} onClick={()=>setStep(1)}>← 返回</button>
              <button style={{...S.btn("success"),flex:1,opacity:submitting?0.6:1}} onClick={submit} disabled={submitting}>
                {submitting ? "送出中…" : "🙌 送出跟團！"}
              </button>
            </div>
          </>
        )}
      </>}
    </div>);
  };

  // VIEW
  const ViewTab=({gid})=>{
    const [localGroup,setLocalGroup]=useState(null);
    useEffect(()=>{
      if(window._fbReady && window.dbListen) {
        const unsub=window.dbListen("app","groups",(data)=>{ if(data?.data?.[gid]) setLocalGroup(data.data[gid]); });
        return unsub;
      } else { setLocalGroup(groups[gid]||null); }
    },[gid]);
    const group=localGroup||groups[gid];
    if(!group) return <div style={S.card}><p style={{color:"#f87171"}}>找不到此活動。</p></div>;
    const joiners=group.joiners||{}, names=Object.keys(joiners);
    const dates=getDates(group);
    const hasOrgSlots=group.organizerSlots&&Object.keys(group.organizerSlots).length>0;
    const allParticipants=hasOrgSlots?{[group.name+"（主揪）"]:{slots:group.organizerSlots},...joiners}:joiners;
    const {countMap,intersect}=buildCountMap(allParticipants,dates);
    const totalCount=Object.keys(allParticipants).length;
    const intersectList=[];
    if(totalCount>1)(dates||DAYS_SHORT).forEach((d,di)=>{
      TIME_SLOTS.forEach(slot=>{
        if(intersect[`${di}-${slot.key}`]){
          const lbl=dates?(()=>{const dt=new Date(d);return `${dt.getMonth()+1}/${dt.getDate()}(${DAYS_SHORT[dt.getDay()===0?6:dt.getDay()-1]})`;})():`週${DAYS_SHORT[di]}`;
          intersectList.push(`${lbl} ${slot.label}（${slot.time}）`);
        }
      });
    });
    return (<div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <h2 style={{...S.sT,margin:0}}>📊 {group.activityName}</h2>
        <span style={S.badge()}># {gid}</span>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"5px 14px",fontSize:12,color:"#8aaac8",marginBottom:12}}>
        <span>👤 {group.name}</span>
        {group.dateStart&&<span>📅 {fmt(group.dateStart)}{group.dateEnd&&group.dateEnd!==group.dateStart?` ～ ${fmt(group.dateEnd)}`:""}</span>}
        {group.hours&&<span>⏱ {group.hours}h</span>}
        {group.location&&<span>📍 {group.location}</span>}
        {group.cost&&<span>💰 {group.cost}</span>}
        {group.maxPeople&&<span>👥 上限{group.maxPeople}人（含主揪）</span>}
      </div>
      {group.description&&<p style={{fontSize:12,color:"#6b8aa8",marginBottom:12}}>{group.description}</p>}
      <hr style={S.div}/>
      <div style={{marginBottom:12}}>
        <span style={{fontSize:12,color:"#6b8aa8"}}>跟團者（{names.length}人）：</span>
        {names.map((n,i)=><span key={n} style={{...S.badge(COLORS[i%COLORS.length]),margin:"2px 4px"}}>{n}</span>)}
        {names.length===0&&<span style={{fontSize:13,color:"#374a5e",marginLeft:8}}>還沒有人跟團</span>}
      </div>
      {(names.length>0||hasOrgSlots)&&<>
        <label style={S.label}>時間交集 {hasOrgSlots&&<span style={{fontSize:11,color:"#38bdf8",fontWeight:400}}>(含主揪)</span>}</label>
        <SlotPicker dates={dates} readOnly countMap={countMap} maxCount={totalCount} intersect={intersect} joiners={allParticipants}/>
        {intersectList.length>0&&<div style={{marginTop:14,padding:14,background:"#0a1628",border:"1px solid #38bdf844",borderRadius:10}}>
          <div style={{fontWeight:700,color:"#38bdf8",marginBottom:8,fontSize:13}}>✨ 所有人都可以的時段</div>
          {intersectList.map((s,i)=><div key={i} style={{fontSize:13,color:"#bae6fd",marginBottom:3}}>• {s}</div>)}
        </div>}
        {names.some(n=>joiners[n].note)&&<><hr style={S.div}/><label style={S.label}>備註</label>{names.filter(n=>joiners[n].note).map((n,i)=><div key={n} style={{fontSize:13,marginBottom:6}}><span style={S.badge(COLORS[i%COLORS.length])}>{n}</span><span style={{color:"#8aaac8",marginLeft:8}}>{joiners[n].note}</span></div>)}</>}
      </>}
    </div>);
  };

  // ADMIN — ✅ 新增「修改主揪時段」獨立子頁面
  const AdminTab=()=>{
    const [step,setStep]=useState(1);
    const [gid,setGid]=useState(""), [pw,setPw]=useState(""), [authedId,setAuthedId]=useState(null);
    const [editGroup,setEditGroup]=useState(null), [editJoiner,setEditJoiner]=useState(null), [editSlots,setEditSlots]=useState({});
    const [editingOrgSlots,setEditingOrgSlots]=useState(false); // ✅ 新增：是否在編輯主揪時段
    const [orgSlotsDraft,setOrgSlotsDraft]=useState({});        // ✅ 新增：主揪時段草稿

    const login=()=>{
      const id=gid.trim().toLowerCase(), g=groups[id];
      if(!g){showToast("❌ 找不到此開團編號");return;}
      if(g.password!==pw){showToast("❌ 密碼錯誤");return;}
      setAuthedId(id); setEditGroup({...g}); setStep(2);
    };
    const group=authedId?groups[authedId]:null;
    const dates=group?getDates(group):null;

    const saveGroupInfo=async()=>{ const next={...groups,[authedId]:{...groups[authedId],...editGroup}}; await saveGroups(next); showToast("✅ 已更新活動資訊"); };
    const deleteGroup=async()=>{ if(!window.confirm(`確定刪除整個活動「${group?.activityName}」？`)) return; const next={...groups}; delete next[authedId]; await saveGroups(next); setStep(1);setAuthedId(null);setGid("");setPw(""); showToast("🗑 活動已刪除"); };
    const deleteJoiner=async(name)=>{ const next={...groups}; delete next[authedId].joiners[name]; await saveGroups(next); showToast(`🗑 已刪除 ${name}`); };
    const openEditJoiner=(name)=>{ const data=groups[authedId].joiners[name]; setEditJoiner({name,note:data.note||""}); setEditSlots({...(data.slots||{})}); };
    const saveJoiner=async()=>{ const next={...groups}; next[authedId].joiners[editJoiner.name]={...next[authedId].joiners[editJoiner.name],slots:editSlots,note:editJoiner.note}; await saveGroups(next); setEditJoiner(null); showToast("✅ 已更新跟團者資料"); };
    const set=(k,v)=>setEditGroup(p=>({...p,[k]:v}));

    // ✅ 開始編輯主揪時段
    const openEditOrgSlots=()=>{
      setOrgSlotsDraft({...(groups[authedId]?.organizerSlots||{})});
      setEditingOrgSlots(true);
    };
    // ✅ 儲存主揪時段
    const saveOrgSlots=async()=>{
      const next={...groups,[authedId]:{...groups[authedId],organizerSlots:orgSlotsDraft}};
      await saveGroups(next);
      setEditingOrgSlots(false);
      showToast("✅ 已更新主揪可用時段");
    };

    if(step===1) return (<div style={S.card}>
      <h2 style={S.sT}>🔐 開團者登入</h2>
      <p style={{fontSize:13,color:"#6b8aa8",marginBottom:16}}>輸入開團編號與管理密碼</p>
      <div style={{marginBottom:14}}><F label="開團編號"><input style={S.input} placeholder="開團編號" value={gid} onChange={e=>setGid(e.target.value)}/></F></div>
      <div style={{marginBottom:16}}><F label="管理密碼"><input type="password" style={S.input} placeholder="開團時設定的密碼" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/></F></div>
      <button style={{...S.btn("primary"),width:"100%"}} onClick={login}>登入管理 →</button>
    </div>);

    // ✅ 主揪時段編輯獨立子頁面
    if(editingOrgSlots) return (<div style={S.card}>
      <h2 style={S.sT}>📅 修改主揪可用時段</h2>
      <div style={{fontSize:13,color:"#6b8aa8",marginBottom:16}}>
        以 <span style={{color:"#38bdf8",fontWeight:700}}>{group?.name}</span> 的身份編輯有空的時間
      </div>
      {dates ? (
        <SlotPicker
          dates={dates}
          mySlots={orgSlotsDraft}
          setMySlots={setOrgSlotsDraft}
          otherJoiners={groups[authedId]?.joiners||{}}
        />
      ) : (
        <div style={{background:"#1e0a0a",border:"1px solid #f8717144",borderRadius:8,padding:"12px 14px",fontSize:13,color:"#f87171"}}>
          ⚠ 此活動未設定日期範圍，請先在「活動資訊」中填寫日期。
        </div>
      )}
      <div style={{display:"flex",gap:10,marginTop:16}}>
        <button style={S.btn("ghost")} onClick={()=>setEditingOrgSlots(false)}>← 返回管理</button>
        <button style={{...S.btn("success"),flex:1}} onClick={saveOrgSlots}>💾 儲存時段</button>
      </div>
    </div>);

    if(editJoiner) return (<div style={S.card}>
      <h2 style={S.sT}>✏️ 修改跟團者：{editJoiner.name}</h2>
      <label style={S.label}>可以的時間</label>
      <SlotPicker dates={dates} mySlots={editSlots} setMySlots={setEditSlots} organizerSlots={groups[authedId]?.organizerSlots||{}} otherJoiners={Object.fromEntries(Object.entries(groups[authedId]?.joiners||{}).filter(([n])=>n!==editJoiner?.name))}/>
      <div style={{height:14}}/>
      <F label="備註"><textarea style={S.textarea} value={editJoiner.note} onChange={e=>setEditJoiner(p=>({...p,note:e.target.value}))}/></F>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <button style={S.btn("ghost")} onClick={()=>setEditJoiner(null)}>← 返回</button>
        <button style={{...S.btn("success"),flex:1}} onClick={saveJoiner}>💾 儲存修改</button>
      </div>
    </div>);

    const joiners=group?.joiners||{}, names=Object.keys(joiners);
    const maxP=group?.maxPeople?parseInt(group.maxPeople):null;
    const joinerLimit=maxP?maxP-1:null;

    return (<div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h2 style={{...S.sT,margin:0}}>⚙️ 管理：{group?.activityName}</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button style={S.btn("ghost")} onClick={()=>setTab("view-"+authedId)}>查看交集</button>
          <button style={{...S.btn("danger"),padding:"8px 14px",fontSize:12}} onClick={deleteGroup}>🗑 刪除活動</button>
          <button style={S.btn("ghost")} onClick={()=>{setStep(1);setAuthedId(null);setGid("");setPw("");}}>登出</button>
        </div>
      </div>

      {/* ✅ 主揪時段編輯入口 */}
      <div style={{background:"#080d18",border:"1px solid #38bdf833",borderRadius:10,padding:14,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontWeight:700,fontSize:14,color:"#38bdf8",marginBottom:3}}>📅 主揪可用時段</div>
          <div style={{fontSize:12,color:"#6b8aa8"}}>
            {Object.keys(groups[authedId]?.organizerSlots||{}).length > 0
              ? `已設定 ${Object.keys(groups[authedId].organizerSlots).length} 個時段`
              : "尚未設定時段"}
          </div>
        </div>
        <button style={S.btn("primary")} onClick={openEditOrgSlots}>✏️ 修改主揪時段</button>
      </div>

      <div style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:16,marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:14,color:"#e2f0ff",marginBottom:12}}>✏️ 活動資訊</div>
        <div style={S.g2}><F label="活動名稱"><input style={S.input} value={editGroup?.activityName||""} onChange={e=>set("activityName",e.target.value)}/></F><F label="開團者姓名"><input style={S.input} value={editGroup?.name||""} onChange={e=>set("name",e.target.value)}/></F></div>
        <div style={S.g2}><F label="開始日期"><input type="date" style={S.input} value={editGroup?.dateStart||""} onChange={e=>set("dateStart",e.target.value)}/></F><F label="結束日期"><input type="date" style={S.input} value={editGroup?.dateEnd||""} onChange={e=>set("dateEnd",e.target.value)}/></F></div>
        <div style={S.g3}><F label="時數"><input type="number" style={S.input} value={editGroup?.hours||""} onChange={e=>set("hours",e.target.value)}/></F><F label="費用"><input style={S.input} value={editGroup?.cost||""} onChange={e=>set("cost",e.target.value)}/></F>
          <F label="人數上限（含主揪）"><input type="number" style={S.input} value={editGroup?.maxPeople||""} onChange={e=>set("maxPeople",e.target.value)}/><div style={{fontSize:10,color:"#374a5e",marginTop:3}}>跟團上限 = {editGroup?.maxPeople?(parseInt(editGroup.maxPeople)-1)+"人":"未設定"}</div></F>
        </div>
        <div style={{marginBottom:14}}><F label="地點"><input style={S.input} value={editGroup?.location||""} onChange={e=>set("location",e.target.value)}/></F></div>
        <F label="說明"><textarea style={S.textarea} value={editGroup?.description||""} onChange={e=>set("description",e.target.value)}/></F>
        <button style={{...S.btn("success"),marginTop:12}} onClick={saveGroupInfo}>💾 儲存活動資訊</button>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:700,fontSize:14,color:"#e2f0ff"}}>🙋 跟團者（{names.length}{joinerLimit?`/${joinerLimit}`:""}人）</div>
        {joinerLimit&&<span style={{fontSize:12,color:names.length>=joinerLimit?"#f87171":"#34d399"}}>{names.length>=joinerLimit?"⛔ 額滿":`還剩 ${joinerLimit-names.length} 個名額`}</span>}
      </div>
      {names.length===0&&<p style={{fontSize:13,color:"#374a5e"}}>還沒有人跟團</p>}
      {names.map((n,i)=>{
        const j=joiners[n], slotLabels=TIME_SLOTS.filter(slot=>Object.keys(j.slots||{}).some(k=>k.endsWith("-"+slot.key)));
        return (<div key={n} style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <span style={S.badge(COLORS[i%COLORS.length])}>{n}</span>
            <div style={{display:"flex",gap:8}}>
              <button style={{...S.btn("secondary"),padding:"6px 14px",fontSize:12}} onClick={()=>openEditJoiner(n)}>✏️ 修改</button>
              <button style={{...S.btn("danger"),padding:"6px 14px",fontSize:12}} onClick={()=>{if(window.confirm(`確定刪除 ${n} 的跟團資料？`)) deleteJoiner(n);}}>🗑 刪除</button>
            </div>
          </div>
          {j.note&&<div style={{fontSize:12,color:"#6b8aa8",marginTop:6}}>備註：{j.note}</div>}
          <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>{slotLabels.map(s=><span key={s.key} style={S.badge(s.color)}>{s.label} {s.time}</span>)}{slotLabels.length===0&&<span style={{fontSize:12,color:"#374a5e"}}>未選任何時段</span>}</div>
        </div>);
      })}
    </div>);
  };

  // SUPERADMIN — 網頁管理員
  const SuperAdminTab=()=>{
    const [step,setStep]=useState(1);
    const [pw,setPw]=useState("");
    const [authed,setAuthed]=useState(false);
    const [subPage,setSubPage]=useState("dashboard"); // dashboard | group-{id} | joiner-{id}-{name}
    const [editGroup,setEditGroup]=useState(null);
    const [editJoiner,setEditJoiner]=useState(null);
    const [editSlots,setEditSlots]=useState({});

    const login=async()=>{
      if(!pw.trim()){showToast("❗ 請輸入密碼");return;}
      const adminData=await DB.get("app","admin");
      if(!adminData?.password){showToast("❌ 尚未設定管理員密碼");return;}
      if(adminData.password!==pw){showToast("❌ 密碼錯誤");return;}
      setAuthed(true);setStep(2);
    };

    const allIds=Object.keys(groups);
    const totalGroups=allIds.length;
    const totalJoiners=allIds.reduce((s,id)=>s+Object.keys(groups[id].joiners||{}).length,0);
    const totalWishes=wishes.length;

    // 刪除整個活動
    const deleteGroup=async(id)=>{
      if(!window.confirm(`確定刪除活動「${groups[id]?.activityName}」？`))return;
      const next={...groups}; delete next[id];
      await saveGroups(next); showToast("🗑 活動已刪除");
      setSubPage("dashboard");
    };

    // 刪除跟團者
    const deleteJoiner=async(gid,name)=>{
      if(!window.confirm(`確定刪除「${name}」的跟團資料？`))return;
      const next={...groups}; delete next[gid].joiners[name];
      await saveGroups(next); showToast(`🗑 已刪除 ${name}`);
      setSubPage("group-"+gid);
    };

    // 開啟編輯跟團者
    const openEditJoiner=(gid,name)=>{
      const data=groups[gid].joiners[name];
      setEditJoiner({gid,name,note:data.note||""});
      setEditSlots({...(data.slots||{})});
      setSubPage("joiner-"+gid+"-"+name);
    };

    // 儲存跟團者
    const saveJoiner=async()=>{
      const {gid,name}=editJoiner;
      const next={...groups};
      next[gid].joiners[name]={...next[gid].joiners[name],slots:editSlots,note:editJoiner.note};
      await saveGroups(next); showToast("✅ 已更新"); setSubPage("group-"+gid);
    };

    // 刪除許願
    const deleteWish=async(i)=>{
      await saveWishes(wishes.filter((_,j)=>j!==i)); showToast("🗑 已刪除許願");
    };

    if(!authed) return (<div style={S.card}>
      <h2 style={S.sT}>🛡 網頁管理員登入</h2>
      <p style={{fontSize:13,color:"#6b8aa8",marginBottom:16}}>此區域僅限網站管理員使用</p>
      <div style={{marginBottom:16}}><F label="管理員密碼"><input type="password" style={S.input} placeholder="輸入管理員密碼" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/></F></div>
      <button style={{...S.btn("primary"),width:"100%"}} onClick={login}>登入 →</button>
    </div>);

    // 編輯跟團者子頁面
    if(subPage.startsWith("joiner-")&&editJoiner){
      const {gid}=editJoiner;
      const dates=getDates(groups[gid]);
      return (<div style={S.card}>
        <h2 style={S.sT}>✏️ 修改跟團者：{editJoiner.name}</h2>
        <div style={{fontSize:12,color:"#6b8aa8",marginBottom:12}}>活動：{groups[gid]?.activityName}</div>
        <label style={S.label}>可以的時間</label>
        <SlotPicker dates={dates} mySlots={editSlots} setMySlots={setEditSlots} organizerSlots={groups[gid]?.organizerSlots||{}} otherJoiners={Object.fromEntries(Object.entries(groups[gid]?.joiners||{}).filter(([n])=>n!==editJoiner.name))}/>
        <div style={{height:14}}/>
        <F label="備註"><textarea style={S.textarea} value={editJoiner.note} onChange={e=>setEditJoiner(p=>({...p,note:e.target.value}))}/></F>
        <div style={{display:"flex",gap:10,marginTop:14}}>
          <button style={S.btn("ghost")} onClick={()=>setSubPage("group-"+editJoiner.gid)}>← 返回</button>
          <button style={{...S.btn("success"),flex:1}} onClick={saveJoiner}>💾 儲存</button>
        </div>
      </div>);
    }

    // 單一活動詳情子頁面
    if(subPage.startsWith("group-")){
      const gid=subPage.replace("group-","");
      const g=groups[gid]; if(!g) return null;
      const joiners=g.joiners||{}, names=Object.keys(joiners);
      const dates=getDates(g);
      const maxP=g.maxPeople?parseInt(g.maxPeople):null;
      const joinerLimit=maxP?maxP-1:null;
      return (<div style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <h2 style={{...S.sT,margin:0}}>⚙️ {g.activityName}</h2>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button style={S.btn("ghost")} onClick={()=>setTab("view-"+gid)}>查看交集</button>
            <button style={{...S.btn("danger"),padding:"8px 14px",fontSize:12}} onClick={()=>deleteGroup(gid)}>🗑 刪除活動</button>
            <button style={S.btn("ghost")} onClick={()=>setSubPage("dashboard")}>← 返回</button>
          </div>
        </div>
        <div style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:16,fontSize:12,color:"#8aaac8",display:"flex",flexWrap:"wrap",gap:"4px 14px"}}>
          <span>👤 {g.name}</span>
          {g.dateStart&&<span>📅 {fmt(g.dateStart)}{g.dateEnd&&g.dateEnd!==g.dateStart?` ～ ${fmt(g.dateEnd)}`:""}</span>}
          {g.location&&<span>📍 {g.location}</span>}
          {g.cost&&<span>💰 {g.cost}</span>}
          {joinerLimit&&<span>👥 {names.length}/{joinerLimit}人</span>}
        </div>
        <div style={{fontWeight:700,fontSize:14,color:"#e2f0ff",marginBottom:10}}>🙋 跟團者（{names.length}人）</div>
        {names.length===0&&<p style={{fontSize:13,color:"#374a5e"}}>還沒有人跟團</p>}
        {names.map((n,i)=>{
          const j=joiners[n], slotLabels=TIME_SLOTS.filter(slot=>Object.keys(j.slots||{}).some(k=>k.endsWith("-"+slot.key)));
          return (<div key={n} style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <span style={S.badge(COLORS[i%COLORS.length])}>{n}</span>
              <div style={{display:"flex",gap:8}}>
                <button style={{...S.btn("secondary"),padding:"6px 14px",fontSize:12}} onClick={()=>openEditJoiner(gid,n)}>✏️ 修改</button>
                <button style={{...S.btn("danger"),padding:"6px 14px",fontSize:12}} onClick={()=>deleteJoiner(gid,n)}>🗑 刪除</button>
              </div>
            </div>
            {j.note&&<div style={{fontSize:12,color:"#6b8aa8",marginTop:6}}>備註：{j.note}</div>}
            <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>{slotLabels.map(s=><span key={s.key} style={S.badge(s.color)}>{s.label} {s.time}</span>)}{slotLabels.length===0&&<span style={{fontSize:12,color:"#374a5e"}}>未選任何時段</span>}</div>
          </div>);
        })}
      </div>);
    }

    // Dashboard 主頁面
    return (<div style={S.card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:8}}>
        <h2 style={{...S.sT,margin:0}}>🛡 網頁管理員</h2>
        <button style={S.btn("ghost")} onClick={()=>{setAuthed(false);setPw("");}}>登出</button>
      </div>

      {/* 數據統計 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
        {[["🎪","活動數",totalGroups,"#38bdf8"],["🙋","跟團人次",totalJoiners,"#34d399"],["🌟","許願數",totalWishes,"#a78bfa"]].map(([icon,label,val,color])=>(
          <div key={label} style={{background:"#080d18",border:`1px solid ${color}33`,borderRadius:12,padding:16,textAlign:"center"}}>
            <div style={{fontSize:24}}>{icon}</div>
            <div style={{fontSize:28,fontWeight:900,color,fontFamily:"'Syne',sans-serif"}}>{val}</div>
            <div style={{fontSize:11,color:"#6b8aa8",marginTop:2}}>{label}</div>
          </div>
        ))}
      </div>

      {/* 所有活動列表 */}
      <div style={{fontWeight:700,fontSize:14,color:"#e2f0ff",marginBottom:10}}>🎪 所有活動</div>
      {allIds.length===0&&<p style={{fontSize:13,color:"#374a5e",marginBottom:16}}>目前沒有活動</p>}
      {allIds.map((id,i)=>{
        const g=groups[id], jc=Object.keys(g.joiners||{}).length;
        const maxP=g.maxPeople?parseInt(g.maxPeople):null;
        const joinerLimit=maxP?maxP-1:null;
        const isFull=joinerLimit&&jc>=joinerLimit;
        return (<div key={id} style={{background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div style={{cursor:"pointer",flex:1}} onClick={()=>setSubPage("group-"+id)}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={S.badge(COLORS[i%COLORS.length])}># {id}</span>
              <span style={{fontWeight:700,fontSize:14}}>{g.activityName}</span>
              {isFull&&<span style={{background:"#dc262622",border:"1px solid #dc262655",borderRadius:6,padding:"2px 8px",fontSize:11,color:"#f87171",fontWeight:700}}>額滿</span>}
            </div>
            <div style={{fontSize:12,color:"#6b8aa8",marginTop:4}}>
              👤 {g.name} ｜ 🙋 {jc}{joinerLimit?`/${joinerLimit}`:""}人 ｜ 📅 {fmt(g.dateStart)}
            </div>
          </div>
          <button style={{...S.btn("danger"),padding:"6px 14px",fontSize:12}} onClick={()=>deleteGroup(id)}>🗑</button>
        </div>);
      })}

      {/* 許願池管理 */}
      <hr style={{...S.div,margin:"20px 0"}}/>
      <div style={{fontWeight:700,fontSize:14,color:"#e2f0ff",marginBottom:10}}>🌟 許願池（{wishes.length}）</div>
      {wishes.length===0&&<p style={{fontSize:13,color:"#374a5e"}}>許願池是空的</p>}
      {wishes.map((w,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:8}}>
          <div><div style={{fontSize:13}}>{w.content}</div><div style={{fontSize:11,color:"#374a5e",marginTop:3}}>{new Date(w.time).toLocaleString("zh-TW")}</div></div>
          <button style={{...S.btn("danger"),padding:"4px 10px",fontSize:12}} onClick={()=>deleteWish(i)}>🗑</button>
        </div>
      ))}
    </div>);
  };

  // WISH
  const WishTab=()=>{
    const [content,setContent]=useState("");
    const submit=async()=>{ if(!content.trim()){showToast("❗ 請填寫許願內容");return;} await saveWishes([{content:content.trim(),time:Date.now()},...wishes]); setContent(""); showToast("🌟 許願成功！"); };
    return (<div style={S.card}>
      <h2 style={S.sT}>🌟 許願池</h2>
      <p style={{fontSize:13,color:"#6b8aa8",marginBottom:14}}>有什麼想玩的活動？許個願吧！大家都看得到 ✨</p>
      <F label="你想玩什麼？"><textarea style={S.textarea} placeholder="例：想去爬山、想辦桌遊之夜…" value={content} onChange={e=>setContent(e.target.value)}/></F>
      <button style={{...S.btn("primary"),marginTop:12}} onClick={submit}>🌟 投入許願池</button>
      {wishes.length>0&&<><hr style={S.div}/><label style={S.label}>許願清單（{wishes.length}）</label></>}
      {wishes.map((w,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",background:"#080d18",border:"1px solid #1e2d45",borderRadius:10,padding:14,marginBottom:8}}>
          <div><div style={{fontSize:14}}>{w.content}</div><div style={{fontSize:11,color:"#374a5e",marginTop:4}}>{new Date(w.time).toLocaleString("zh-TW")}</div></div>
          <button style={{...S.btn("ghost"),padding:"4px 10px",fontSize:12}} onClick={async()=>{await saveWishes(wishes.filter((_,j)=>j!==i));showToast("🗑 已刪除");}}>✕</button>
        </div>
      ))}
      {wishes.length===0&&<p style={{color:"#374a5e",fontSize:13,marginTop:14}}>許願池是空的，快來許願！</p>}
    </div>);
  };

  const isView=tab.startsWith("view-");
  const viewGid=isView?tab.replace("view-",""):null;
  const navItems=[{key:"home",label:"🏠 活動列表"},{key:"organizer",label:"🚀 開團"},{key:"joiner",label:"🙋 跟團"},{key:"admin",label:"🔐 開團者"},{key:"superadmin",label:"🛡 網頁管理員"},{key:"wish",label:"🌟 許願池"}];

  return (
    <div style={S.root}>
      <div style={S.topbar}>
        <h1 style={S.title}>🎯 JoinUp</h1>
        <div style={S.nav}>
          {navItems.map(({key,label})=><button key={key} style={S.navBtn(tab===key)} onClick={()=>setTab(key)}>{label}</button>)}
          {isView&&<button style={S.navBtn(true)}>📊 活動詳情</button>}
        </div>
      </div>
      <div style={{padding:"0 10px"}}>
        {loading&&<div style={{textAlign:"center",padding:40,color:"#374a5e"}}>載入中…</div>}
        {!loading&&tab==="home"&&<HomeTab/>}
        {!loading&&tab==="organizer"&&<OrganizerTab/>}
        {!loading&&tab==="joiner"&&<JoinerTab/>}
        {!loading&&tab==="admin"&&<AdminTab/>}
        {!loading&&tab==="superadmin"&&<SuperAdminTab/>}
        {!loading&&tab==="wish"&&<WishTab/>}
        {!loading&&isView&&<ViewTab gid={viewGid}/>}
      </div>
      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#0f1729",border:"1px solid #38bdf8",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:600,color:"#38bdf8",zIndex:999,boxShadow:"0 4px 24px #38bdf822",whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
