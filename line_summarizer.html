<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 對話重點整理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface2: #f2f1ed;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #5b4de8;
    --accent-light: #eeedfe;
    --accent-mid: #7f77dd;
    --green: #1D9E75;
    --amber: #BA7517;
    --red: #cf1322;
    --line-green: #06C755;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .wrapper { max-width: 720px; margin: 0 auto; }

  .header { margin-bottom: 2rem; }
  .header h1 {
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .line-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; background: var(--line-green);
    border-radius: 8px; flex-shrink: 0;
  }
  .line-badge svg { width: 18px; height: 18px; fill: white; }
  .header p { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem;
  }
  .card-label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px;
  }

  /* Tabs */
  .tabs {
    display: flex; border: 1px solid var(--border2);
    border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 14px;
  }
  .tab {
    flex: 1; padding: 9px 0; text-align: center; font-size: 14px;
    font-weight: 500; cursor: pointer; background: var(--surface2);
    color: var(--muted); border: none; font-family: inherit; transition: all 0.15s;
  }
  .tab:not(:last-child) { border-right: 1px solid var(--border2); }
  .tab.active { background: var(--accent-light); color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Upload */
  .upload-area {
    border: 2px dashed var(--border2); border-radius: var(--radius-sm);
    padding: 2.5rem 1rem; text-align: center; cursor: pointer;
    transition: all 0.15s; background: var(--surface2); position: relative;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent-mid); background: var(--accent-light);
  }
  .upload-area input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-label { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .upload-hint { font-size: 13px; color: var(--muted); }

  .file-selected {
    display: none; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--accent-light); border: 1px solid var(--accent-mid);
    border-radius: var(--radius-sm); margin-top: 10px;
    font-size: 14px; color: var(--accent);
  }
  .file-selected.show { display: flex; }
  .file-remove {
    margin-left: auto; cursor: pointer; font-size: 16px;
    color: var(--muted); background: none; border: none; font-family: inherit;
  }

  textarea {
    width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--text); outline: none;
    transition: border-color 0.15s; min-height: 180px; resize: vertical; line-height: 1.65;
  }
  textarea:focus { border-color: var(--accent-mid); background: var(--surface); }

  /* Time filter */
  .time-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill {
    font-size: 13px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .pill:hover { border-color: var(--accent-mid); color: var(--text); }
  .pill.active { background: var(--accent-light); border-color: var(--accent-mid); color: var(--accent); font-weight: 500; }

  .custom-range {
    display: none; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px;
  }
  .custom-range.show { display: flex; }
  .custom-range label { font-size: 13px; color: var(--muted); }
  .custom-range input[type="date"] {
    font-family: inherit; font-size: 13px; padding: 6px 10px;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--text); outline: none;
  }
  .custom-range input[type="date"]:focus { border-color: var(--accent-mid); }

  .detected-range {
    font-size: 12px; color: var(--green); margin-top: 8px; display: none;
  }
  .detected-range.show { display: block; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    font-size: 13px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .chip:hover { border-color: var(--accent-mid); color: var(--text); }
  .chip.active { background: var(--accent-light); border-color: var(--accent-mid); color: var(--accent); font-weight: 500; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 15px; font-weight: 500;
    padding: 11px 24px; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: white;
    border-radius: 50%; animation: spin 0.65s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress */
  .progress-bar { width: 100%; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin: 1rem 0 0.5rem; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.3s ease; }
  .progress-label { font-size: 13px; color: var(--muted); }

  /* Error */
  .error {
    background: #fff1f0; border: 1px solid #ffa39e; color: var(--red);
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; margin-top: 1rem;
  }

  /* Result */
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 1.5rem; }
  .result-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .result-header-left { display: flex; flex-direction: column; gap: 3px; }
  .result-header-left span { font-size: 14px; font-weight: 600; }
  .result-range { font-size: 12px; color: var(--muted); }
  .copy-btn {
    font-size: 12px; padding: 4px 12px; border: 1px solid var(--border2);
    border-radius: 999px; background: transparent; cursor: pointer;
    color: var(--muted); font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .copy-btn:hover { background: var(--surface2); color: var(--text); }
  .result-body { padding: 1.25rem; }

  .section { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

  .summary-text { font-size: 15px; line-height: 1.8; color: var(--text); }
  .mood-text { font-size: 14px; line-height: 1.7; color: var(--text); padding: 8px 12px; background: var(--surface2); border-radius: var(--radius-sm); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 500; }

  .item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14px; line-height: 1.65; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; padding-bottom: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 8px; flex-shrink: 0; }
  .dot-purple { background: var(--accent-mid); }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--amber); }
  .dot-red { background: var(--red); }
  .dot-blue { background: #378ADD; }
  .dot-teal { background: #1D9E75; }

  .speaker-item { padding: 8px 12px; background: var(--surface2); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 14px; line-height: 1.6; }
  .speaker-item:last-child { margin-bottom: 0; }
  .speaker-name { font-weight: 600; color: var(--accent); margin-right: 6px; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>
      <div class="line-badge">
        <svg viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
      </div>
      LINE 對話重點整理
    </h1>
    <p>上傳或貼上對話，AI 自動分析重點、說話者、話題與氛圍</p>
  </div>

  <!-- 輸入方式 -->
  <div class="card">
    <div class="card-label">輸入對話</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('paste')">✏️ 貼上文字</button>
      <button class="tab" onclick="switchTab('upload')">📁 上傳檔案</button>
    </div>

    <div class="tab-panel active" id="panel-paste">
      <textarea id="chatInput" placeholder="從 LINE 複製對話貼入，格式如下：

2024/04/07(日)
10:32  小明  明天的會議幾點開始？
10:33  小華  下午3點，記得帶企劃書

或是舊格式：
[2024/04/07 10:32] 小明：明天的會議幾點開始？"></textarea>
    </div>

    <div class="tab-panel" id="panel-upload">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept=".txt" onchange="handleFile(this.files[0])" />
        <div class="upload-icon">📄</div>
        <div class="upload-label">點擊或拖曳上傳 LINE 匯出檔案</div>
        <div class="upload-hint">LINE → 聊天室右上角 → 傳送聊天記錄 → 儲存為文字檔</div>
      </div>
      <div class="file-selected" id="fileSelected">
        <span>📄</span>
        <span id="fileName"></span>
        <span id="fileStats" style="font-size:12px; color: var(--muted); margin-left: 4px;"></span>
        <button class="file-remove" onclick="removeFile()">✕</button>
      </div>
      <div class="detected-range" id="detectedRange"></div>
    </div>
  </div>

  <!-- 時間篩選 -->
  <div class="card">
    <div class="card-label">時間範圍</div>
    <div class="time-pills">
      <div class="pill active" data-range="24h">近 24 小時</div>
      <div class="pill" data-range="3d">近 3 天</div>
      <div class="pill" data-range="7d">近 7 天</div>
      <div class="pill" data-range="all">全部</div>
      <div class="pill" data-range="custom">自訂範圍</div>
    </div>
    <div class="custom-range" id="customRange">
      <label>開始</label>
      <input type="date" id="startDate" />
      <label>結束</label>
      <input type="date" id="endDate" />
    </div>
  </div>

  <!-- 分析項目 -->
  <div class="card">
    <div class="card-label">分析項目（可多選）</div>
    <div class="chips">
      <div class="chip active" data-val="summary">📋 重點摘要</div>
      <div class="chip active" data-val="keywords">🔑 關鍵字</div>
      <div class="chip active" data-val="speakers">👥 重要發言者</div>
      <div class="chip active" data-val="topics">🗂️ 話題分類</div>
      <div class="chip" data-val="actions">✅ 待辦事項</div>
      <div class="chip" data-val="decisions">🔨 決定事項</div>
      <div class="chip" data-val="followup">🔔 需跟進事項</div>
      <div class="chip" data-val="mood">🌡️ 情緒氛圍</div>
    </div>
  </div>

  <button class="btn" id="analyzeBtn" onclick="analyze()">
    <span id="btnContent">✦ 開始分析</span>
  </button>

  <div id="progressArea" style="display:none; margin-top: 1rem;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">正在分析對話中...</div>
  </div>

  <div id="errorMsg" class="error" style="display:none"></div>
  <div id="resultArea"></div>

</div>

<script>
  const WORKER_URL = 'https://line-summarizer.founderai813.workers.dev';

  let currentTab = 'paste';
  let uploadedText = '';
  let currentRange = '24h';
  let progressTimer = null;

  // Chips
  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => c.classList.toggle('active'));
  });

  // Time pills
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      currentRange = p.dataset.range;
      document.getElementById('customRange').classList.toggle('show', currentRange === 'custom');
    });
  });

  // Upload
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'paste') || (i === 1 && tab === 'upload'));
    });
    document.getElementById('panel-paste').classList.toggle('active', tab === 'paste');
    document.getElementById('panel-upload').classList.toggle('active', tab === 'upload');
  }

  function handleFile(file) {
    if (!file) return;
    if (!file.name.endsWith('.txt')) { showError('請上傳 .txt 格式的 LINE 聊天記錄'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      uploadedText = e.target.result;
      document.getElementById('fileName').textContent = file.name;
      const lines = uploadedText.split('\n').length;
      document.getElementById('fileStats').textContent = `（${lines.toLocaleString()} 行）`;
      document.getElementById('fileSelected').classList.add('show');
      document.getElementById('errorMsg').style.display = 'none';

      // 偵測日期範圍
      const dates = extractDates(uploadedText);
      if (dates.length > 0) {
        const first = dates[0];
        const last = dates[dates.length - 1];
        const rangeEl = document.getElementById('detectedRange');
        rangeEl.textContent = `✓ 偵測到對話範圍：${first} 至 ${last}（共 ${dates.length} 天）`;
        rangeEl.classList.add('show');
      }
    };
    reader.onerror = () => showError('讀取檔案失敗，請重試');
    reader.readAsText(file, 'UTF-8');
  }

  function removeFile() {
    uploadedText = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('fileSelected').classList.remove('show');
    document.getElementById('detectedRange').classList.remove('show');
  }

  // 解析 LINE 日期格式
  function extractDates(text) {
    const datePattern = /(\d{4}\/\d{1,2}\/\d{1,2})/g;
    const matches = [...new Set(text.match(datePattern) || [])];
    return matches.sort();
  }

  // 根據時間範圍篩選對話
  function filterByRange(text, range) {
    if (range === 'all') return text;

    const now = new Date();
    let cutoff = new Date();

    if (range === '24h') cutoff.setHours(now.getHours() - 24);
    else if (range === '3d') cutoff.setDate(now.getDate() - 3);
    else if (range === '7d') cutoff.setDate(now.getDate() - 7);
    else if (range === 'custom') {
      const startVal = document.getElementById('startDate').value;
      const endVal = document.getElementById('endDate').value;
      if (!startVal || !endVal) return text;

      const startDate = new Date(startVal);
      const endDate = new Date(endVal);
      endDate.setHours(23, 59, 59);

      return filterByDateRange(text, startDate, endDate);
    }

    return filterByDateRange(text, cutoff, now);
  }

  function filterByDateRange(text, startDate, endDate) {
    const lines = text.split('\n');
    let filtered = [];
    let currentDate = null;
    let includeSection = false;

    for (const line of lines) {
      // 偵測日期行（LINE 格式：2024/04/07(日) 或 2024/4/7）
      const dateMatch = line.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      if (dateMatch) {
        currentDate = new Date(parseInt(dateMatch[1]), parseInt(dateMatch[2]) - 1, parseInt(dateMatch[3]));
        includeSection = currentDate >= startDate && currentDate <= endDate;
        if (includeSection) filtered.push(line);
        continue;
      }

      if (includeSection) filtered.push(line);
    }

    return filtered.join('\n');
  }

  function getRangeLabel(range) {
    if (range === '24h') return '近 24 小時';
    if (range === '3d') return '近 3 天';
    if (range === '7d') return '近 7 天';
    if (range === 'all') return '全部對話';
    if (range === 'custom') {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      return s && e ? `${s} 至 ${e}` : '自訂範圍';
    }
    return '';
  }

  function startProgress() {
    const fill = document.getElementById('progressFill');
    const label = document.getElementById('progressLabel');
    const msgs = ['篩選時間範圍內的對話...', 'AI 分析對話內容...', '整理重點與說話者...', '即將完成...'];
    let pct = 0, step = 0;
    fill.style.width = '0%';
    document.getElementById('progressArea').style.display = 'block';
    progressTimer = setInterval(() => {
      if (pct < 85) {
        pct += Math.random() * 10;
        if (pct > 85) pct = 85;
        fill.style.width = pct + '%';
        if (step < msgs.length - 1 && pct > (step + 1) * 22) label.textContent = msgs[++step];
      }
    }, 500);
  }

  function stopProgress() {
    clearInterval(progressTimer);
    document.getElementById('progressFill').style.width = '100%';
    setTimeout(() => {
      document.getElementById('progressArea').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
    }, 400);
  }

  async function analyze() {
    const selected = [...document.querySelectorAll('.chip.active')].map(c => c.dataset.val);
    let rawText = currentTab === 'paste' ? document.getElementById('chatInput').value.trim() : uploadedText.trim();

    if (!rawText) return showError(currentTab === 'paste' ? '請貼入 LINE 對話紀錄' : '請先上傳 LINE 聊天記錄檔案');
    if (!selected.length) return showError('請至少選擇一個分析項目');
    if (currentRange === 'custom') {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (!s || !e) return showError('請選擇自訂的開始和結束日期');
    }

    // 篩選時間範圍
    const filteredText = filterByRange(rawText, currentRange);
    if (!filteredText.trim()) return showError('所選時間範圍內沒有對話紀錄，請調整時間範圍');

    const rangeLabel = getRangeLabel(currentRange);

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    document.getElementById('btnContent').innerHTML = '<span class="spinner"></span> 分析中...';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('resultArea').innerHTML = '';
    startProgress();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: filteredText, selected })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error);

      stopProgress();
      renderResult(data.result, selected, rangeLabel);
    } catch (e) {
      stopProgress();
      showError('分析失敗：' + (e.message || e));
    }

    btn.disabled = false;
    document.getElementById('btnContent').textContent = '✦ 重新分析';
  }

  function renderResult(data, selected, rangeLabel) {
    const labelMap = {
      summary: '重點摘要', keywords: '關鍵字', speakers: '重要發言者',
      topics: '話題分類', actions: '待辦事項', decisions: '決定事項',
      followup: '需跟進事項', mood: '情緒氛圍'
    };

    let bodyHtml = '';

    if (selected.includes('summary') && data.summary)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.summary}</div><div class="summary-text">${data.summary}</div></div>`;

    if (selected.includes('mood') && data.mood)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.mood}</div><div class="mood-text">🌡️ ${data.mood}</div></div>`;

    if (selected.includes('keywords') && data.keywords?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.keywords}</div><div class="tags">${data.keywords.map(t => `<span class="tag">${t}</span>`).join('')}</div></div>`;

    if (selected.includes('speakers') && data.speakers?.length) {
      const items = data.speakers.map(s => {
        const colonIdx = s.indexOf('：');
        if (colonIdx > -1) {
          const name = s.slice(0, colonIdx);
          const content = s.slice(colonIdx + 1);
          return `<div class="speaker-item"><span class="speaker-name">👤 ${name}</span>${content}</div>`;
        }
        return `<div class="speaker-item">${s}</div>`;
      }).join('');
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.speakers}</div>${items}</div>`;
    }

    if (selected.includes('topics') && data.topics?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.topics}</div>${data.topics.map(t => `<div class="item"><div class="dot dot-blue"></div><div>${t}</div></div>`).join('')}</div>`;

    if (selected.includes('actions') && data.actions?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.actions}</div>${data.actions.map(a => `<div class="item"><div class="dot dot-purple"></div><div>${a}</div></div>`).join('')}</div>`;

    if (selected.includes('decisions') && data.decisions?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.decisions}</div>${data.decisions.map(d => `<div class="item"><div class="dot dot-green"></div><div>${d}</div></div>`).join('')}</div>`;

    if (selected.includes('followup') && data.followup?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.followup}</div>${data.followup.map(f => `<div class="item"><div class="dot dot-amber"></div><div>${f}</div></div>`).join('')}</div>`;

    const fullText = buildPlainText(data, selected, labelMap, rangeLabel);

    document.getElementById('resultArea').innerHTML = `
      <div class="result-card">
        <div class="result-header">
          <div class="result-header-left">
            <span>分析結果</span>
            <span class="result-range">📅 ${rangeLabel}</span>
          </div>
          <button class="copy-btn" onclick="copyResult(this, \`${escapeBacktick(fullText)}\`)">複製全部</button>
        </div>
        <div class="result-body">${bodyHtml || '<div style="color:var(--muted);font-size:14px;">此時間範圍內沒有可分析的內容</div>'}</div>
      </div>`;
  }

  function buildPlainText(data, selected, labelMap, rangeLabel) {
    let lines = [`【分析範圍：${rangeLabel}】`];
    if (selected.includes('summary') && data.summary) lines.push(`\n【${labelMap.summary}】\n${data.summary}`);
    if (selected.includes('mood') && data.mood) lines.push(`\n【${labelMap.mood}】\n${data.mood}`);
    if (selected.includes('keywords') && data.keywords?.length) lines.push(`\n【${labelMap.keywords}】\n${data.keywords.join('、')}`);
    if (selected.includes('speakers') && data.speakers?.length) lines.push(`\n【${labelMap.speakers}】\n${data.speakers.map(s => '• ' + s).join('\n')}`);
    if (selected.includes('topics') && data.topics?.length) lines.push(`\n【${labelMap.topics}】\n${data.topics.map(t => '• ' + t).join('\n')}`);
    if (selected.includes('actions') && data.actions?.length) lines.push(`\n【${labelMap.actions}】\n${data.actions.map(a => '• ' + a).join('\n')}`);
    if (selected.includes('decisions') && data.decisions?.length) lines.push(`\n【${labelMap.decisions}】\n${data.decisions.map(d => '• ' + d).join('\n')}`);
    if (selected.includes('followup') && data.followup?.length) lines.push(`\n【${labelMap.followup}】\n${data.followup.map(f => '• ' + f).join('\n')}`);
    return lines.join('');
  }

  function escapeBacktick(str) {
    return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  function copyResult(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '已複製 ✓';
      setTimeout(() => btn.textContent = '複製全部', 2000);
    });
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
