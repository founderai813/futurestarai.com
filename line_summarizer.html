<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 對話重點整理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2; --surface: #fff; --surface2: #f2f1ed;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #5b4de8; --accent-light: #eeedfe; --accent-mid: #7f77dd;
    --green: #1D9E75; --amber: #BA7517; --red: #cf1322;
    --line-green: #06C755; --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .wrapper { max-width: 720px; margin: 0 auto; }

  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .line-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--line-green); border-radius: 8px; flex-shrink: 0; }
  .line-badge svg { width: 18px; height: 18px; fill: white; }
  .header p { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .card-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }

  /* Groups */
  .group-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .group-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); }
  .group-icon { font-size: 20px; flex-shrink: 0; }
  .group-info { flex: 1; min-width: 0; }
  .group-name-input { width: 100%; font-family: inherit; font-size: 14px; font-weight: 500; border: none; background: transparent; color: var(--text); outline: none; }
  .group-name-input::placeholder { color: var(--muted); }
  .group-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .group-remove { cursor: pointer; font-size: 16px; color: var(--muted); background: none; border: none; flex-shrink: 0; padding: 4px; }
  .group-remove:hover { color: var(--red); }

  .add-group-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 14px; border: 2px dashed var(--border2); border-radius: var(--radius-sm);
    background: transparent; color: var(--muted); font-size: 14px; font-family: inherit;
    cursor: pointer; transition: all 0.15s;
  }
  .add-group-btn:hover { border-color: var(--accent-mid); color: var(--accent); background: var(--accent-light); }

  /* Time pills */
  .time-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pill { font-size: 13px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border2); background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none; }
  .pill:hover { border-color: var(--accent-mid); color: var(--text); }
  .pill.active { background: var(--accent-light); border-color: var(--accent-mid); color: var(--accent); font-weight: 500; }
  .custom-range { display: none; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .custom-range.show { display: flex; }
  .custom-range label { font-size: 13px; color: var(--muted); }
  .custom-range input[type="date"] { font-family: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); outline: none; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 13px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border2); background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none; }
  .chip:hover { border-color: var(--accent-mid); color: var(--text); }
  .chip.active { background: var(--accent-light); border-color: var(--accent-mid); color: var(--accent); font-weight: 500; }

  /* Button */
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; padding: 11px 24px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; font-family: inherit; }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.65s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress */
  .progress-bar { width: 100%; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin: 1rem 0 0.5rem; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.3s ease; }
  .progress-label { font-size: 13px; color: var(--muted); }

  .error { background: #fff1f0; border: 1px solid #ffa39e; color: var(--red); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; margin-top: 1rem; }

  /* Result */
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 1.5rem; }
  .result-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .result-title { font-size: 14px; font-weight: 600; }
  .result-range { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .copy-btn { font-size: 12px; padding: 4px 12px; border: 1px solid var(--border2); border-radius: 999px; background: transparent; cursor: pointer; color: var(--muted); font-family: inherit; transition: all 0.15s; white-space: nowrap; }
  .copy-btn:hover { background: var(--surface2); color: var(--text); }
  .result-body { padding: 1.25rem; }

  .section { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

  .summary-text { font-size: 15px; line-height: 1.8; }
  .mood-text { font-size: 14px; line-height: 1.7; padding: 8px 12px; background: var(--surface2); border-radius: var(--radius-sm); }

  /* Keywords - clickable */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 13px; padding: 4px 14px; border-radius: 999px;
    background: var(--accent-light); color: var(--accent); font-weight: 500;
    cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
    display: flex; align-items: center; gap: 4px;
  }
  .tag:hover { background: var(--accent); color: white; }
  .tag.loading { opacity: 0.6; cursor: wait; }
  .tag.expanded { background: var(--accent); color: white; border-color: var(--accent); }
  .tag-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* Keyword detail panel */
  .keyword-panel {
    margin-top: 12px; background: var(--surface2); border-radius: var(--radius-sm);
    border: 1px solid var(--border2); overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .keyword-panel-header { padding: 10px 14px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: space-between; }
  .keyword-panel-header span { font-size: 14px; font-weight: 600; }
  .keyword-panel-close { background: none; border: none; color: white; cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
  .keyword-panel-body { padding: 14px; }
  .kp-section { margin-bottom: 14px; }
  .kp-section:last-child { margin-bottom: 0; }
  .kp-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .kp-text { font-size: 14px; line-height: 1.75; }
  .kp-quote { font-size: 13px; line-height: 1.65; padding: 7px 12px; background: var(--surface); border-left: 3px solid var(--accent-mid); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 6px; }
  .kp-quote:last-child { margin-bottom: 0; }
  .kp-quote-name { font-weight: 600; color: var(--accent); margin-right: 6px; }
  .kp-item { font-size: 14px; line-height: 1.65; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .kp-item:last-child { border-bottom: none; padding-bottom: 0; }
  .source-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 500; margin: 2px 3px 2px 0; }
  .kp-loading { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }

  .item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14px; line-height: 1.65; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; padding-bottom: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 8px; flex-shrink: 0; }
  .dot-purple { background: var(--accent-mid); }
  .dot-green { background: var(--green); }
  .dot-amber { background: var(--amber); }
  .dot-blue { background: #378ADD; }

  .speaker-item { padding: 8px 12px; background: var(--surface2); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 14px; line-height: 1.6; }
  .speaker-item:last-child { margin-bottom: 0; }
  .speaker-name { font-weight: 600; color: var(--accent); margin-right: 6px; }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  a { color: var(--accent); }

  /* Hidden file input helper */
  .file-trigger { display: none; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>
      <div class="line-badge">
        <svg viewBox="0 0 24 24"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
      </div>
      LINE 對話重點整理
    </h1>
    <p>支援多群組上傳，AI 分析重點、說話者、關鍵字深度展開</p>
  </div>

  <!-- 群組上傳 -->
  <div class="card">
    <div class="card-label">上傳對話群組</div>
    <div class="group-list" id="groupList"></div>
    <button class="add-group-btn" onclick="triggerFileInput()">
      ＋ 新增群組（上傳 .txt 檔案）
    </button>
    <input type="file" class="file-trigger" id="fileTrigger" accept=".txt" onchange="handleFileSelect(this)" />
    <div class="hint" style="margin-top: 10px;">LINE → 聊天室右上角 → 傳送聊天記錄 → 儲存為文字檔</div>
  </div>

  <!-- 時間篩選 -->
  <div class="card">
    <div class="card-label">時間範圍</div>
    <div class="time-pills">
      <div class="pill" data-range="24h">近 24 小時</div>
      <div class="pill" data-range="3d">近 3 天</div>
      <div class="pill" data-range="7d">近 7 天</div>
      <div class="pill active" data-range="all">全部</div>
      <div class="pill" data-range="custom">自訂範圍</div>
    </div>
    <div class="custom-range" id="customRange">
      <label>開始</label>
      <input type="date" id="startDate" />
      <label>結束</label>
      <input type="date" id="endDate" />
    </div>
  </div>

  <!-- 分析項目 -->
  <div class="card">
    <div class="card-label">分析項目（可多選）</div>
    <div class="chips">
      <div class="chip active" data-val="summary">📋 重點摘要</div>
      <div class="chip active" data-val="keywords">🔑 關鍵字</div>
      <div class="chip active" data-val="speakers">👥 重要發言者</div>
      <div class="chip active" data-val="topics">🗂️ 話題分類</div>
      <div class="chip active" data-val="actions">✅ 待辦事項</div>
      <div class="chip active" data-val="decisions">🔨 決定事項</div>
      <div class="chip active" data-val="followup">🔔 需跟進事項</div>
      <div class="chip active" data-val="mood">🌡️ 情緒氛圍</div>
    </div>
  </div>

  <button class="btn" id="analyzeBtn" onclick="analyze()">
    <span id="btnContent">✦ 開始分析</span>
  </button>

  <div id="progressArea" style="display:none; margin-top: 1rem;">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">正在分析對話中...</div>
  </div>

  <div id="errorMsg" class="error" style="display:none"></div>
  <div id="resultArea"></div>
</div>

<script>
  const WORKER_URL = 'https://line-summarizer.founderai813.workers.dev';

  let groups = []; // { id, name, rawText, filteredText }
  let currentRange = 'all';
  let progressTimer = null;
  let currentFilteredGroups = [];
  let expandedKeyword = null;

  // Chips
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('active')));

  // Time pills
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      currentRange = p.dataset.range;
      document.getElementById('customRange').classList.toggle('show', currentRange === 'custom');
    });
  });

  function triggerFileInput() {
    document.getElementById('fileTrigger').value = '';
    document.getElementById('fileTrigger').click();
  }

  function handleFileSelect(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.name.endsWith('.txt')) { showError('請上傳 .txt 格式'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const id = Date.now();
      const text = e.target.result;
      const lines = text.split('\n').length;
      const dates = extractDates(text);
      const groupName = file.name.replace('.txt', '').replace(/^\[LINE\]\s*/i, '');
      groups.push({ id, name: groupName, rawText: text, lines, dateRange: dates });
      renderGroups();
      document.getElementById('errorMsg').style.display = 'none';
    };
    reader.readAsText(file, 'UTF-8');
  }

  function renderGroups() {
    const list = document.getElementById('groupList');
    if (groups.length === 0) { list.innerHTML = ''; return; }
    list.innerHTML = groups.map((g, i) => `
      <div class="group-item" id="group-${g.id}">
        <div class="group-icon">💬</div>
        <div class="group-info">
          <input class="group-name-input" value="${escapeHtml(g.name)}" placeholder="群組名稱"
            onchange="updateGroupName(${g.id}, this.value)" />
          <div class="group-meta">${g.lines.toLocaleString()} 行
            ${g.dateRange.length > 0 ? `・${g.dateRange[0]} 至 ${g.dateRange[g.dateRange.length-1]}` : ''}
          </div>
        </div>
        <button class="group-remove" onclick="removeGroup(${g.id})">✕</button>
      </div>
    `).join('');
  }

  function updateGroupName(id, name) {
    const g = groups.find(x => x.id === id);
    if (g) g.name = name;
  }

  function removeGroup(id) {
    groups = groups.filter(x => x.id !== id);
    renderGroups();
  }

  function extractDates(text) {
    const matches = [...new Set((text.match(/\d{4}\/\d{1,2}\/\d{1,2}/g) || []))];
    return matches.sort();
  }

  function filterByRange(text, range) {
    if (range === 'all') return text;

    if (range === 'custom') {
      const sv = document.getElementById('startDate').value;
      const ev = document.getElementById('endDate').value;
      if (!sv || !ev) return text;
      const startDate = new Date(sv);
      const endDate = new Date(ev);
      endDate.setHours(23, 59, 59);
      return filterByDateRange(text, startDate, endDate);
    }

    // 用檔案內最後一個日期當基準，避免舊對話被篩掉
    const allDates = extractDates(text);
    const lastDateStr = allDates.length > 0 ? allDates[allDates.length - 1] : null;
    const refDate = lastDateStr
      ? new Date(lastDateStr.replace(/\//g, '-') + 'T23:59:59')
      : new Date();

    let startDate = new Date(refDate);
    if (range === '24h') startDate = new Date(refDate.getTime() - 24 * 60 * 60 * 1000);
    else if (range === '3d') startDate = new Date(refDate.getTime() - 3 * 24 * 60 * 60 * 1000);
    else if (range === '7d') startDate = new Date(refDate.getTime() - 7 * 24 * 60 * 60 * 1000);

    return filterByDateRange(text, startDate, refDate);
  }

  function isDateLine(line) {
    // 格式一：獨立日期行 2026/03/22(六) 長度短
    const trimmed = line.trim();
    return /^\d{4}\/\d{1,2}\/\d{1,2}/.test(trimmed) && trimmed.length < 30;
  }

  function parseDateFromLine(line) {
    const m = line.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);
    return null;
  }

  function filterByDateRange(text, startDate, endDate) {
    const lines = text.split('\n');
    let filtered = [], include = false;

    // 偵測格式：是否每行都有日期（inline 格式）
    const inlineFormat = lines.slice(0, 20).some(l =>
      /^\d{4}\/\d{1,2}\/\d{1,2}[（(]/.test(l.trim()) && l.length > 30
    );

    if (inlineFormat) {
      // Inline 格式：每行開頭有日期
      for (const line of lines) {
        const m = line.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
        if (m) {
          const d = new Date(+m[1], +m[2]-1, +m[3]);
          if (d >= startDate && d <= endDate) filtered.push(line);
        } else {
          // 沒有日期的行（例如標題行）也保留
          if (filtered.length > 0) filtered.push(line);
        }
      }
    } else {
      // 標準格式：日期是獨立一行
      for (const line of lines) {
        if (isDateLine(line)) {
          const d = parseDateFromLine(line);
          if (d) {
            include = d >= startDate && d <= endDate;
            if (include) filtered.push(line);
            continue;
          }
        }
        if (include) filtered.push(line);
      }
    }

    return filtered.join('\n');
  }

  function getRangeLabel() {
    if (currentRange === '24h') return '近 24 小時';
    if (currentRange === '3d') return '近 3 天';
    if (currentRange === '7d') return '近 7 天';
    if (currentRange === 'all') return '全部對話';
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    return s && e ? `${s} 至 ${e}` : '自訂範圍';
  }

  function startProgress() {
    const fill = document.getElementById('progressFill');
    const label = document.getElementById('progressLabel');
    const msgs = ['篩選時間範圍...', 'AI 分析對話內容...', '整理重點與說話者...', '即將完成...'];
    let pct = 0, step = 0;
    fill.style.width = '0%';
    document.getElementById('progressArea').style.display = 'block';
    progressTimer = setInterval(() => {
      if (pct < 85) {
        pct += Math.random() * 10;
        if (pct > 85) pct = 85;
        fill.style.width = pct + '%';
        if (step < msgs.length - 1 && pct > (step + 1) * 22) label.textContent = msgs[++step];
      }
    }, 500);
  }

  function stopProgress() {
    clearInterval(progressTimer);
    document.getElementById('progressFill').style.width = '100%';
    setTimeout(() => {
      document.getElementById('progressArea').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
    }, 400);
  }

  async function analyze() {
    if (groups.length === 0) return showError('請先上傳至少一個群組的對話檔案');
    const selected = [...document.querySelectorAll('.chip.active')].map(c => c.dataset.val);
    if (!selected.length) return showError('請至少選擇一個分析項目');
    if (currentRange === 'custom') {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (!s || !e) return showError('請選擇自訂的開始和結束日期');
    }

    // 篩選每個群組
    currentFilteredGroups = groups.map(g => ({
      name: g.name,
      text: filterByRange(g.rawText, currentRange)
    })).filter(g => g.text.trim().length > 0);

    if (currentFilteredGroups.length === 0) return showError('所選時間範圍內沒有對話紀錄，請調整時間範圍');

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    document.getElementById('btnContent').innerHTML = '<span class="spinner"></span> 分析中...';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('resultArea').innerHTML = '';
    expandedKeyword = null;
    startProgress();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'analyze', groups: currentFilteredGroups, selected })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      stopProgress();
      // 防呆：有時候 result 在 data.result，有時候直接在 data
      const resultData = data.result || data;
      renderResult(resultData, selected);
    } catch (e) {
      stopProgress();
      showError('分析失敗：' + (e.message || e));
    }

    btn.disabled = false;
    document.getElementById('btnContent').textContent = '✦ 重新分析';
  }

  async function analyzeKeyword(keyword, tagEl) {
    if (expandedKeyword === keyword) {
      // 收起
      expandedKeyword = null;
      document.getElementById('keyword-panel')?.remove();
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('expanded'));
      return;
    }

    expandedKeyword = keyword;
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('expanded', 'loading'));
    tagEl.classList.add('expanded', 'loading');

    // 移除舊的 panel
    document.getElementById('keyword-panel')?.remove();

    // 建立 loading panel
    const keywordSection = document.getElementById('keywords-section');
    const panel = document.createElement('div');
    panel.id = 'keyword-panel';
    panel.className = 'keyword-panel';
    panel.innerHTML = `
      <div class="keyword-panel-header">
        <span>🔍 「${keyword}」深度分析</span>
        <button class="keyword-panel-close" onclick="closeKeywordPanel()">✕</button>
      </div>
      <div class="keyword-panel-body">
        <div class="kp-loading"><span class="spinner" style="border-color:rgba(0,0,0,0.2);border-top-color:var(--accent);display:inline-block;margin-right:8px;"></span>AI 正在分析關鍵字...</div>
      </div>`;
    keywordSection.appendChild(panel);

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'keyword', keyword, groups: currentFilteredGroups })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const d = data.result;
      let html = '<div class="keyword-panel-body">';

      if (d.discussion_summary) {
        html += `<div class="kp-section"><div class="kp-label">📝 討論摘要</div><div class="kp-text">${d.discussion_summary}</div></div>`;
      }
      if (d.quotes?.length) {
        html += `<div class="kp-section"><div class="kp-label">💬 相關對話片段</div>`;
        html += d.quotes.map(q => {
          const colonIdx = q.indexOf('：');
          if (colonIdx > -1) {
            return `<div class="kp-quote"><span class="kp-quote-name">${q.slice(0, colonIdx)}</span>${q.slice(colonIdx + 1)}</div>`;
          }
          return `<div class="kp-quote">${q}</div>`;
        }).join('');
        html += '</div>';
      }
      if (d.speakers?.length) {
        html += `<div class="kp-section"><div class="kp-label">👤 提到此關鍵字的人</div>`;
        html += d.speakers.map(s => `<div class="kp-item">${s}</div>`).join('');
        html += '</div>';
      }
      if (d.conclusions?.length) {
        html += `<div class="kp-section"><div class="kp-label">📌 相關結論或決定</div>`;
        html += d.conclusions.map(c => `<div class="kp-item">${c}</div>`).join('');
        html += '</div>';
      }
      if (d.sources?.length) {
        html += `<div class="kp-section"><div class="kp-label">🏷️ 來源群組</div><div>`;
        html += d.sources.map(s => `<span class="source-badge">${s}</span>`).join('');
        html += '</div></div>';
      }

      html += '</div>';
      panel.querySelector('.keyword-panel-body').outerHTML = html;
      panel.innerHTML = `
        <div class="keyword-panel-header">
          <span>🔍 「${keyword}」深度分析</span>
          <button class="keyword-panel-close" onclick="closeKeywordPanel()">✕</button>
        </div>${html}`;
    } catch (e) {
      panel.querySelector('.keyword-panel-body').innerHTML = `<div style="padding:14px;color:var(--red);font-size:14px;">分析失敗：${e.message}</div>`;
    }

    tagEl.classList.remove('loading');
  }

  function closeKeywordPanel() {
    expandedKeyword = null;
    document.getElementById('keyword-panel')?.remove();
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('expanded'));
  }

  function renderResult(data, selected) {
    const labelMap = {
      summary: '重點摘要', keywords: '關鍵字', speakers: '重要發言者',
      topics: '話題分類', actions: '待辦事項', decisions: '決定事項',
      followup: '需跟進事項', mood: '情緒氛圍'
    };

    const rangeLabel = getRangeLabel();
    const groupNames = currentFilteredGroups.map(g => g.name).join('、');
    let bodyHtml = '';

    // 格式化摘要：把句號後換行，讓排版更好看
    function formatSummary(text) {
      if (!text) return '';
      return text
        .replace(/。/g, '。<br>')
        .replace(/！/g, '！<br>')
        .replace(/？/g, '？<br>')
        .replace(/<br>\s*<br>/g, '<br>');
    }

    if (selected.includes('summary') && data.summary)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.summary}</div><div class="summary-text">${formatSummary(data.summary)}</div></div>`;

    if (selected.includes('mood') && data.mood)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.mood}</div><div class="mood-text">🌡️ ${data.mood}</div></div>`;

    if (selected.includes('keywords') && data.keywords?.length) {
      const tagsHtml = data.keywords.map(k =>
        `<span class="tag" onclick="analyzeKeyword('${escapeHtml(k)}', this)">${k} <span style="font-size:10px;opacity:0.7">▾</span></span>`
      ).join('');
      bodyHtml += `<div class="section" id="keywords-section"><div class="section-title">${labelMap.keywords}</div><div class="tags">${tagsHtml}</div><div class="tag-hint">點擊關鍵字查看深度分析</div></div>`;
    }

    if (selected.includes('speakers') && data.speakers?.length) {
      const items = data.speakers.map(s => {
        const ci = s.indexOf('：');
        if (ci > -1) return `<div class="speaker-item"><span class="speaker-name">👤 ${s.slice(0, ci)}</span>${s.slice(ci + 1)}</div>`;
        return `<div class="speaker-item">${s}</div>`;
      }).join('');
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.speakers}</div>${items}</div>`;
    }

    if (selected.includes('topics') && data.topics?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.topics}</div>${data.topics.map(t => `<div class="item"><div class="dot dot-blue"></div><div>${t}</div></div>`).join('')}</div>`;

    if (selected.includes('actions') && data.actions?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.actions}</div>${data.actions.map(a => `<div class="item"><div class="dot dot-purple"></div><div>${a}</div></div>`).join('')}</div>`;

    if (selected.includes('decisions') && data.decisions?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.decisions}</div>${data.decisions.map(d => `<div class="item"><div class="dot dot-green"></div><div>${d}</div></div>`).join('')}</div>`;

    if (selected.includes('followup') && data.followup?.length)
      bodyHtml += `<div class="section"><div class="section-title">${labelMap.followup}</div>${data.followup.map(f => `<div class="item"><div class="dot dot-amber"></div><div>${f}</div></div>`).join('')}</div>`;

    // 顯示原始資料（診斷用）
    const rawKeys = Object.keys(data).join('、');
    const rawPreview = JSON.stringify(data).slice(0, 300);

    document.getElementById('resultArea').innerHTML = `
      <div class="result-card">
        <div class="result-header">
          <div>
            <div class="result-title">分析結果</div>
            <div class="result-range">📅 ${rangeLabel}・💬 ${groupNames}</div>
          </div>
          <button class="copy-btn" onclick="copyResult(this)">複製全部</button>
        </div>
        <div class="result-body">${bodyHtml || '<div style="color:var(--muted);font-size:14px;">此時間範圍內沒有可分析的內容</div>'}</div>
        <div style="padding: 12px 1.25rem; border-top: 1px solid var(--border); background: var(--surface2);">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">🔍 診斷資訊（AI 回傳欄位：${rawKeys}）</div>
          <div style="font-size:11px;color:var(--muted);word-break:break-all;">${rawPreview}...</div>
        </div>
      </div>`;

    window._lastResultData = { data, selected, labelMap, rangeLabel };
  }

  function copyResult(btn) {
    const { data, selected, labelMap, rangeLabel } = window._lastResultData || {};
    if (!data) return;
    let lines = [`【分析範圍：${rangeLabel}】`];
    if (selected.includes('summary') && data.summary) lines.push(`\n【${labelMap.summary}】\n${data.summary}`);
    if (selected.includes('mood') && data.mood) lines.push(`\n【${labelMap.mood}】\n${data.mood}`);
    if (selected.includes('keywords') && data.keywords?.length) lines.push(`\n【${labelMap.keywords}】\n${data.keywords.join('、')}`);
    if (selected.includes('speakers') && data.speakers?.length) lines.push(`\n【${labelMap.speakers}】\n${data.speakers.map(s => '• ' + s).join('\n')}`);
    if (selected.includes('topics') && data.topics?.length) lines.push(`\n【${labelMap.topics}】\n${data.topics.map(t => '• ' + t).join('\n')}`);
    if (selected.includes('actions') && data.actions?.length) lines.push(`\n【${labelMap.actions}】\n${data.actions.map(a => '• ' + a).join('\n')}`);
    if (selected.includes('decisions') && data.decisions?.length) lines.push(`\n【${labelMap.decisions}】\n${data.decisions.map(d => '• ' + d).join('\n')}`);
    if (selected.includes('followup') && data.followup?.length) lines.push(`\n【${labelMap.followup}】\n${data.followup.map(f => '• ' + f).join('\n')}`);
    navigator.clipboard.writeText(lines.join('')).then(() => {
      btn.textContent = '已複製 ✓';
      setTimeout(() => btn.textContent = '複製全部', 2000);
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
