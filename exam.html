<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 應用規劃師 · 考題練習</title>
<meta name="description" content="AI 應用規劃師初級能力鑑定 · 歷屆考題互動練習：練習模式、模擬測驗、錯題複習，附詳解。">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="AI 應用規劃師 · 考題練習">
<meta property="og:description" content="歷屆考題互動練習 · 練習 / 模擬 / 錯題複習 · 附詳解">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #18181b;
    --panel-hover: #1c1c1f;
    --border: #2a2a2e;
    --border-hover: #3a3a45;
    --text: #e8e8ea;
    --text-dim: #9a9a9f;
    --text-muted: #6a6a6f;
    --accent-1: #00d2ff;
    --accent-2: #7b2ff7;
    --good: #22c55e;
    --good-bg: rgba(34, 197, 94, 0.12);
    --good-border: rgba(34, 197, 94, 0.45);
    --bad: #ef4444;
    --bad-bg: rgba(239, 68, 68, 0.12);
    --bad-border: rgba(239, 68, 68, 0.45);
    --warn: #f59e0b;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 0 1.1rem; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 820px; margin: 0 auto; padding: 0.7rem 1.1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .brand {
    font-weight: 800; font-size: 0.98rem; letter-spacing: -0.01em;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .brand-sub { color: var(--text-muted); font-size: 0.78rem; font-weight: 500; }
  .topbar .spacer { flex: 1; }
  .ghost-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 0.35rem 0.85rem; font-size: 0.8rem; transition: all .15s;
    white-space: nowrap;
  }
  .ghost-btn:hover { background: var(--panel-hover); border-color: var(--border-hover); color: var(--text); }

  /* ---------- Hero ---------- */
  .hero { padding: 2.4rem 0 1.4rem; text-align: center; }
  .hero h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  .hero h1 .g {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--text-dim); font-size: 0.98rem; }

  /* ---------- Stat strip ---------- */
  .statstrip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin: 1.2rem 0 0.4rem;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.8rem 0.5rem; text-align: center;
  }
  .stat .v { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
  .stat .k { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }
  .stat .v.good { color: var(--good); }
  .stat .v.acc { color: var(--accent-1); }

  /* ---------- Section ---------- */
  .sec-title { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin: 1.8rem 0 0.7rem; letter-spacing: 0.02em; }

  /* ---------- Mode cards ---------- */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .mode {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.05rem 1.1rem; transition: all .18s; text-align: left; color: var(--text);
    display: flex; flex-direction: column; gap: 0.25rem;
  }
  .mode:hover { background: var(--panel-hover); border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 10px 26px -14px rgba(123,47,247,.35); }
  .mode .ic { font-size: 1.5rem; line-height: 1; margin-bottom: 0.3rem; }
  .mode .t { font-weight: 700; font-size: 1rem; }
  .mode .d { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; }
  .mode .badge { font-size: 0.72rem; color: var(--accent-1); margin-top: 0.2rem; font-weight: 600; }
  .mode:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ---------- Exam picker list ---------- */
  .paper-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .paper {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.95rem 1.1rem; display: flex; align-items: center; gap: 0.9rem; transition: all .15s; text-align: left; color: var(--text); width: 100%;
  }
  .paper:hover { background: var(--panel-hover); border-color: var(--border-hover); }
  .paper .pic { font-size: 1.3rem; }
  .paper .pmeta { flex: 1; }
  .paper .pname { font-weight: 650; font-size: 0.95rem; }
  .paper .psub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }
  .paper .pcount { font-size: 0.78rem; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap; }
  .paper .parrow { color: var(--text-muted); }

  /* ---------- Quiz screen ---------- */
  .quiz-head { padding: 1rem 0 0.4rem; }
  .progress-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.7rem; }
  .pbar { flex: 1; height: 7px; background: var(--panel-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .pbar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width .3s ease; }
  .pcount-txt { font-size: 0.82rem; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .qmeta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .chip { font-size: 0.72rem; padding: 0.2rem 0.6rem; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); }
  .chip.mode { color: var(--accent-1); border-color: rgba(0,210,255,.3); }

  .qcard { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.3rem 1.25rem; }
  .qtext { font-size: 1.06rem; font-weight: 600; line-height: 1.7; margin-bottom: 1.1rem; white-space: pre-wrap; }
  .qnum { color: var(--accent-2); font-weight: 800; margin-right: 0.4rem; }

  .opts { display: flex; flex-direction: column; gap: 0.6rem; }
  .opt {
    display: flex; align-items: flex-start; gap: 0.75rem; width: 100%;
    background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 0.85rem 0.95rem; text-align: left; color: var(--text); transition: all .13s; font-size: 0.95rem; line-height: 1.55;
  }
  .opt:hover:not(:disabled) { border-color: var(--border-hover); background: var(--panel-hover); }
  .opt .key {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; background: var(--bg);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem; color: var(--text-dim); margin-top: 1px;
  }
  .opt .otxt { flex: 1; }
  .opt.selected { border-color: var(--accent-1); background: rgba(0,210,255,.06); }
  .opt.selected .key { border-color: var(--accent-1); color: var(--accent-1); }
  .opt.correct { border-color: var(--good-border); background: var(--good-bg); }
  .opt.correct .key { background: var(--good); border-color: var(--good); color: #04120a; }
  .opt.wrong { border-color: var(--bad-border); background: var(--bad-bg); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #1a0505; }
  .opt:disabled { cursor: default; }
  .opt .mark { margin-left: auto; font-weight: 700; font-size: 0.9rem; align-self: center; }

  .explain {
    margin-top: 1rem; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: var(--panel-2);
  }
  .explain .eh { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.9rem; font-size: 0.82rem; font-weight: 700; border-bottom: 1px solid var(--border); }
  .explain.ok .eh { color: var(--good); }
  .explain.no .eh { color: var(--bad); }
  .explain .eb { padding: 0.75rem 0.9rem; font-size: 0.9rem; color: var(--text-dim); line-height: 1.7; }
  .explain .ans-line { color: var(--text); font-weight: 600; margin-bottom: 0.35rem; }
  .explain .ans-line b { color: var(--good); }

  /* ---------- Quiz footer nav ---------- */
  .qnav { display: flex; align-items: center; gap: 0.6rem; margin: 1rem 0 2rem; }
  .navbtn {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.92rem; font-weight: 650; transition: all .15s;
  }
  .navbtn:hover:not(:disabled) { background: var(--panel-hover); border-color: var(--border-hover); }
  .navbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .navbtn.primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border: none; color: #06121a; font-weight: 750; }
  .navbtn.primary:hover { filter: brightness(1.08); }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 12px; padding: 0.8rem 0.9rem; font-size: 1rem; transition: all .15s; flex-shrink: 0;
  }
  .iconbtn:hover { background: var(--panel-hover); border-color: var(--border-hover); }
  .iconbtn.on { color: var(--warn); border-color: rgba(245,158,11,.4); }

  /* ---------- Jump grid ---------- */
  .jump { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 0.4rem; margin: 0.4rem 0 2rem; }
  .jcell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text-dim); font-size: 0.8rem; font-weight: 650; display: flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .jcell:hover { border-color: var(--border-hover); }
  .jcell.cur { border-color: var(--accent-1); color: var(--accent-1); box-shadow: 0 0 0 1px var(--accent-1); }
  .jcell.ok { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
  .jcell.no { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .jcell.ans { background: rgba(0,210,255,.1); border-color: rgba(0,210,255,.4); color: var(--accent-1); }
  .jcell .star { position: absolute; }
  .jwrap-title { display:flex; justify-content:space-between; align-items:center; }

  /* ---------- Result ---------- */
  .result { text-align: center; padding: 2rem 0 1rem; }
  .score-ring { width: 168px; height: 168px; margin: 0 auto 1.2rem; position: relative; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .rtxt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-ring .rpct { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; }
  .score-ring .rlabel { font-size: 0.8rem; color: var(--text-muted); }
  .verdict { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.4rem; }
  .verdict.pass { color: var(--good); }
  .verdict.fail { color: var(--warn); }
  .rsummary { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 1.5rem; }
  .rbtns { display: flex; flex-direction: column; gap: 0.6rem; max-width: 380px; margin: 0 auto; }

  .review-list { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem; }
  .rev-item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; }
  .rev-item .rq { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; }
  .rev-item .rl { font-size: 0.82rem; color: var(--text-dim); }
  .rev-item .rl b.ok { color: var(--good); }
  .rev-item .rl b.no { color: var(--bad); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
  .empty .ic { font-size: 2.5rem; margin-bottom: 0.6rem; }

  footer { border-top: 1px solid var(--border); padding: 1.6rem 0; text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 2rem; }
  footer a { color: var(--text-muted); }
  footer a:hover { color: var(--text-dim); }

  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%) translateY(1.5rem);
    background: var(--panel); border: 1px solid var(--border-hover); border-radius: 999px;
    padding: 0.55rem 1.1rem; font-size: 0.85rem; color: var(--text); opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 50; box-shadow: 0 8px 30px -8px rgba(0,0,0,.6);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .statstrip { grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    .stat .v { font-size: 1.1rem; }
    .stat .k { font-size: 0.65rem; }
    .modes { grid-template-columns: 1fr; }
    .brand-sub { display: none; }
    .qcard { padding: 1.1rem 1rem; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="brand">AI 應用規劃師</span>
      <span class="brand-sub">初級能力鑑定 · 考題練習</span>
      <span class="spacer"></span>
      <button class="ghost-btn" id="homeBtn">☰ 選單</button>
    </div>
  </div>

  <!-- ========== HOME ========== -->
  <main class="wrap" id="screen-home">
    <section class="hero">
      <h1>用歷屆考題<span class="g">練到會</span></h1>
      <p>練習模式即時看詳解 · 模擬測驗抓分數 · 錯題自動收集複習</p>
    </section>

    <div class="statstrip">
      <div class="stat"><div class="v" id="st-total">0</div><div class="k">總題數</div></div>
      <div class="stat"><div class="v acc" id="st-done">0</div><div class="k">已練習</div></div>
      <div class="stat"><div class="v good" id="st-acc">—</div><div class="k">正確率</div></div>
      <div class="stat"><div class="v" id="st-wrong" style="color:var(--bad)">0</div><div class="k">錯題</div></div>
    </div>

    <div class="sec-title">選擇練習方式</div>
    <div class="modes">
      <button class="mode" data-mode="practice-pick">
        <span class="ic">📚</span>
        <span class="t">分回練習</span>
        <span class="d">選一份歷屆考卷，逐題作答、即時看詳解。</span>
        <span class="badge">最適合打基礎 →</span>
      </button>
      <button class="mode" data-mode="mock-pick">
        <span class="ic">📝</span>
        <span class="t">模擬測驗</span>
        <span class="d">整卷計時作答，最後結算分數（60 分及格）。</span>
        <span class="badge">考前檢測 →</span>
      </button>
      <button class="mode" data-mode="random">
        <span class="ic">🎲</span>
        <span class="t">隨機綜合</span>
        <span class="d">從全部題庫隨機抽 30 題，跨考卷混合練習。</span>
        <span class="badge">隨機挑戰 →</span>
      </button>
      <button class="mode" data-mode="wrong" id="mode-wrong">
        <span class="ic">🔁</span>
        <span class="t">錯題複習</span>
        <span class="d">只練你答錯過的題目，答對後移出清單。</span>
        <span class="badge" id="wrong-badge">尚無錯題</span>
      </button>
      <button class="mode" data-mode="starred" id="mode-star">
        <span class="ic">⭐</span>
        <span class="t">收藏題複習</span>
        <span class="d">複習你標記星號收藏的重點題目。</span>
        <span class="badge" id="star-badge">尚無收藏</span>
      </button>
      <button class="mode" data-mode="reset">
        <span class="ic">🧹</span>
        <span class="t">重設進度</span>
        <span class="d">清除所有作答紀錄、錯題與收藏，重新開始。</span>
        <span class="badge">重新開始 →</span>
      </button>
    </div>
    <div id="home-foot"></div>
  </main>

  <!-- ========== PAPER PICKER ========== -->
  <main class="wrap hidden" id="screen-pick">
    <div class="sec-title" id="pick-title">選擇考卷</div>
    <div class="paper-list" id="paper-list"></div>
    <div style="margin-top:1.2rem"><button class="navbtn" id="pick-back">← 返回選單</button></div>
  </main>

  <!-- ========== QUIZ ========== -->
  <main class="wrap hidden" id="screen-quiz">
    <div class="quiz-head">
      <div class="qmeta">
        <span class="chip mode" id="q-modechip">練習</span>
        <span class="chip" id="q-srcchip"></span>
        <span class="chip" id="q-timerchip" style="display:none">⏱ 00:00</span>
      </div>
      <div class="progress-row">
        <div class="pbar"><i id="pbar-fill"></i></div>
        <span class="pcount-txt" id="q-count">1 / 1</span>
      </div>
    </div>

    <div class="qcard">
      <div class="qtext" id="q-text"></div>
      <div class="opts" id="q-opts"></div>
      <div id="q-explain"></div>
    </div>

    <div class="qnav">
      <button class="iconbtn" id="q-star" title="收藏此題">☆</button>
      <button class="navbtn" id="q-prev">← 上一題</button>
      <button class="navbtn primary" id="q-next">下一題 →</button>
    </div>

    <div class="jwrap-title">
      <div class="sec-title" style="margin-top:0">答題卡</div>
      <button class="ghost-btn" id="q-submit" style="display:none">交卷結算</button>
    </div>
    <div class="jump" id="q-jump"></div>
  </main>

  <!-- ========== RESULT ========== -->
  <main class="wrap hidden" id="screen-result">
    <div class="result">
      <div class="score-ring">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="74" fill="none" stroke="var(--panel-2)" stroke-width="14"/>
          <circle id="ring-fg" cx="84" cy="84" r="74" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465"/>
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d2ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient></defs>
        </svg>
        <div class="rtxt"><span class="rpct" id="r-pct">0</span><span class="rlabel">分</span></div>
      </div>
      <div class="verdict" id="r-verdict">—</div>
      <div class="rsummary" id="r-summary"></div>
      <div class="rbtns">
        <button class="navbtn primary" id="r-review">📋 逐題檢討</button>
        <button class="navbtn" id="r-redo-wrong" style="display:none">🔁 只練這次的錯題</button>
        <button class="navbtn" id="r-home">← 回選單</button>
      </div>
    </div>
    <div id="r-reviewlist"></div>
  </main>

  <footer>
    <div>AI 應用規劃師 · 歷屆考題練習 &nbsp;·&nbsp; <a href="index.html">← 回作品集</a></div>
    <div style="margin-top:.5rem;color:var(--text-muted);font-size:.72rem">題目改寫自公開歷屆試題，僅供個人備考練習使用。詳解由 AI 整理，請以官方公告答案為準。</div>
  </footer>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================

window.EXAM_DATA = /*__EXAM_DATA__*/[{"id":"s1-115-2","subject":"第一科：人工智慧基礎概論","exam":"115年第二次","questions":[{"n":1,"q":"某地方政府委託資料科學團隊，針對選舉期間的社群媒體貼文進行大規模輿情分析，目標是了解選民對各政策議題的態度傾向。團隊規劃整合多種 AI 技術以提升分析涵蓋率。下列哪一種技術組合最符合上述需求，且不涉及對特定個人的身份辨識？","options":{"A":"情感分析結合關鍵詞提取，分析貼文內容的立場與高頻議題詞彙","B":"文本分類結合人臉辨識，辨識發文者身份後再進行政治立場分類","C":"語音辨識結合影像辨識，將選舉造勢影片轉換為可分析的文字資料，並進行內容整理與主題歸納","D":"推薦系統結合社群圖譜分析，針對個別使用者預測其投票選擇"},"answer":"A","explanation":"情感分析加關鍵詞提取只分析貼文內容的立場與議題，不辨識個人身份，符合輿情分析且保護隱私。B涉及人臉辨識與身份識別，C需辨識個人語音影像，D針對個別使用者預測投票，均涉及對特定個人的辨識。"},{"n":2,"q":"某物流公司正在規劃導入 AI 系統以優化多項業務流程，包含異常包裹偵測、路線自動規劃與倉儲揀貨效率提升。技術團隊在評估過程中，針對不同任務的資料特性與學習目標，討論應採用哪種機器學習方式。請問下列對於各學習方式的敘述，何者有誤？","options":{"A":"監督式學習 (Supervised Learning) 適合用於異常包裹偵測，前提是須備有大量已標註為正常或異常的歷史資料","B":"非監督式學習 (Unsupervised Learning) 可用於分析倉儲揀貨動線的潛在分群，但無法直接預測特定行為的對錯","C":"強化學習 (Reinforcement Learning) 適合應用於路線規劃，模型透過反覆嘗試與環境回饋，逐步找出最佳配送策略","D":"非監督式學習 (Unsupervised Learning) 可用於異常包裹偵測，並能在缺乏標註資料的情況下，準確判斷每筆資料是否屬於特定異常類別"},"answer":"D","explanation":"非監督式學習沒有標籤，只能找出偏離群體的異常點，無法「準確判斷」每筆資料屬於哪一種特定異常類別，故D敘述有誤。A、B、C對各學習方式的描述均正確。"},{"n":3,"q":"某電子製造公司在產線上導入 AI 系統，自動判斷電路板是否存在焊接瑕疵，並取代人工目視檢查。該系統需處理大量產品外觀影像，並在高產量環境下短時間內完成品質判定。下列何者最不符合此應用所展現的 AI 核心技術和能力？","options":{"A":"自然語言處理 (Natural Language Processing)","B":"電腦視覺 (Computer Vision)","C":"異常偵測 (Anomaly Detection)","D":"診斷性分析 (Diagnostic Analytics)"},"answer":"A","explanation":"焊接瑕疵判定是分析產品外觀影像，屬電腦視覺、異常偵測與診斷性分析範疇，與文字語言無關。自然語言處理處理的是文本語意，最不符合此影像檢測應用。"},{"n":4,"q":"某金融科技公司的交易系統，在毫秒等級的時間內持續掃描跨市場價格差異、分析大量即時報價，並自動執行交易指令。系統架構師在技術選用評估時，需確認該系統於即時交易決策中最核心依賴的 AI 能力。下列何者最能正確說明其核心 AI 能力？","options":{"A":"透過自然語言處理技術分析財經新聞語意，作為輔助性市場情緒指標","B":"快速分析龐大市場數據並在極短時間內識別交易機會，驅動自動化交易決策","C":"透過深度學習分析長期歷史股價走勢，制定中長期的投資組合策略","D":"透過推薦系統技術，根據投資人歷史交易行為推薦最適合的投資組合標的"},"answer":"B","explanation":"毫秒級高頻交易的核心是快速處理海量即時數據並在極短時間內識別套利機會、自動下單，故B最正確。A僅為輔助性情緒指標，C著重中長期而非即時，D是個人化推薦，皆非即時交易的核心能力。"},{"n":5,"q":"某地方政府導入 AI 系統審核低收入補助資格。該系統已通過內部測試且準確率高，但民間團體指出不同族群核准率差異顯著。政府表示該系統由專業廠商開發，且未接獲大量申訴。依《人工智慧基本法》精神，下列何者為最適當之優先作法？","options":{"A":"要求廠商提出無歧視聲明，並持續觀察","B":"提升模型整體準確率，以降低錯誤影響","C":"進行偏誤影響評估並建立可解釋與申訴機制","D":"維持系統運作，待接獲大量申訴後再檢討改善"},"answer":"C","explanation":"不同族群核准率差異顯著代表可能存在演算法偏誤，最適當作法是進行偏誤影響評估並建立可解釋性與申訴機制。A僅要求聲明未實質評估，B提升整體準確率無法解決族群公平問題，D消極等待違反主動問責精神。"},{"n":6,"q":"某 AI 新創公司申請 AI 系統認證，並聲稱其產品已通過我國「AI 產品與系統評測中心」之生成式 AI 評測。下列何者不屬於該中心之評測項目？","options":{"A":"安全 (Secure)","B":"公平 (Fair)","C":"效率 (Efficiency)","D":"可靠 (Reliability)"},"answer":"C","explanation":"生成式 AI 評測著重可信任性面向，如安全性、公平性、可靠性、隱私與可解釋性等。運算效率屬於效能指標，非該中心信任評測的核心項目，故C不屬於評測項目。"},{"n":7,"q":"某媒體集團計畫自行訓練一套生成式 AI 系統，用於自動產出新聞摘要與評論內容。在專案啟動會議中，法務與技術團隊共同討論如何從訓練階段就降低模型產出有害或偏頗內容的風險，並兼顧內容的多元性與公平性。請問下列哪一項措施最應該在模型訓練階段優先落實？","options":{"A":"確保訓練資料來源多元，並經過嚴格的內容清洗與偏見過濾，以減少模型學習到偏頗或有害的內容","B":"完全避免使用任何外部文本資料，以降低模型學習到不當內容的可能性","C":"僅使用公司內部的新聞稿與公告進行訓練，確保資料來源可控且符合企業立場","D":"限制模型僅能產出固定格式的內容，從輸出端約束模型避免生成不當資訊"},"answer":"A","explanation":"訓練階段降低偏頗與有害內容的根本作法是確保資料來源多元並進行清洗與偏見過濾。B完全不用外部資料會嚴重限制能力與多元性，C僅用內部資料反而加劇立場偏頗，D是輸出端約束而非訓練階段措施。"},{"n":8,"q":"某保險公司規劃推出一套 AI 核保輔助系統，針對線上投保申請進行初步風險評估並自動回覆審核結果。系統開發完成後，依據金融機構運用人工智慧技術作業規範，系統在正式與消費者互動前，必須確認相關揭露義務已落實。請問下列何者不屬於該規範要求金融機構必要揭露的事項？","options":{"A":"詳細公開本系統所採用的機器學習模型架構與完整訓練資料內容","B":"說明本服務的適用對象與用途範圍，使消費者了解系統的使用限制與服務邊界","C":"說明當消費者對 AI 核保結果有異議時，是否提供人工複核或申訴管道","D":"告知消費者本次核保審查結果係由 AI 系統自動完成，非人工逐案審核"},"answer":"A","explanation":"規範要求揭露的是服務範圍與限制、申訴管道、以及是否由 AI 自動決策等消費者權益相關資訊。完整公開模型架構與訓練資料涉及營業秘密且非必要揭露事項，故A不屬於必要揭露。"},{"n":9,"q":"某大型醫院導入 AI 輔助診斷系統，用於分析病患的電子病歷與影像資料並提供疾病風險評分。系統上線後，院方陸續收到三類回饋：①放射科醫師反映無法理解系統判斷某病患為高風險的依據與理由；②數位治理委員會發現系統對特定族群的風險評分明顯偏高；③資訊安全部門指出部分病患個資在未告知當事人的情況下被納入模型再訓練。依據 AI 倫理五大核心原則，上述三類問題分別對應哪一項原則的違反？","options":{"A":"①違反安全性、②違反問責性、③違反透明性","B":"①違反隱私性、②違反安全性、③違反公平性","C":"①違反公平性、②違反透明性、③違反問責性","D":"①違反透明性、②違反公平性、③違反隱私性"},"answer":"D","explanation":"①醫師無法理解判斷依據屬透明性（可解釋性）問題；②對特定族群評分偏高屬公平性問題；③未告知當事人即納入個資再訓練屬隱私性問題，故D正確對應。"},{"n":10,"q":"某市政府環保局計畫建立空氣品質監測 AI 系統，需整合全市 5 萬個感測器的即時數據（每秒產生大量資料記錄），並持續接收氣象、交通與工廠排放等資料，且需即時處理持續產生的資料。就大數據特性分析，下列何者最能說明此專案面臨的主要挑戰組合？","options":{"A":"Volume 與 Velocity，因為資料量龐大且持續高速產生","B":"Variety 與 Veracity，因為資料來源多元且需確保正確性","C":"Velocity 與 Value，因為需即時判斷資料是否具有分析價值","D":"Volume 與 Value，因為需從大量資料中篩選出有用資訊"},"answer":"A","explanation":"5 萬個感測器每秒產生大量記錄且需即時處理，強調的是資料量龐大（Volume）與高速持續產生（Velocity），故A最貼切。題幹核心挑戰在量與速，而非多元性、正確性或價值篩選。"},{"n":11,"q":"某保險公司建立理賠風險預測模型時，資料科學家在特徵選擇階段提出以「性別」作為預測愛滋病毒感染風險的輸入特徵之一。資料治理委員會在審查特徵清單時，對此提出異議。下列哪一項理由最能說明「以性別預測愛滋病毒感染風險」是不適當的原因？","options":{"A":"性別為類別型變數，需進行編碼轉換才能輸入模型，增加前處理複雜度","B":"性別特徵在資料集中可能存在缺失值，影響模型訓練的穩定性","C":"以性別作為感染風險的代理特徵，會強化對特定族群的歧視性標籤，違反公平性原則","D":"性別特徵與感染風險之間的統計相關性有限，可能降低模型預測效能"},"answer":"C","explanation":"以性別作為感染風險的代理特徵會強化對特定族群的刻板印象與歧視性標籤，違反 AI 公平性原則，故C最能說明其不適當。A、B、D僅屬技術層面考量，未觸及倫理與歧視的根本問題。"},{"n":12,"q":"某製造業導入 AI 進行生產排程，需整合 ERP（企業資源規劃系統）訂單資料、設備感測器產生的連續數值紀錄，以及維修技師手寫異常描述（掃描為 PDF）。資料治理主管需判斷三類資料的型態。下列何者最能正確對應其資料型態？","options":{"A":"ERP 訂單資料為半結構化、感測器數值為結構化、維修文字描述為非結構化","B":"ERP 訂單資料為結構化、感測器數值為結構化、維修文字描述為非結構化","C":"ERP 訂單資料為結構化、感測器數值為非結構化、維修文字描述為半結構化","D":"三者皆屬結構化資料，因為都可以轉換為數值格式後進行分析"},"answer":"B","explanation":"ERP 訂單為關聯式資料表屬結構化，感測器連續數值紀錄有固定欄位亦屬結構化，手寫掃描 PDF 為影像/自由文字屬非結構化，故B正確。"},{"n":13,"q":"某銀行建立機器學習模型預測客戶的貸款違約風險。資料集中有一個「職業類別」欄位，包含「工程師、教師、業務、自由業」等類別。工程師計劃將此欄位進行編碼處理後直接輸入線性模型。下列哪一種編碼方式最可能導致模型錯誤解讀類別之間的關係？","options":{"A":"One-Hot Encoding","B":"Binary Encoding","C":"Target Encoding","D":"Label Encoding"},"answer":"D","explanation":"Label Encoding 會將無序類別賦予 0、1、2、3 等整數，使線性模型誤以為類別間存在大小順序與距離關係，故最可能導致錯誤解讀。One-Hot 等方式不會引入虛假順序。"},{"n":14,"q":"某電力公司建立機器學習模型預測未來電力需求，使用三年以上的歷史時序資料，並以標準 k-fold 交叉驗證評估，但上線後誤差偏高。技術主管認為問題出在資料分割方式。下列何者最能說明使用標準 k-fold 交叉驗證的根本問題？","options":{"A":"k-fold 交叉驗證需要的計算資源過大，不適合處理三年以上的長期資料","B":"k-fold 交叉驗證會隨機分割資料，使訓練集中可能包含比測試集更晚的時間點，破壞時間依賴性","C":"k-fold 交叉驗證的折數設定過少，應改為 10-fold 以提升驗證穩定性","D":"k-fold 交叉驗證僅適用於分類問題，不適合電力需求這類連續數值預測任務"},"answer":"B","explanation":"時序資料具時間依賴性，標準 k-fold 隨機分割會造成訓練集含有比測試集更晚的未來資料，形成資料洩漏並高估驗證表現，故B正確。應改用時序切分（如 TimeSeriesSplit）。"},{"n":15,"q":"某醫療院所建置病患再住院風險預測模型，特徵包含「年齡」、「體重」、「血壓數值」及「診斷類別代碼」等，資料科學家考慮是否需對數值特徵進行標準化（Standardization）處理。下列何種模型對特徵尺度最不敏感、最適合在不進行標準化的情況下直接使用上述特徵進行訓練？","options":{"A":"線性迴歸 (Linear Regression)","B":"支援向量機 (Support Vector Machine)","C":"K 近鄰演算法 (K-Nearest Neighbors)","D":"決策樹 (Decision Tree)"},"answer":"D","explanation":"決策樹依單一特徵的閾值切分，與特徵絕對尺度無關，故對是否標準化最不敏感。線性迴歸、SVM、KNN 皆以距離或係數為基礎，特徵尺度差異會明顯影響結果。"},{"n":16,"q":"某企業集團在多個領域導入 AI 技術，應用於不同業務場景。請問下列哪一項最符合異常檢測 (Anomaly Detection) 的主要應用目標？","options":{"A":"分析客戶的消費行為資料，將客群依偏好進行分群，以制定差異化行銷策略","B":"根據歷史交易與客戶資料，建立模型預測未來可能發生違約的客戶","C":"彙整企業各部門的營運數據，建立儀表板供管理層追蹤關鍵績效指標 (KPI) 的變化","D":"從設備感測資料中，即時偵測出與正常運作模式顯著偏離的訊號，以預警可能發生的故障"},"answer":"D","explanation":"異常檢測的目標是找出偏離正常模式的少數異常樣本，D偵測設備偏離訊號以預警故障正是典型應用。A屬分群，B屬預測分類，C屬報表視覺化，皆非異常檢測。"},{"n":17,"q":"某交通局計劃將公車乘客刷卡資料提供給學術機構進行通勤模式研究，該資料包含卡號、上下車時間、路線編號等欄位，且需保留跨時間追蹤同一乘客行為的能力。為保護乘客隱私，下列哪種處理方式最符合個人資料保護法的去識別化要求？","options":{"A":"將卡號欄位全部刪除，僅保留上下車時間與路線編號","B":"對卡號進行 MD5 雜湊處理，並保留對照表供查詢","C":"將資料彙總為每日各路線總乘客數統計","D":"將卡號替換為隨機編號，且不保留任何對應關係"},"answer":"D","explanation":"以一致的隨機編號取代卡號（假名化）且不保留對應關係，既無法反推真實身份，又能讓同一乘客在不同時間對應同一編號以維持追蹤能力，故D最符合。A無法追蹤同一人，B保留對照表仍可還原身份，C彙總後失去個別追蹤能力。"},{"n":18,"q":"某工業感測器回傳溫度時序資料，約 5% 出現遺漏值，確認為短暫失聯所致，非設備異常。資料工程師需在不引入虛假異常的前提下進行補值。考量資料具時間連續性，下列何種填補方式最為合適？","options":{"A":"將遺漏值全數填補為 0","B":"以前後時間點的觀測值進行線性插補","C":"填補整份資料的平均值","D":"直接刪除包含遺漏值的時間點"},"answer":"B","explanation":"溫度時序具時間連續性，以前後時間點做線性插補能平滑地估計缺失值，不會引入虛假跳變。填 0 或全域平均會造成突兀異常，直接刪除則破壞時間序列的連續性。"},{"n":19,"q":"某溫室農場開發 AI 系統自動識別作物葉片上的害蟲種類，測試結果顯示：在 1000 張測試影像中，該系統正確識別出 80 隻害蟲，但誤判了 20 張正常葉片為有害蟲，同時漏檢了 10 隻實際存在的害蟲。對於害蟲檢測這個關鍵任務，下列哪個評估指標最需要優先關注？","options":{"A":"召回率 (Recall)","B":"精確率 (Precision)","C":"準確率 (Accuracy)","D":"F1 分數 (F1-Score)"},"answer":"A","explanation":"害蟲防治中漏檢（假陰性）代價最高，可能導致蟲害擴散，因此應優先關注衡量「實際害蟲被抓出比例」的召回率。精確率關注誤報，準確率在類別不均時易失真。"},{"n":20,"q":"某跨國企業需透過網路將各國子公司之敏感資料傳輸至總部進行模型訓練。資訊安全主管要求在傳輸過程中防範中間人攻擊，避免資料遭竊取或竄改。在不影響系統跨國即時傳輸效率之前提下，下列哪一項措施最能有效降低此風險？","options":{"A":"在接收端加強存取權限與身分驗證，限制只有授權人員可讀取資料","B":"在資料傳輸過程中進行加密，並確認雙方身分以確保通訊安全","C":"將資料拆分為多個部分分批傳送，降低單次資料外洩風險","D":"改用離線備援方式進行跨國資料交換，以降低網路攻擊風險"},"answer":"B","explanation":"防範中間人攻擊的關鍵是傳輸過程加密（如 TLS）並驗證雙方身分，可同時避免竊取與竄改且不影響即時傳輸，故B最有效。A僅保護接收端，C分批傳送仍可被攔截，D離線交換違反即時傳輸需求。"},{"n":21,"q":"關於深度學習 (Deep Learning)，下列敘述何者最為正確？","options":{"A":"深度學習模型通常需要人工設計特徵，以提升模型表現","B":"深度學習主要應用於資料壓縮與特徵轉換，較少用於預測任務","C":"深度學習透過多層神經網路，能自動從大量資料中學習抽象特徵","D":"深度學習模型通常不需要大量資料即可達到良好效果，適合資料量有限的情境"},"answer":"C","explanation":"深度學習的核心優勢是透過多層神經網路自動從大量資料中學習由低到高的抽象特徵，故C正確。A的人工設計特徵是傳統機器學習做法，B、D對深度學習的用途與資料需求描述皆錯誤。"},{"n":22,"q":"某企業於不同業務場景導入 AI 應用。下列關於其應用情境與機器學習類型的敘述，何者正確？","options":{"A":"客服對話分析中，同時使用少量標註資料與大量未標註資料進行訓練，屬於監督式學習 (Supervised Learning)","B":"商品分類系統依據顧客購買行為自動將商品分群，且未使用任何標註資料，屬於監督式學習 (Supervised Learning)","C":"自動駕駛系統根據操作結果的回饋持續調整決策策略，屬於非監督式學習 (Unsupervised Learning)","D":"使用者行為分析中，依據瀏覽與點擊模式將使用者分群，且未使用標註資料，屬於非監督式學習 (Unsupervised Learning)"},"answer":"D","explanation":"依瀏覽點擊模式將使用者分群且無標註資料，屬非監督式學習，D正確。A混用少量標註與大量未標註應為半監督式學習，B分群無標註應為非監督式，C依回饋調整策略應為強化學習。"},{"n":23,"q":"某房仲業者委託 AI 團隊開發一套房價預測系統，希望根據物件坪數、屋齡、樓層與地段等條件，自動估算每間房屋的成交價格，供業務人員作為議價參考依據。下列哪一種指標最適合在系統上線前評估模型的預測準確程度？","options":{"A":"均方誤差 (MSE)","B":"精確率 (Precision)","C":"F1 分數 (F1 Score)","D":"召回率 (Recall)"},"answer":"A","explanation":"房價預測是連續數值的迴歸問題，應以均方誤差 (MSE) 等迴歸指標衡量預測值與實際價格的偏差。精確率、召回率、F1 分數皆為分類問題的評估指標，不適用於此。"},{"n":24,"q":"某電商平台導入強化學習 (Reinforcement Learning) 技術優化商品推薦策略，AI 代理 (AI Agent) 會根據使用者的點擊與購買行為持續調整推薦內容。技術團隊在討論中發現，系統面臨一個核心挑戰：若 AI Agent 總是推薦過去表現良好的商品，可能會錯失發掘更高潛力商品的機會；但若頻繁嘗試未知商品，又可能影響短期的推薦成效與使用者體驗。請問上述情境敘述的是強化學習中哪一個核心問題？","options":{"A":"探索與利用的權衡 (Exploration vs. Exploitation)","B":"偏差與變異的權衡 (Bias vs. Variance)","C":"梯度爆炸與消失 (Vanishing and Exploding Gradients)","D":"過擬合與欠擬合 (Overfitting and Underfitting)"},"answer":"A","explanation":"在利用已知好商品與探索未知潛力商品之間取捨，正是強化學習的探索與利用權衡 (Exploration vs. Exploitation)。B、C、D分別是統計學習誤差分解、梯度問題與擬合問題，皆非此情境。"},{"n":25,"q":"某語音辨識系統需分析長時間的語音序列，發現當句子較長時，模型難以保留較早時刻的資訊，導致辨識準確度下降。為改善此問題，下列何種模型最適合？","options":{"A":"長短期記憶網路 (LSTM)","B":"循環神經網路 (RNN)","C":"卷積神經網路 (CNN)","D":"生成式對抗網路 (GAN)"},"answer":"A","explanation":"LSTM 透過閘門與記憶單元機制緩解一般 RNN 的長期依賴與梯度消失問題，能較好地保留較早時刻的資訊，最適合長語音序列。CNN 擅長影像，GAN 用於生成，皆不適用。"},{"n":26,"q":"某大型連鎖超市建置生鮮商品損耗預測模型，以減少報廢損失。資料庫中共有 120 萬筆銷售紀錄，但僅有約 8 萬筆資料標記為「正常銷售」或「損耗發生」，其餘資料均未標註。在標註資源有限的情況下，團隊希望提升模型預測表現。請問下列哪一種機器學習方式最適合此情境？","options":{"A":"監督式學習 (Supervised Learning)，以 8 萬筆已標註資料訓練分類模型，捨棄其餘 112 萬筆無標註資料","B":"半監督式學習 (Semi-supervised Learning)，同時利用少量已標註資料學習分類邊界，並從大量無標註資料中學習資料整體分布特性","C":"非監督式學習 (Unsupervised Learning)，對全部 120 萬筆資料進行自動分群，再由專家事後人工確認各群所代表的損耗類型","D":"強化學習 (Reinforcement Learning)，讓模型在每次預測後依據實際損耗結果作為回饋訊號，持續調整損耗預警策略"},"answer":"B","explanation":"少量標註加大量未標註資料的情境正是半監督式學習的用武之地，可同時利用標註資料學習分類邊界並從無標註資料學習整體分布，故B最適合。A捨棄大量資料浪費資訊，C、D不符標註有限但需分類預測的需求。"},{"n":27,"q":"某製造業評估在不同場景導入 AI，包含：（甲）依據設備感測器數值判斷是否出現異常；（乙）依據客服對話內容判斷客戶情緒；（丙）依據產品影像輪廓直接進行瑕疵分類。下列哪一種情境最適合以自編碼器 (Autoencoder) 作為主要模型架構？","options":{"A":"甲","B":"乙","C":"丙","D":"甲乙丙皆適合"},"answer":"A","explanation":"自編碼器可透過重建誤差偵測異常，適合以正常感測數據學習後找出偏離模式的異常，故（甲）最適合。（乙）情緒分析屬 NLP 分類，（丙）瑕疵分類為監督式影像分類，皆非自編碼器的典型用途。"},{"n":28,"q":"某 AI 團隊正在訓練一個深度神經網路，用於辨識工廠產線上的瑕疵零件。工程師發現訓練過程中損失函數震盪幅度大，且不同批次資料造成模型學習方向不穩定。為改善此問題，團隊在各隱藏層加入 Batch Normalization 機制。請問此調整在訓練階段最主要的作用為何？","options":{"A":"將輸入影像標準化，使不同類別的特徵分布更加一致","B":"自動調整模型權重初始化方式，以避免訓練初期震盪","C":"增加模型隱藏層的非線性能力，以提升分類精度上限","D":"降低不同批次輸入造成的內部特徵分布變動，使梯度更新更穩定"},"answer":"D","explanation":"Batch Normalization 對每個批次的隱藏層輸出做標準化，減少內部共變量偏移 (Internal Covariate Shift)，使各層輸入分布穩定、梯度更新更順暢，故D正確。它作用於隱藏層而非僅輸入，也非權重初始化或增加非線性。"},{"n":29,"q":"某 AI 研究團隊採用 GRPO (Group Relative Policy Optimization) 作為一種基於強化學習的模型優化方法，用於提升大型語言模型的表現。請問 GRPO 最適合用來強化模型在哪一類任務上的表現？","options":{"A":"判斷客服留言的情緒傾向，將每則訊息快速歸類為正面、負面或中性","B":"將客服電話錄音即時轉換為文字，供後續人工審閱使用","C":"針對數學應用題或邏輯謎題，逐步推導出正確解答","D":"分析商品圖片的外觀特徵，自動辨識類別與品項"},"answer":"C","explanation":"GRPO 這類強化學習方法可依可驗證的最終答案給予獎勵，特別適合強化模型的多步推理能力，故最適合數學或邏輯謎題的逐步推導。A為情緒分類，B為語音轉文字，D為影像辨識，皆非推理型任務。"},{"n":30,"q":"某法律科技公司開發一套合約風險審查系統，可自動分析合約內容並標示潛在的高風險條款。律師在使用過程中，希望了解模型做出風險判斷的依據，因此系統導入顯著性圖 (Saliency Map) 作為可解釋 AI 的方法。請問在此自然語言處理 (NLP) 應用情境中，顯著性圖主要用來標示什麼？","options":{"A":"合約中各段落之間的語意相似程度，協助辨識重複或可能矛盾的條款","B":"模型在進行預測時，輸入文字中對結果影響程度較高的文字片段","C":"不同版本合約之間的文字差異，用以標示新增或修改的條款位置","D":"模型在訓練資料中學習到的高頻詞彙，反映常見的風險相關用語"},"answer":"B","explanation":"顯著性圖透過梯度等方式標示輸入中對模型預測結果貢獻最大的部分，在 NLP 中即標示對判斷影響最大的文字片段，故B正確。A、C、D皆非顯著性圖的功能。"},{"n":31,"q":"某製造業 AI 品質預測模型採用部分依賴圖 (Partial Dependence Plots, PDP) 分析特徵影響效果。資料科學家希望了解「溫度特徵」對良品率的整體影響趨勢，但主管進一步詢問，是否能用 PDP 判斷某一筆瑕疵產品批次資料中，溫度是否為主要原因。下列何者最能說明 PDP 在此情境中的限制？","options":{"A":"PDP 無法顯示模型的預測準確率","B":"PDP 僅能反映模型輸出結果，無法提供任何特徵影響的資訊","C":"PDP 僅能用於單一特徵分析，無法同時考慮多個特徵的影響","D":"PDP 僅呈現整體趨勢，無法判斷單一批次的原因"},"answer":"D","explanation":"PDP 呈現的是特徵在整體資料上對預測的平均邊際影響，屬全局解釋，無法用於解釋單一樣本（單一批次）的成因，故D正確。若要解釋個別實例應改用 LIME、SHAP 等局部解釋方法。"},{"n":32,"q":"某銀行使用 LIME (Local Interpretable Model-agnostic Explanations) 來解釋其信貸審核模型的決策結果。分析師在閱讀解釋報告時，看到系統建立了一個簡化模型來近似原模型在該筆資料附近的行為。下列何者最能說明 LIME 中代理模型 (Surrogate model) 的意義？","options":{"A":"一個全局解釋所有預測的線性代理模型","B":"用於產生擾動資料的資料生成機制","C":"一種獨立訓練的生成式模型，用於輔助預測","D":"用於擬合原黑箱模型在目標實例附近的預測行為"},"answer":"D","explanation":"LIME 透過在目標實例鄰域產生擾動樣本並以簡單可解釋模型（如線性模型）局部擬合黑箱模型的行為，故代理模型是用於逼近原模型在該實例附近的預測，D正確。LIME 是局部而非全局解釋，故A錯誤。"},{"n":33,"q":"小明在 2025 年使用 AI 模型，將自己的照片轉換為公仔風格影像。該模型在維持生成品質的同時，也能在模型規模較大的情況下兼顧運算效率。下列何者最能敘述此模型可能採用的設計方式？","options":{"A":"基於單一稠密 Transformer 架構，每次運算都使用全部模型參數","B":"採用稀疏專家混合 (Sparse Mixture-of-Experts) 架構，每次僅使用部分模型參數以提升效率","C":"採用生成對抗網路 (GAN)，透過兩個模型互相比較來提升影像品質","D":"採用卷積神經網路 (CNN)，直接進行影像轉換"},"answer":"B","explanation":"稀疏專家混合 (Sparse MoE) 可在維持大規模參數量的同時，每次推理僅啟用部分專家，兼顧模型容量與運算效率，最符合題意。A每次用全部參數不利效率，C、D未體現「大規模又高效」的設計。"},{"n":34,"q":"CLIP 與 DINO 皆屬於自監督學習 (Self-supervised Learning) 模型，但其訓練資料來源有所不同。下列何者最能正確敘述兩者在訓練資料型態上的差異？","options":{"A":"皆使用有標註圖像資料進行監督式學習","B":"皆使用未標註圖像資料進行自監督學習","C":"CLIP 使用圖像與文字配對資料，DINO 使用未標註圖像資料","D":"CLIP 使用未標註圖像資料，DINO 使用圖像與文字配對資料"},"answer":"C","explanation":"CLIP 以大量圖像—文字配對進行對比學習，DINO 則僅用未標註圖像做自蒸餾自監督學習，故C正確。D將兩者顛倒，A、B皆未反映兩者資料型態的差異。"},{"n":35,"q":"某企業導入大型語言模型 (LLM) 進行長篇法規文件的問答查詢。使用者反映，當問題需整合文件中較不相關位置的分散資訊時，模型回答的連貫性與準確性明顯下降。技術團隊認為此現象與模型架構特性有關。下列何者最能說明傳統 Transformer 在此情境下的限制？","options":{"A":"模型在推理時僅能依賴固定長度的上下文窗口，無法同時處理分散於全文的資訊","B":"模型能記住的內容取決於訓練語料，推理時遇到新內容可能無法應對","C":"Transformer 在長序列處理時效率下降，但仍可完整處理所有輸入內容","D":"每次推理後 Transformer 都需重新訓練才能記住新的資訊"},"answer":"A","explanation":"傳統 Transformer 受限於固定長度的上下文窗口，超出範圍或分散於長文各處的資訊難以同時納入，導致整合能力下降，故A正確。B談的是知識而非上下文長度，C自相矛盾，D與 Transformer 推理機制不符。"},{"n":36,"q":"小明剛加入一間電商公司擔任 AI 專案的業務窗口，在與技術團隊的交接會議中，工程師說明模型訓練時，會持續比對預測值與實際值之間的差距，並透過一套機制逐步調整模型內部參數，直到預測結果趨於穩定為止。請問工程師敘述的是深度學習中哪個元件的功能？","options":{"A":"優化器 (Optimizer)","B":"資料前處理模組","C":"模型架構","D":"激活函數 (Activation Function)"},"answer":"A","explanation":"根據損失（預測值與實際值的差距）逐步調整模型參數以最小化誤差，正是優化器 (Optimizer) 的功能，故A正確。資料前處理處理輸入資料，模型架構決定結構，激活函數提供非線性，皆非此功能。"},{"n":37,"q":"某醫療 AI 系統使用深度學習模型分析胸腔 X 光影像，判斷是否有肺部病變。醫院評估委員會要求該系統必須能夠標示「影像中哪些區域對本次診斷判斷影響最大」，以供放射科醫師進行審核確認。下列哪一種可解釋 AI 技術最能直接滿足「標示影像中對預測結果影響最大的區域」此一需求？","options":{"A":"LIME (Local Interpretable Model-agnostic Explanations)","B":"SHAP (SHapley Additive exPlanations)","C":"部分依賴圖 (Partial Dependence Plot, PDP)","D":"顯著性圖 (Saliency Map)"},"answer":"D","explanation":"顯著性圖能以熱力圖方式直接在影像上標示對模型預測貢獻最大的像素區域，最符合「標示影像中影響最大的區域」的需求，故D正確。LIME、SHAP 偏特徵貢獻，PDP 呈現全局趨勢，均不如顯著性圖直接。"},{"n":38,"q":"某社群平台建置系統偵測異常評論行為，例如大量重複貼文或疑似機器人生成的評論。由於此類異常樣本難以事先完整標記，系統主要依據大量正常評論的分布來偵測偏離者。請問下列哪一種機器學習方式最適合此情境？","options":{"A":"非監督式學習 (Unsupervised Learning) 的關聯規則挖掘，從評論中找出常見字詞組合","B":"監督式學習 (Supervised Learning)，以完整標註的正常與異常樣本訓練分類模型","C":"半監督式學習 (Semi-supervised Learning)，以少量標註與大量正常評論分布，學習偵測偏離正常模式的異常評論行為","D":"強化學習 (Reinforcement Learning)，透過回饋機制優化評論判斷策略"},"answer":"C","explanation":"異常樣本難以完整標記、主要依據大量正常資料的分布來找出偏離者，適合半監督式（以正常樣本為主的異常偵測）做法，故C正確。B需完整標註不符現況，A為關聯規則非異常偵測，D不適用此判別任務。"},{"n":39,"q":"在命名實體辨識 (Named Entity Recognition, NER) 任務中，模型需根據整句文字判斷每個詞的標籤，並考慮詞與詞之間的關聯性。若採用 Conditional Random Field (CRF) 作為模型，下列何者最能描述其模型類型？","options":{"A":"生成式模型 (Generative Model)","B":"無監督模型 (Unsupervised Model)","C":"鑑別式模型 (Discriminative Model)","D":"自迴歸模型 (Autoregressive Model)"},"answer":"C","explanation":"CRF 直接對給定觀測序列下的標籤序列條件機率 P(Y|X) 建模，屬鑑別式模型，故C正確。它不建模資料的聯合分布（非生成式），也非無監督或自迴歸模型。"},{"n":40,"q":"某音樂串流平台希望開發一套 AI 系統，能根據平台上累積的大量歌曲資料，自動生成具有不同風格變化的全新旋律，供創作者作為靈感參考。平台技術長在評估方案時強調，系統不能只是播放或拼接既有歌曲片段，也不能僅進行資料的重建，而是要真正學習音樂的結構與風格，並創作出從未出現過的新旋律。請問下列哪一種模型技術最符合此需求？","options":{"A":"K-近鄰演算法 (K-Nearest Neighbors, KNN)","B":"自編碼器 (Autoencoder)","C":"生成對抗網路 (GAN)","D":"隨機森林 (Random Forest)"},"answer":"C","explanation":"生成對抗網路 (GAN) 能學習資料的分布並生成從未出現過的新樣本，最符合創作全新旋律的需求，故C正確。KNN、隨機森林屬判別/預測模型，自編碼器偏重壓縮與重建，非真正的新內容生成。"},{"n":41,"q":"某資安公司正在評估導入機器學習模型來偵測網路流量中的異常連線行為。技術團隊在比較各種演算法時，其中一位工程師建議採用支援向量機 (SVM)。請問下列何者最正確敘述支援向量機的特性？","options":{"A":"擅長處理大規模非結構化資料，且模型訓練完成後可自動適應新進資料而無需重新建模","B":"透過多個模型的集體決策來提升預測穩定性，在資料量不足時仍能維持一致的準確率","C":"在高維度且樣本數相對有限的情境下表現良好，但當訓練資料量龐大時運算成本高、效率較差","D":"具備強大的特徵自動萃取能力，特別適合影像與語音等需要逐層抽象化處理的複雜任務"},"answer":"C","explanation":"SVM 在高維度、樣本數相對有限的情境下表現良好，但其訓練複雜度隨資料量增加而快速上升，大規模資料時運算成本高，故C正確。B描述的是集成學習，D描述的是深度學習，A亦不符 SVM 特性。"},{"n":42,"q":"下列哪一項是可解釋人工智慧 (XAI) 方法中，LIME (Local Interpretable Model-agnostic Explanations) 最可能被用於的情境？","options":{"A":"分析即時通訊系統中訊息傳輸效率的瓶頸","B":"建立機制以強化系統中的資料安全與隱私保護","C":"當某筆貸款申請被模型拒絕時，分析該筆資料中各項因素與結果之間的關聯","D":"監控並優化推薦系統的回應速度與系統效能，以提升整體使用體驗"},"answer":"C","explanation":"LIME 提供針對單一預測的局部解釋，最適合說明「某筆貸款為何被拒」這類個案決策依據，故C正確。A、D屬效能監控，B屬資安隱私，皆非可解釋 AI 的用途。"},{"n":43,"q":"某信用評分公司導入 SHAP (SHapley Additive exPlanations) 框架分析機器學習模型的輸出行為。分析師希望了解：「對於某位特定申請人被評為高風險的信用評分，各項輸入特徵分別對這個評分結果貢獻了多少」。下列哪一項最能正確說明 SHAP Shapley 值在此情境中所提供的資訊？","options":{"A":"各特徵在模型訓練過程中對結果穩定性的影響程度","B":"此申請人的各項特徵，分別讓風險評分上升或下降的影響程度","C":"各特徵在所有客戶資料中對整體預測準確度的影響程度","D":"各特徵在模型中被使用的頻率"},"answer":"B","explanation":"SHAP 的 Shapley 值量化單一預測中每個特徵相對於基準值使輸出上升或下降的貢獻量，正好回答「各特徵讓此申請人評分升降多少」，故B正確。A、C談整體或訓練層面，D談使用頻率，皆非 Shapley 值的意義。"},{"n":44,"q":"某金融集團評估將大型語言模型導入客服與風控 AI 系統，團隊採用如 120B 參數等級的超大型語言模型以確保回應品質。請問下列何者最能說明企業在正式環境部署超大型語言模型時，最需要優先考量的因素？","options":{"A":"模型參數量龐大，導致每次輸出結果差異極大，難以符合金融業對回應一致性的要求","B":"超大型模型無法支援批次處理，在高併發的客服場景下將造成嚴重的服務瓶頸","C":"推理延遲較高且運算資源消耗龐大，每次請求成本遠高於小型模型，需在模型效能與營運成本之間審慎權衡","D":"模型會依任務複雜度自動調整運算資源配置，因此不需特別考量推理成本"},"answer":"C","explanation":"部署超大型 LLM 最需優先考量的是高推理延遲與龐大運算資源導致的每次請求成本，需在效能與營運成本間權衡，故C正確。A、B對模型特性描述有誤，D宣稱可自動調配而無需考量成本亦不正確。"},{"n":45,"q":"某智慧交通系統在城市主要路口安裝監視攝影機，需即時識別畫面中的汽車、機車、公車等不同車輛類型，並統計各路口的車輛流量以支援號誌控制優化。下列哪一種神經網路架構最適合處理此類影像中的物件類型識別任務？","options":{"A":"循環神經網路 (RNN)，適合處理序列資料","B":"卷積神經網路 (CNN)，適合處理影像資料","C":"長短期記憶網路 (LSTM)，適合處理長期依賴","D":"多層感知機 (MLP)，將輸入資料轉換為數值後進行分類"},"answer":"B","explanation":"卷積神經網路 (CNN) 擅長擷取影像的空間特徵，最適合處理路口監視影像中的車輛類型識別，故B正確。RNN、LSTM 適合序列資料，MLP 缺乏對影像空間結構的建模能力。"},{"n":46,"q":"AutoSkill 框架的主要目標是什麼？","options":{"A":"建立一個降低對大型語言模型 (LLM) 依賴的自動化系統","B":"透過持續更新模型參數來提升任務表現","C":"將重複的互動經驗轉化為可重複使用的明確技能模組","D":"透過檢索外部知識來改善模型回應品質"},"answer":"C","explanation":"AutoSkill 的核心目標是把代理在重複互動中累積的經驗萃取、固化為可重複使用的明確技能模組，以提升後續任務效率，故C正確。A、B、D分別對應不同技術目標，非 AutoSkill 的主旨。"},{"n":47,"q":"某大型語言模型 (LLM) 在訓練過程中，研究人員發現模型在生成文本時，長期集中產生少數幾種相似的回應形式，缺乏多樣性。下列何者最能說明此現象及其可能原因？","options":{"A":"過度擬合 (Overfitting)","B":"模式崩潰 (Mode Collapse)","C":"梯度消失 (Vanishing Gradient)","D":"模型收斂速度 (Convergence Rate)"},"answer":"B","explanation":"模型只輸出少數幾種相似形式、喪失生成多樣性，正是模式崩潰 (Mode Collapse) 的典型現象，故B正確。過度擬合是記住訓練資料，梯度消失是深層訓練問題，收斂速度描述訓練快慢，皆非此現象。"},{"n":48,"q":"某電商平台建置機器學習模型，用於預測用戶在瀏覽特定商品後的購買機率。模型上線初期表現穩定，但維運團隊在定期審查中發現兩種不同情形：情形甲：模型上線半年後恰逢消費趨勢轉變，過去高購買意願的用戶行為模式（如長時間停留商品頁）不再是強烈的購買訊號，即便輸入特徵分布與訓練期相近，模型預測準確率仍明顯下降。情形乙：平台新增了行動裝置端的入口，新用戶的年齡分布、裝置類型與使用時段特徵與原訓練資料差異顯著，導致模型對這批用戶的預測偏差增大。下列哪一項最能正確對應兩種情形所屬的模型劣化類型？","options":{"A":"甲為資料漂移 (Data Drift)、乙為概念漂移 (Concept Drift)","B":"甲為概念漂移 (Concept Drift)、乙為資料漂移 (Data Drift)","C":"甲為模型過擬合 (Overfitting)、乙為資料漂移 (Data Drift)","D":"甲與乙均屬概念漂移 (Concept Drift)，因為兩者都導致模型預測準確率下降"},"answer":"B","explanation":"情形甲的輸入特徵分布相近但特徵與目標的關係改變（同樣行為不再代表購買意願），屬概念漂移；情形乙的輸入特徵分布本身顯著改變，屬資料漂移，故B正確。"},{"n":49,"q":"某資安公司目前以鑑別式 AI 偵測已知網路攻擊。為因應新型變種攻擊，研究人員計劃利用生成式 AI 模擬可能的攻擊流量，並納入防禦模型訓練。下列何者最能說明此做法對鑑別式 AI 防禦模型的主要助益？","options":{"A":"生成式 AI 可取代真實攻擊資料，降低蒐集成本","B":"生成式 AI 可直接負責防禦決策，取代原有模型","C":"模擬攻擊資料可使模型自動轉為生成式架構","D":"將模擬攻擊納入訓練，可提升模型對未知攻擊的辨識能力"},"answer":"D","explanation":"以生成式 AI 模擬可能的變種攻擊並納入訓練，可讓鑑別式防禦模型見識更多樣的攻擊態樣，提升對未知/新型攻擊的辨識能力，故D正確。A只是降低成本非主要助益，B、C對兩類模型角色的描述有誤。"},{"n":50,"q":"某企業已部署一套預訓練大型語言模型作為內部知識問答系統，主要用於查詢人資、財務與法遵相關的內部規範。由於公司內規每月都會滾動更新，管理層要求系統在文件更新後必須能立即反映最新內容，不能等待模型重新訓練。技術團隊正在評估應採用檢索增強生成 (RAG) 還是微調 (Fine-tuning) 來因應此需求。請問下列哪一項評估最為正確？","options":{"A":"採用 Fine-tuning 較為適合，只要定期將更新後的內規文件加入訓練資料，模型便能即時反映最新規範內容","B":"採用 RAG 較為適合，將更新後的文件同步至外部知識庫，模型即可在不重新訓練的情況下立即查詢最新內容","C":"採用 Fine-tuning 較為適合，因為模型經過內規語料訓練後，回應品質會優於透過 RAG 生成的答案","D":"兩者皆可達成需求，差異僅在於建置成本高低，與系統能否即時反映更新內容無關"},"answer":"B","explanation":"RAG 將最新文件放入外部知識庫，查詢時即時檢索，無需重新訓練即可立即反映更新內容，最符合每月滾動更新且需即時生效的需求，故B正確。Fine-tuning 需重新訓練才能納入新內容，無法即時反映，A、C、D皆不正確。"}]},{"id":"s1-115-1","subject":"第一科：人工智慧基礎概論","exam":"115年第一次","questions":[{"n":1,"q":"下列何者不屬於資料整合 (Data Integration) 的主要目的？","options":{"A":"統一不同來源資料的格式與欄位定義，以確保分析一致性","B":"識別並處理重複資料，避免影響模型訓練結果","C":"整併多來源資料，以提升資料完整性與應用價值","D":"依資料保存政策延長原始資料留存期限，以利未來可能的分析需求"},"answer":"D","explanation":"資料整合的核心目的在於統一格式、去除重複並整併多來源資料以提升完整性（A、B、C）。延長原始資料留存期限屬於資料保存與生命週期管理範疇，並非資料整合的目的，故 D 不屬於。"},{"n":2,"q":"某智慧城市專案導入 AI 技術，以優化垃圾收集路線調度並即時監測空氣品質變化。系統需持續蒐集環境數據（如 PM2.5、氣體濃度）與設備狀態（如垃圾桶滿溢度）。下列何種技術最直接支援上述需求？","options":{"A":"專家系統 (Expert System)","B":"決策支援系統 (Decision Support System)","C":"啟發式決策引擎 (Heuristic Decision Engine)","D":"感測器網路 (Sensor Network)"},"answer":"D","explanation":"持續蒐集分散於各處的環境數據與設備狀態，最直接依賴感測器網路進行資料採集。A、B、C 皆屬於資料分析或決策層技術，並非負責即時感測與蒐集資料的機制。"},{"n":3,"q":"下列何者不符合非監督式學習 (Unsupervised Learning) 的典型特徵？","options":{"A":"模型可依據資料中的特徵相似性進行自動分群","B":"訓練過程中不需仰賴事先定義的標籤資料","C":"常用於探索資料的潛在結構或隱含模式","D":"模型主要學習輸入特徵與既定目標標記之間的對應關係"},"answer":"D","explanation":"非監督式學習不使用標籤，著重於分群與探索潛在結構（A、B、C）。D 描述的是學習輸入與既定目標標記間的對應關係，屬於監督式學習的特徵，故不符合。"},{"n":4,"q":"某保險公司建立 AI 理賠金額預測模型。歷史理賠資料經檢定後呈近似常態分佈，分析人員規劃進行離群值處理。下列何者最不適當？","options":{"A":"依統計準則（如 Z-score 或 IQR）評估後，再決定是否調整或處理極端值","B":"採用截尾 (Trimming) 處理極端值，以提升模型穩定性","C":"使用 One-hot 編碼 (One-hot Encoding) 將離群值轉換為類別特徵以改善數值穩定性","D":"結合領域知識評估其合理性，再決定保留或修正"},"answer":"C","explanation":"One-hot 編碼是針對類別型特徵的轉換方法，並非處理數值型離群值的手段，將離群值強制轉為類別特徵並不合理，故 C 最不適當。A、B、D 皆為常見且合理的離群值處理策略。"},{"n":5,"q":"某銀行建立 AI 詐欺交易偵測模型。歷史交易資料中，詐欺樣本比例極低，導致模型訓練時偏向預測為「正常交易」。資料科學團隊評估採用 SMOTE (Synthetic Minority Over-sampling Technique) 改善訓練資料分佈。下列何者最符合 SMOTE 技術的主要功能？","options":{"A":"透過隨機刪除部分正常交易資料，以降低類別失衡程度","B":"依據少數類別樣本的特徵空間，合成產生新的少數類別樣本","C":"調整模型的損失函數 (Loss Function) 權重，使誤判少數類別時的懲罰提高","D":"以交叉驗證 (Cross-validation) 方式重新分割資料集，使各折資料類別比例一致"},"answer":"B","explanation":"SMOTE 是一種過採樣技術，透過在少數類別樣本的特徵空間中內插合成新樣本以平衡資料分佈。A 為欠採樣、C 為調整損失權重、D 為交叉驗證，皆非 SMOTE 的作法。"},{"n":6,"q":"資料科學團隊在模型訓練前，需對數值特徵進行正規化 (Normalization) 或標準化 (Standardization)。為確保模型評估結果具真實性並避免資料洩漏 (Data Leakage)，下列何者為最適當的作法？","options":{"A":"於資料分割前，先對完整資料集計算統計量並進行標準化處理","B":"先分割訓練資料 (Training Data) 和測試資料 (Test Data)，並各自獨立計算統計量後進行標準化","C":"先分割訓練資料 (Training Data) 和測試資料 (Test Data)，僅以訓練資料計算統計量，再套用至測試資料","D":"僅對訓練資料 (Training Data) 進行標準化處理，測試資料 (Test Data) 保持原始數值"},"answer":"C","explanation":"為避免資料洩漏，統計量（如平均值、標準差）只能由訓練資料計算，再套用相同轉換至測試資料。A 使用整體資料會洩漏測試資訊；B 各自計算會造成分佈不一致；D 未轉換測試資料則無法比較。"},{"n":7,"q":"某電信公司建立機器學習模型預測用戶流失風險。資料中包含多個類別型特徵 (Categorical Features)，例如「資費方案類型」與「客戶地區」。為使模型能有效使用這些特徵，下列何者最直接用於將類別型特徵轉換為模型可處理的數值格式？","options":{"A":"資料分群 (Data Clustering)","B":"特徵交叉 (Feature Cross)","C":"One-hot 編碼 (One-hot Encoding)","D":"寬深模型 (Wide and Deep)"},"answer":"C","explanation":"One-hot 編碼是最直接將類別型特徵轉換為數值向量的方法。A 為分群、B 為特徵組合、D 為模型架構，皆非用於單純的類別轉數值。"},{"n":8,"q":"某零售企業在建置機器學習模型預測顧客購買機率時，資料同時包含大量稀疏類別特徵與數值型特徵。團隊希望模型既能學習過去已出現的特徵組合規律，也能對未出現的特徵組合做出合理預測。下列哪一種模型架構最適合此類需求？","options":{"A":"線性迴歸 (Linear Regression)","B":"決策樹 (Decision Tree)","C":"支援向量機 (Support Vector Machine, SVM)","D":"寬深模型 (Wide and Deep)"},"answer":"D","explanation":"Wide and Deep 模型以 Wide 部分（記憶）學習已出現的特徵組合規律，以 Deep 部分（泛化）對未見組合做出合理預測，正符合兼顧記憶與泛化的需求。A、B、C 難以同時滿足此兩項能力。"},{"n":9,"q":"某影音串流平台建立神經網路模型，用於預測使用者最可能感興趣的影片類型。模型輸出層需將結果轉換為各類別的機率分佈，以便系統依機率高低推薦內容。下列哪一種函數最適合用於模型輸出層？","options":{"A":"Softmax 函數 (Softmax Function)","B":"Sigmoid 函數 (Sigmoid Function)","C":"線性函數 (Linear Function)","D":"ReLU 函數 (Rectified Linear Unit Function)"},"answer":"A","explanation":"多類別分類需將輸出轉換為總和為 1 的機率分佈，Softmax 正是此用途。Sigmoid 適用於二元或多標籤機率；線性函數用於迴歸；ReLU 為隱藏層激活函數。"},{"n":10,"q":"某設計公司導入生成式 AI (Generative AI) 工具，用於自動產生產品概念圖與風格草圖。為了讓系統能依據既有圖像資料產生具有變化且風格一致的新圖像，模型必須具備學習資料特性並生成新樣本的能力。下列哪一種模型技術或方法最符合上述需求？","options":{"A":"變分自編碼器 (Variational Autoencoder, VAE)","B":"隨機森林 (Random Forest)","C":"K-近鄰演算法 (K-Nearest Neighbors, KNN)","D":"貝氏網路 (Bayesian Network)"},"answer":"A","explanation":"VAE 是生成式模型，能學習資料的潛在分佈並從中取樣生成具變化的新樣本。隨機森林、KNN 屬判別/分類方法，貝氏網路為機率推論模型，皆非影像生成的典型技術。"},{"n":11,"q":"某企業導入生成式 AI (Generative AI) 系統自動產出會議摘要，並規劃額外建置一套 AI 系統，用於評估摘要內容的正確性與完整性。下列何者為此 AI 系統的核心目標？","options":{"A":"自動新增專業名詞與技術指標","B":"判斷摘要是否遺漏關鍵資訊或出現語意錯誤","C":"調整語音轉文字結果","D":"自動標註摘要的關鍵字與主題標籤"},"answer":"B","explanation":"評估摘要正確性與完整性，核心在於偵測是否遺漏關鍵資訊或產生語意錯誤（如幻覺）。A、C、D 為內容增補、語音處理或標註功能，與品質評估目標不符。"},{"n":12,"q":"ChatGPT、Gemini 等對話型生成式 AI 工具所依據的基礎模型技術，下列何者正確？","options":{"A":"決策樹 (Decision Tree)","B":"大型語言模型 (Large Language Model, LLM)","C":"生成對抗網路 (Generative Adversarial Network, GAN)","D":"圖卷積網路 (Graph Convolutional Network, GCN)"},"answer":"B","explanation":"ChatGPT、Gemini 等對話型生成式 AI 均建立於大型語言模型 (LLM) 之上。GAN 主要用於影像生成，決策樹與 GCN 皆非對話生成的基礎架構。"},{"n":13,"q":"根據《金融機構運用人工智慧技術作業規範》，金融機構於使用人工智慧提供金融服務並直接與消費者互動時，下列何者非必要揭露之資訊？","options":{"A":"該服務之 AI 模型原始程式碼","B":"服務適用對象與用途範圍","C":"該服務是否為 AI 自動完成","D":"該服務是否提供替代方案"},"answer":"A","explanation":"規範要求揭露服務適用範圍、是否由 AI 自動完成及是否有替代方案，以保障消費者權益。模型原始程式碼屬營業機密與智慧財產，並非必要揭露之資訊，故 A 為答案。"},{"n":14,"q":"下列哪一項「AI 技術應用與產業領域」的對應最為恰當？","options":{"A":"利用 AI 分析商場顧客購買紀錄以預測股票市場波動—智慧交通","B":"使用 AI 進行設備故障預測與預防性維護—智慧製造","C":"以 AI 模型融合即時氣象資料與乘客消費行為特徵，推薦會員升級優惠方案—智慧醫療","D":"利用 AI 分析社群媒體互動以提升臨床診斷準確度—金融服務業"},"answer":"B","explanation":"設備故障預測與預防性維護正是智慧製造的典型應用，對應恰當。A、C、D 的應用內容與所標示的產業領域明顯不匹配。"},{"n":15,"q":"在資料處理中，下列何者屬於「結構化數據」的例子？","options":{"A":"儲存在 MySQL 資料庫中的訂單記錄","B":"以 JSON 格式儲存的商品訂單資訊","C":"用 XML 標註的產品目錄","D":"儲存在純文字檔案中的客服對話紀錄"},"answer":"A","explanation":"關聯式資料庫（如 MySQL）以固定表格欄位儲存資料，屬結構化數據。JSON、XML 屬半結構化資料，純文字對話紀錄屬非結構化資料。"},{"n":16,"q":"關於敘述性統計指標，下列敘述何者最為正確？","options":{"A":"中位數 (Median) 能有效反映極端值對資料分佈的影響","B":"標準差 (Standard Deviation) 越大，代表資料越集中","C":"百分位數 (Percentile) 主要用於衡量資料在整體分布中的相對位置","D":"平均值 (Mean) 適合描述偏態且包含離群值 (Outliers) 的資料"},"answer":"C","explanation":"百分位數用於表示某數值在整體分佈中的相對位置，敘述正確。中位數對極端值不敏感（A 錯）；標準差越大代表越分散（B 錯）；平均值易受離群值影響而不適合偏態資料（D 錯）。"},{"n":17,"q":"某企業資料分析人員需針對不同型態的數據選擇合適的視覺化工具。下列哪一種情境最適合使用直方圖 (Histogram)？","options":{"A":"檢視顧客年齡資料在不同區間的集中情形","B":"分析產品售價與銷售量之間的關聯程度","C":"比較各產品類別的年度銷售總額","D":"在地圖上標示各縣市加盟店的地理分布位置"},"answer":"A","explanation":"直方圖用於呈現單一數值變數的次數分佈與集中情形，最適合檢視年齡分佈（A）。B 適合散佈圖、C 適合長條圖、D 適合地圖。"},{"n":18,"q":"某電商平台工程師需在已排序的價格清單中，快速定位指定價格是否存在，給定排序後陣列：arr = [3, 8, 14, 19, 21, 27, 33, 45, 52]。若搜尋目標值為 27，且採用標準二分搜尋 (Binary Search) 流程（每次比較後排除中位數），請問最多需要比較幾次即可找到目標？","options":{"A":"2 次","B":"3 次","C":"4 次","D":"5 次"},"answer":"B","explanation":"第一次取中間值 arr[4]=21，27>21 往右；第二次取 arr[6]=33，27<33 往左；第三次取 arr[5]=27，命中。共比較 3 次。"},{"n":19,"q":"某物流公司導入強化式學習 (Reinforcement Learning) 優化車隊調度。模型在系統運行過程中，會依據不同配送狀態動態調整行動選擇方式，使決策結果逐步朝較佳績效收斂。上述模型在學習過程中的調整行為，最符合下列哪一項強化式學習核心機制？","options":{"A":"調整策略函數以改變行動選擇機率","B":"更新訓練資料分布以降低模型偏差","C":"重新分群狀態資料以識別決策類型","D":"建立正確決策標籤進行誤差修正"},"answer":"A","explanation":"強化式學習透過調整策略 (policy) 來改變在各狀態下的行動選擇機率，以最大化長期回饋。B、C、D 分別屬資料處理、分群與監督式標籤修正，非強化式學習核心機制。"},{"n":20,"q":"某團隊訓練影像分類模型，發現模型在訓練資料上的準確率達 98%，但在測試資料上僅有 72%。若團隊希望提升模型對新資料的適應能力，並增加訓練資料的多樣性，下列何者最適合？","options":{"A":"增加模型的深度與參數量，使模型學習更多細節","B":"對訓練影像進行旋轉、翻轉等隨機變化","C":"提高訓練速度，使模型更快完成學習","D":"僅保留模型表現較好的訓練資料"},"answer":"B","explanation":"此為過度擬合現象。透過旋轉、翻轉等資料增強 (Data Augmentation) 可增加訓練資料多樣性、提升泛化能力。A 會加劇過擬合、C 與泛化無關、D 會降低資料多樣性。"},{"n":21,"q":"某時尚品牌導入生成式 AI (Generative AI) 技術，建立服裝設計輔助系統。系統需根據設計師輸入的風格條件，自動產生具有高度視覺品質、細節穩定且風格變化自然的服裝草圖。團隊特別重視生成結果的穩定性與多樣性控制能力。在此需求下，下列哪一種模型技術或方法較為適合？","options":{"A":"支援向量機 (Support Vector Machine, SVM)","B":"生成對抗網路 (Generative Adversarial Network, GAN)","C":"決策樹 (Decision Tree)","D":"擴散模型 (Diffusion Model)"},"answer":"D","explanation":"擴散模型在高視覺品質影像生成上表現優異，且訓練較穩定、對生成多樣性的控制能力佳，符合題目強調的穩定性與多樣性需求。GAN 雖為生成模型但訓練較不穩定；SVM、決策樹非生成式模型。"},{"n":22,"q":"某製造業工廠規劃導入 AI 監控系統，持續分析設備感測數據（如溫度、震動與壓力）。系統需能在缺乏完整異常標註資料的情況下，辨識與一般運作型態顯著不同的狀態，並發出預警。在此需求下，下列何種技術較為適合？","options":{"A":"使用支援向量機 (Support Vector Machine, SVM) 建立異常分類模型","B":"以決策樹 (Decision Tree) 學習異常類型的判斷規則","C":"使用變分自編碼器 (Variational Autoencoder, VAE) 學習正常資料分佈","D":"使用生成對抗網路 (Generative Adversarial Network, GAN) 直接預測異常標籤"},"answer":"C","explanation":"在缺乏異常標註的情況下，可用 VAE 學習正常資料的分佈，透過重建誤差偵測偏離正常型態的異常狀態。A、B 需要標註資料進行監督式分類；D 的敘述不符 GAN 的用途。"},{"n":23,"q":"在 AI 推論服務架構設計中，「批次推論 (Batch Inference)」與「即時推論 (Real-time Inference)」常依任務特性選擇不同機制。下列關於兩者特性的敘述何者最正確？","options":{"A":"批次推論通常以同步請求方式回傳結果，以確保資料一致性；即時推論則多採非同步機制以提升系統吞吐量 (Throughput)","B":"批次推論多用於延遲容忍度較高的大規模資料處理，通常以吞吐量 (Throughput) 最佳化為優先；即時推論則著重於請求回應時間的穩定性與低延遲特性","C":"批次推論因計算資源需求高，僅適用於影像類模型；即時推論則主要應用於結構化資料模型","D":"即時推論為確保回應速度，通常限制為單筆資料輸入；批次推論則可支援同步多筆資料即時回傳"},"answer":"B","explanation":"批次推論適合可容忍延遲的大量資料處理，以吞吐量最佳化為主；即時推論著重低延遲與回應穩定性。B 正確描述兩者特性。A、C、D 對應關係與適用範圍均有誤。"},{"n":24,"q":"某企業導入大型語言模型作為客服助理。模型已具備穩定語言能力，但在回覆偏好一致性與組織規範遵循方面仍需優化，團隊因此規劃導入基於人類回饋的強化學習 (RLHF) 流程。下列何者最不屬於 RLHF 階段的典型技術活動？","options":{"A":"透過人工評估方式建立偏好資料，使模型的不同候選輸出可反映人類主觀品質差異","B":"訓練一個能依據人類偏好判斷輸出品質的模型，作為模型優化過程中的回饋依據","C":"依據品質評估結果，調整模型生成策略，使其輸出更符合偏好導向的行為表現","D":"以未標註語料為主進行長週期表示學習訓練，以提升模型基礎語言建模能力"},"answer":"D","explanation":"RLHF 典型流程包含建立人類偏好資料（A）、訓練獎勵模型（B）與以強化學習調整生成策略（C）。D 描述的是以大量未標註語料進行的預訓練 (Pre-training)，並非 RLHF 階段的活動。"},{"n":25,"q":"在大型語言模型 (LLM) 的推論服務中，常透過請求批次處理 (Batching) 來提升系統效能。關於批次處理 (Batching) 機制的影響，下列敘述何者最正確？","options":{"A":"Batching 可提升加速器資源使用效率並增加整體吞吐量 (Throughput)，但在部分情境下可能對單筆請求延遲造成影響","B":"Batching 主要用於加快單筆請求回應時間","C":"Batching 的效益主要來自降低記憶體使用量，對於吞吐量 (Throughput) 與延遲表現影響有限","D":"Batching 在低併發 (Concurrency) 請求下，仍能明顯提升系統效能"},"answer":"A","explanation":"批次處理可提高 GPU 等加速器的利用率並增加整體吞吐量，但單筆請求可能因等待組批而增加延遲。B、C 對效益描述錯誤；D 錯誤，低併發下難以組成大批次而效益有限。"},{"n":26,"q":"在可解釋 AI (Explainable AI, XAI) 的分類架構中，LIME (Local Interpretable Model-agnostic Explanations) 屬於哪一類解釋技術？","options":{"A":"內建可解釋模型 (Intrinsic Interpretability)：模型本身具有透明的決策結構","B":"對話式解釋系統 (Conversational AI Explainer)：透過互動對話提供模型解釋","C":"後處理模型解釋 (post-hoc)：對已訓練模型提供外部解釋","D":"代理模型技術 (Surrogate Model)：訓練另一個簡單模型來完全取代原黑盒模型進行推論"},"answer":"C","explanation":"LIME 是在模型訓練完成後，對個別預測進行局部近似解釋，屬於後處理 (post-hoc)、模型無關的解釋技術。A 為內建可解釋模型；D 錯在代理模型是用於解釋而非取代原模型進行推論。"},{"n":27,"q":"SHAP (SHapley Additive exPlanations) 值常用於分析機器學習模型的輸出行為。下列何者最符合 SHAP 值所提供的資訊？","options":{"A":"模型在訓練過程中，各特徵對損失函數收斂速度的影響程度","B":"依據特徵對模型整體準確率的影響，自動篩除低重要性變數","C":"在單一預測結果中，各輸入特徵對最終輸出所產生的貢獻分配","D":"透過調整特徵權重，使模型在推論階段降低計算複雜度"},"answer":"C","explanation":"SHAP 值基於博弈論的 Shapley 值，量化在單一預測中各特徵對輸出的貢獻分配。A 為收斂速度、B 為特徵選擇、D 為運算優化，皆非 SHAP 的用途。"},{"n":28,"q":"在金融業導入 AI 模型與可解釋性技術時，反事實解釋 (Counterfactual Explanation) 最符合下列哪一種應用？","options":{"A":"分析整體客戶群的信用風險分布，以預測未來違約率趨勢","B":"回溯歷史呆帳案例，辨識造成違約的主要影響因素","C":"分析在模型不變的前提下，客戶申請資料變動對授信決策結果的影響","D":"依據客戶輪廓與行為資料，推薦最適合的金融商品以提升交叉銷售"},"answer":"C","explanation":"反事實解釋回答「若輸入特徵如何改變，預測結果將隨之改變」，即在模型不變下探討輸入變動對決策的影響，正是 C。A、B、D 分別為風險預測、歸因分析與推薦，非反事實解釋。"},{"n":29,"q":"在深度學習模型的分析與驗證過程中，研究人員有時會利用「顯著性圖 (Saliency Map)」來輔助理解模型行為。下列何者最符合此技術的主要用途？","options":{"A":"量化各輸入特徵對模型整體預測準確度的平均影響程度","B":"標示輸入資料中對單一預測結果影響較大的區域或部分","C":"評估在不同模型參數設定下，預測結果的穩定性變化","D":"比較不同模型架構在測試資料上的泛化能力差異"},"answer":"B","explanation":"顯著性圖透過梯度等方式標示出輸入（如影像像素）中對某一次預測影響最大的區域，屬局部解釋。A 為全域特徵重要度、C 為穩定性評估、D 為模型比較，皆非其主要用途。"},{"n":30,"q":"某商業銀行想建立洗錢行為檢測系統，擁有過去 5 年的交易記錄，其中包含已確認的洗錢案例（標記為「異常」）和正常交易（標記為「正常」）。銀行希望系統能自動識別新交易是否為洗錢行為，請問使用下列哪一種機器學習方法最為適合？","options":{"A":"監督式學習的分類問題","B":"非監督式學習的分群問題","C":"強化式學習","D":"非監督式學習的關聯規則挖掘"},"answer":"A","explanation":"資料已具備「異常」與「正常」標籤，且目標為判斷新交易的類別，屬於典型的監督式學習分類問題。B、D 為非監督式方法（無需標籤），C 強化式學習則不適合此類靜態分類任務。"},{"n":31,"q":"某農場收集了大量作物葉片影像，但只有 30% 的影像有病害類別標註，其餘 70% 的影像沒有任何標籤。農場希望充分利用所有資料來訓練病害識別模型。這種情況最適合使用哪一種學習方法？","options":{"A":"半監督式學習 (Semi-supervised Learning)","B":"監督式學習 (Supervised Learning)","C":"非監督式學習 (Unsupervised Learning)","D":"強化式學習 (Reinforcement Learning)"},"answer":"A","explanation":"資料中同時存在少量標註與大量未標註樣本，半監督式學習正是結合兩者以充分利用全部資料的作法。B 僅用標註資料、C 完全不用標籤、D 為互動式決策，皆不符情境。"},{"n":32,"q":"某環保局想建立 AI 系統監測空氣品質，透過分析監測站攝影機拍攝的影像來識別煙霧。系統需要在影像中找出煙霧區域並精確標示其位置和範圍。這個應用主要屬於電腦視覺的哪個技術領域？","options":{"A":"影像分類，判斷影像中是否有煙霧","B":"物件偵測，找出煙霧位置並用方框標示","C":"影像分割，精確標示出煙霧的像素區域","D":"人臉辨識，識別煙霧來源"},"answer":"C","explanation":"煙霧形狀不規則且邊界模糊，要精確標示其區域與範圍需以像素層級的影像分割 (Segmentation) 處理。影像分類只判斷有無；物件偵測僅給出粗略方框；人臉辨識與情境無關。"},{"n":33,"q":"某公車系統想預測各站點的到站時間，需要考慮歷史班次資料、即時路況、天氣等因素。由於路況變化複雜，傳統循環神經網路 (Recurrent Neural Network, RNN) 在建模時可能難以保留較早期的重要資訊。下列哪種架構最能解決這個問題？","options":{"A":"卷積神經網路 (Convolutional Neural Network, CNN)，利用卷積層捕捉局部特徵","B":"自編碼器 (Autoencoder, AE)，先進行資料壓縮再重建","C":"全連接神經網路 (Fully Connected Neural Network, FCNN)，增加隱藏層數量","D":"長短期記憶網路 (Long Short-Term Memory, LSTM)，改善 RNN 的長期記憶問題"},"answer":"D","explanation":"LSTM 透過門控機制緩解 RNN 的梯度消失問題，能有效保留長期依賴的重要資訊，最適合處理此類序列建模。CNN 擅長空間局部特徵、AE 用於壓縮重建、FCNN 無序列記憶能力。"},{"n":34,"q":"某保險公司每月處理約 50 萬筆理賠申請，希望建立 AI 系統自動識別可疑的詐欺案件。由於公司內部缺乏 AI 專業人員，且需要快速上線驗證效果，IT 資訊主管正在評估不同的 AI 平台解決方案。在去識別化個人隱私資料後，下列哪一種平台類型最適合該公司的需求？","options":{"A":"從零開始建立深度學習框架並自行訓練模型","B":"採用開源機器學習框架進行客製化模型開發","C":"使用雲端 AutoML 平台進行自動化模型訓練","D":"購買現成的詐欺偵測軟體套件直接部署"},"answer":"C","explanation":"在缺乏 AI 專業人員且需快速上線的情況下，雲端 AutoML 平台可自動化完成特徵工程與模型訓練，最符合需求。A、B 需高度專業與時間；D 現成套件難以貼合公司自有資料與情境。"},{"n":35,"q":"某市政府規劃釋出市民用電資料供學術研究使用，資料內容包含用電紀錄與部分人口統計欄位。考量資料可能涉及可識別個人之資訊，且須符合個人資料保護相關規範，下列哪一種資料處理方式最為適當？","options":{"A":"提供完整資料集並透過合約約定研究用途與保密責任","B":"僅保留用電數值資料，移除所有其他欄位以避免識別風險","C":"對具識別風險的資料欄位進行轉換處理，並移除直接識別資訊","D":"僅將資料加密後提供，確保資料在傳輸過程中的安全性"},"answer":"C","explanation":"去識別化應對具識別風險的欄位進行轉換（如遮罩、泛化）並移除直接識別資訊，兼顧隱私保護與研究價值。A 未去識別化風險高；B 過度刪除損失分析價值；D 加密僅保護傳輸而非去識別。"},{"n":36,"q":"某電子製造公司建置 AI 視覺檢測系統，用於辨識 PCB 電路板製程缺陷。系統在影像判讀任務上表現穩定，但其模型設計與訓練目標皆侷限於特定應用範圍，無法直接遷移至其他營運決策任務。依人工智慧能力範疇分類，下列何者最符合該系統特性？","options":{"A":"弱 AI (Weak AI / Narrow AI)","B":"強 AI (Strong AI)","C":"通用人工智慧 (Artificial General Intelligence, AGI)","D":"超級人工智慧 (Artificial Superintelligence, ASI)"},"answer":"A","explanation":"系統僅專注於特定任務（PCB 缺陷檢測）且無法遷移至其他任務，屬弱 AI／窄 AI。強 AI、AGI 具備跨領域通用能力；ASI 更超越人類智慧，均與此系統不符。"},{"n":37,"q":"某紡織製造公司導入 AI 系統進行布料瑕疵檢測，每天需處理來自 30 條產線的影像資料，包括高解析度照片、感測器數值、生產參數記錄等多種格式。該公司收集的資料量從每日 2GB 增長至 50GB，且需在布料離開產線前的 3 秒內完成瑕疵判定。近期團隊發現系統在尖峰時段容易出現判定延遲，影響製程節奏。若要優先改善此問題，下列哪一種做法最適合？","options":{"A":"擴充資料儲存容量，以因應長期資料累積需求","B":"強化即時資料處理與推論計算資源配置，以降低延遲風險","C":"調整資料格式標準，以降低跨來源整合複雜度","D":"增加資料驗證與清理機制，以提升資料品質穩定性"},"answer":"B","explanation":"問題核心是尖峰時段的判定延遲（需在 3 秒內完成），應優先強化即時處理與推論運算資源以降低延遲。A 針對儲存、C 針對整合、D 針對品質，皆非直接解決延遲的關鍵。"},{"n":38,"q":"某果園管理公司計畫導入 AI 系統協助農民判斷水果成熟度，透過分析果實特徵資訊，評估成熟狀態並自動判斷採收時機。根據 AI 應用領域的分類，這個系統主要屬於哪一個應用領域？","options":{"A":"自然語言處理 (Natural Language Processing)","B":"電腦視覺 (Computer Vision)","C":"語音識別 (Speech Recognition)","D":"推薦系統 (Recommendation System)"},"answer":"B","explanation":"透過分析果實影像特徵（如色澤、外觀）判斷成熟度，屬於電腦視覺應用。NLP 處理文字、語音識別處理聲音、推薦系統做個人化推薦，皆與此影像分析任務不符。"},{"n":39,"q":"某企業評估於不同業務場景導入機器學習技術。下列哪一項應用情境與機器學習類型的搭配最為適當？","options":{"A":"在醫療影像分析中，同時運用少量已標註資料與大量未標註影像進行模型訓練—監督式學習 (Supervised Learning)","B":"在智慧推薦系統中，利用顧客是否點擊的歷史標籤資料預測未來偏好—非監督式學習 (Unsupervised Learning)","C":"在詐欺交易分析中，模型透過錯誤判斷所產生的損失作為回饋訊號，持續調整策略—監督式學習 (Supervised Learning)","D":"在股價資料分析中，將歷史價格變動模式劃分為若干趨勢型態，且未使用人工標註—非監督式學習 (Unsupervised Learning)"},"answer":"D","explanation":"D 將未標註的歷史價格劃分為趨勢型態，屬非監督式分群，搭配正確。A 同時用標註與未標註應為半監督式；B 有點擊標籤應為監督式；C 以回饋訊號調整策略應為強化式學習，皆搭配錯誤。"},{"n":40,"q":"某製造業公司建置機器學習模型，用於預測產品是否為瑕疵品。實際生產資料中，瑕疵品比例極低，大多數樣本皆為正常品。模型測試時發現，即使模型多數預測為正常品，仍可獲得很高的整體準確率。在此情境下，若希望更有效衡量模型對瑕疵品的辨識能力，下列何者較適合作為主要評估指標？","options":{"A":"F1-score","B":"均方根誤差 (Root Mean Squared Error, RMSE)","C":"準確率 (Accuracy)","D":"判定係數 (R², Coefficient of Determination)"},"answer":"A","explanation":"在類別極度不平衡下，準確率會被多數類別掩蓋而失真；F1-score 綜合精準率與召回率，能更有效衡量對少數類（瑕疵品）的辨識能力。RMSE 與 R² 為迴歸指標，不適用於分類。"},{"n":41,"q":"在大型語言模型 (LLM) 的效能優化中，Flash Attention 常被用來改善 Transformer 注意力機制的運算效率。關於 Flash Attention 的主要效益，下列敘述何者最正確？","options":{"A":"透過忽略影響較小的注意力權重，減少模型需要計算的關聯數量，以降低運算成本","B":"透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速度與資源使用效率","C":"透過增加注意力計算的並行程度，使模型可同時處理更多注意力頭部","D":"透過將注意力結果暫存於高速快取記憶體，以避免重複計算造成延遲"},"answer":"B","explanation":"Flash Attention 以分塊 (tiling) 與 IO 感知的計算方式，避免將龐大的注意力矩陣完整寫入記憶體，減少中間結果的儲存與存取，進而提升速度與記憶體效率。A 為稀疏注意力概念；C、D 描述並非其核心機制。"},{"n":42,"q":"某企業建置基於檢索增強生成 (RAG) 的法遵知識輔助系統，用於整合法規條文、內控制度與歷史解釋文件。系統運行後發現，每當法規更新或新增解釋文件時，需重新建立完整索引，導致更新期間系統暫停服務，且部分回應偶有引用舊版內容的情形。若希望在兼顧查詢效率的同時提升知識更新彈性與系統穩定性，下列何者最適合？","options":{"A":"提升模型推論資源配置，以維持高流量查詢時的回應效能","B":"調整語言模型的輸出限制機制，以降低生成內容與法規不一致的風險","C":"建立固定法規問答對照表，以規則化方式優先回應常見問題","D":"導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果"},"answer":"D","explanation":"問題根源在於每次更新須重建整個索引造成停機與引用舊內容，導入支援增量更新 (incremental update) 的索引管理即可讓異動文件即時生效並維持服務穩定。A、B、C 未解決索引更新彈性問題。"},{"n":43,"q":"關於機器學習不同的學習模式，下列敘述何者錯誤？\n1. 監督式學習 (Supervised Learning) 透過已標註資料學習輸入與目標之間的對應關係，常見任務包含分類與數值預測。\n2. 非監督式學習 (Unsupervised Learning) 雖不需標註資料，但通常需預先定義每筆資料的正確輸出類別以利模型收斂。\n3. 半監督式學習 (Semi-supervised Learning) 在訓練過程中僅利用未標註資料進行特徵學習，並不涉及標註資料。\n4. 自監督式學習 (Self-supervised Learning) 的訓練方式與監督式學習相同，皆需人工逐筆提供標註資料。\n5. 強化式學習 (Reinforcement Learning) 透過與環境互動並依據回饋訊號調整策略，以優化決策行為。\n6. 自監督式學習 (Self-supervised Learning) 通常利用資料本身產生訓練目標，以降低對人工標註資料的依賴。","options":{"A":"2、3、6","B":"2、4、5","C":"1、3、6","D":"2、3、4"},"answer":"D","explanation":"敘述 2（非監督式不需預先定義正確輸出類別）、3（半監督式同時利用標註與未標註資料）、4（自監督式利用資料自身生成標籤，不需人工逐筆標註）皆錯誤。1、5、6 正確，故錯誤者為 2、3、4，選 D。"},{"n":44,"q":"某零售業者建立顧客行為預測模型，資料集中包含「年消費金額」、「平均單筆交易金額」及「會員年資」等數值型特徵。資料分析顯示，部分金額特徵呈現高度偏態分布，少數樣本的數值顯著高於多數觀測值。為降低極端值對模型學習穩定性的影響，下列哪一種特徵工程方法最適合？","options":{"A":"對數轉換 (Log Transformation)","B":"區間化 (Binning)","C":"One-hot 編碼 (One-hot Encoding)","D":"隨機重抽樣 (Random Resampling)"},"answer":"A","explanation":"對數轉換能壓縮高度右偏（正偏態）分布的數值範圍，降低極端值的影響並使分布趨近常態，最適合此情境。區間化會損失連續資訊、One-hot 用於類別特徵、隨機重抽樣用於樣本平衡。"},{"n":45,"q":"某團隊訓練深層神經網路模型時，發現訓練誤差長時間幾乎未下降，模型參數更新幅度極小，呈現學習停滯現象。若研判問題與梯度傳遞效率有關，下列何者最適合的改善策略？","options":{"A":"延長模型訓練時間，使模型有更多機會調整參數","B":"增加訓練樣本數量，以提升模型學習能力","C":"調整模型中的啟動函數設定，以改善訓練過程的穩定性","D":"簡化模型結構，以降低模型過度擬合的可能性"},"answer":"C","explanation":"訓練停滯且參數更新極小，是典型的梯度消失問題；調整激活函數（如改用 ReLU 類）可改善梯度傳遞。A、B 無法解決梯度傳遞問題；D 針對過擬合而非此處的學習停滯。"},{"n":46,"q":"某市政府建置城市治理資料平台，需整合交通車流偵測資料、路口監視器影像，以及民眾透過陳情系統提交的文字通報。由於各類資料格式、儲存方式與資料型態差異甚大，導致資料清理與整合成本顯著增加。就大數據特性而言，此專案最主要面臨下列哪一項挑戰？","options":{"A":"Volume","B":"Velocity","C":"Variety","D":"Veracity"},"answer":"C","explanation":"數值、影像、文字等多種格式與型態並存，正是大數據的多樣性 (Variety) 挑戰。Volume 指資料量、Velocity 指產生速度、Veracity 指真實性，皆非本題的核心困難。"},{"n":47,"q":"某企業規劃導入 AI 技術支援多項資料分析任務，下列何種屬於結構化預測 (Structured Prediction) 問題？","options":{"A":"判斷一封電子郵件是否為垃圾郵件","B":"預測未來一週的產品需求量","C":"預測客戶是否可能流失","D":"為語音內容轉換後的文字進行逐詞標註"},"answer":"D","explanation":"逐詞標註（序列標註）的輸出是彼此相依、具結構的序列，屬結構化預測。A、C 為二元分類、B 為迴歸，輸出皆為單一純量，非結構化預測。"},{"n":48,"q":"某物流公司想導入 AI 以提升營運效率，評估不同資料型態與模型架構。下列哪一種應用情境最適合採用卷積神經網路 (Convolutional Neural Network, CNN) 作為主要模型架構？","options":{"A":"依據包裹每日掃描紀錄的時間序列，預測下週各倉庫的進貨量波動","B":"根據客服對話逐句內容的先後順序，判斷客訴是否可能升級為申訴案件","C":"根據倉庫監視器影像，自動辨識貨架是否缺貨並標示缺貨區域位置","D":"依據車隊 GPS 路徑點的連續軌跡，預測下一段可能行駛路線"},"answer":"C","explanation":"CNN 擅長處理影像的空間特徵，最適合倉庫監視器影像的缺貨辨識與區域定位。A、D 為時間序列、B 為文字序列，較適合 RNN/LSTM 或 Transformer 等序列模型。"},{"n":49,"q":"某 AI 科技公司在工業缺陷檢測領域已有成熟的辨識產品經驗。現欲與新客戶合作開發一項類似產品的表面瑕疵檢測系統，但因新產品量產不久，標註樣本極為稀少且專家標註成本高昂。在不大幅增加標註預算的前提下，下列哪一種做法最能利用該公司既有的技術優勢來提升模型表現？","options":{"A":"增加模型參數規模，使模型具備更強表達能力","B":"透過資料增強 (Data Augmentation) 擴展影像變化，以提升模型穩定性","C":"重新蒐集大量影像並進行完整人工標註","D":"採用遷移學習 (Transfer Learning)，利用既有預訓練模型進行調整"},"answer":"D","explanation":"在標註樣本稀少但已有相似領域成熟模型的情況下，遷移學習可將既有預訓練模型的知識遷移至新任務並微調，最能發揮公司既有技術優勢。A 易過擬合、C 違反不增加標註預算的前提、B 效益有限。"},{"n":50,"q":"某醫院使用機器學習模型篩檢癌症患者。模型預測結果會決定哪些病人需要進一步檢查。院方非常重視盡量找出所有可能的癌症患者，即希望降低漏診 (Missed Diagnosis) 風險，即便這可能增加一些誤判。下列哪一個評估指標最能反映模型找出癌症患者的能力？","options":{"A":"精準率 (Precision)","B":"召回率 (Recall)","C":"假陽性率 (False Positive Rate)","D":"ROC-AUC 曲線"},"answer":"B","explanation":"降低漏診即要盡量減少偽陰性、找出所有真正的癌症患者，正是召回率 (Recall) 所衡量的能力。精準率關注預測為陽性中的正確比例、假陽性率關注誤報、ROC-AUC 為綜合指標，皆非最直接反映漏診的指標。"}]},{"id":"s1-114","subject":"第一科：人工智慧基礎概論","exam":"114年","questions":[{"n":1,"q":"在人工智慧系統的決策流程中，下列哪一種情境最符合「人在迴圈上（Human-over-the-loop）」所強調的監督機制？","options":{"A":"AI 系統只能提供建議，人類需主動下達命令才能進行決策","B":"人類對 AI 的運行進行日常監督，必要時可立即介入修正或干預","C":"人類平時不參與 AI 的運作，僅在發生異常或重大錯誤時才接手控制","D":"AI 的所有判斷與行動在執行前，皆須經過人類逐一審核與批准"},"answer":"B","explanation":"「人在迴圈上」指人類位於系統之上進行持續監督，平時不逐一介入但保有隨時修正或干預的能力，故 B 正確。A、D 屬人在迴圈內（Human-in-the-loop）需逐項參與；C 為僅事後接手，屬人在迴圈外（Human-out-of-the-loop）。"},{"n":2,"q":"下列哪一種特徵工程技巧，最適合將「星期幾」和「24 小時制時間」這兩個欄位結合，以預測通勤時間？","options":{"A":"獨熱編碼（One-hot encoding）","B":"正規化（Normalization）","C":"特徵交叉（Feature Cross）","D":"寬深模型（Wide and Deep）"},"answer":"C","explanation":"特徵交叉可將兩個類別型特徵組合成新特徵，捕捉「星期幾×時段」的交互作用（例如週一早上尖峰），最適合此需求。One-hot 只是編碼單一欄位；正規化用於數值縮放；Wide and Deep 是模型架構而非特徵工程技巧。"},{"n":3,"q":"關於 ETL（Extract-Transform-Load），下列敘述何者為正確？","options":{"A":"E 表示將資料直接儲存至目標儲存庫","B":"ETL 的處理順序可以自由調整為 TEL","C":"L 表示將目標儲存庫經過反加密處理載入資料","D":"T 包括資料的清理與排序"},"answer":"D","explanation":"Transform（轉換）階段包含資料清理、排序、格式轉換等處理，故 D 正確。E 為抽取而非儲存；ETL 順序不可任意改為 TEL；L 為載入而非反加密。"},{"n":4,"q":"關於資料正則化（Regularization）L1、L2 方法，下列敘述何者正確？","options":{"A":"L1 權重個數愈多，愈可以提升模型的正確率","B":"L2 稱為 Lasso 正則化","C":"L1 運用減少權重的絕對值來控制模型的複雜度","D":"L2 比 L1 正則化方法更會將特徵權重趨近於零"},"answer":"C","explanation":"L1 正則化以權重絕對值之和作為懲罰項來控制模型複雜度，故 C 正確。L1 才稱為 Lasso（B 錯）；L1 而非 L2 傾向產生稀疏解使權重為零（D 錯）；權重個數多不必然提升正確率（A 錯）。"},{"n":5,"q":"在機器學習中，偏差與變異權衡（Bias-Variance Tradeoff）主要用來解決下列哪一類型的問題？","options":{"A":"因資料來源或收集方式限制，導致模型學習到的資訊不足","B":"測試資料樣本與訓練資料高度重複，造成模型泛化能力評估失準","C":"訓練資料中類別分布不均，使模型在少數類別上表現不佳","D":"如何在模型偏差與變異之間取得平衡，以避免過度擬合或欠擬合"},"answer":"D","explanation":"偏差-變異權衡探討高偏差（欠擬合）與高變異（過擬合）之間的取捨，D 正確。A 屬資料偏誤問題、B 屬資料洩漏、C 屬類別不平衡，均非此權衡所處理的核心議題。"},{"n":6,"q":"Lasso 模型中，L1 正則化（Regularization）導致參數收斂為零的原因為何？","options":{"A":"L1 正則化忽略目標變數","B":"L1 對梯度有平滑作用","C":"L1 對權重的懲罰不隨大小遞減，促使產生稀疏解","D":"L1 會轉換損失函數為非凸形"},"answer":"C","explanation":"L1 懲罰項的次梯度為常數（不隨權重大小衰減），會將不重要的權重直接壓為零而產生稀疏解，故 C 正確。L1 仍為凸函數（D 錯）；平滑作用是 L2 特性（B 錯）；正則化不會忽略目標變數（A 錯）。"},{"n":7,"q":"貝氏分類器（Naive Bayes Classifier）常被應用於文字分類、垃圾郵件過濾等場景。依據模型特性，它最適合歸類於下列哪一類？","options":{"A":"透過直接學習輸入特徵與目標標籤之間的邊界或關係來進行分類的模型","B":"透過建構資料的整體分布，並利用條件關係進行推斷和分類的模型","C":"側重探索資料中樣本間的相似性，將資料自動分成不同群組的模型","D":"透過試錯學習，根據行動結果的獎勵或懲罰來優化決策策略的模型"},"answer":"B","explanation":"貝氏分類器屬生成式模型，建構資料的聯合/條件機率分布並依貝氏定理推斷類別，故 B 正確。A 為鑑別式模型、C 為分群（非監督）、D 為強化學習。"},{"n":8,"q":"為提升生成式 AI 系統回應的語境一致性，常會結合哪類模型技術？","options":{"A":"決策樹分類器（Decision Tree Classifier）","B":"條件語言模型（Conditional Language Model）","C":"強化學習 Q-learning 方法","D":"基因演算法（Genetic Algorithm）"},"answer":"B","explanation":"條件語言模型可依據給定的上下文（條件）生成後續文字，維持回應與語境的一致性，故 B 正確。決策樹、Q-learning、基因演算法皆非用於生成語境連貫文字的核心技術。"},{"n":9,"q":"根據 2025 年 9 月行政院通過之《人工智慧基本法》草案，政府推動人工智慧之「創新實驗環境」制度，主要參考歐盟的何種制度？","options":{"A":"Data Protection Impact Assessment","B":"Regulatory Sandbox","C":"AI Trust Label","D":"AI Ethics Review Board"},"answer":"B","explanation":"「創新實驗環境」對應歐盟 AI Act 的監理沙盒（Regulatory Sandbox），提供受監督的實驗空間，故 B 正確。其餘為資料保護影響評估、信任標章、倫理審查委員會，皆非創新實驗環境制度。"},{"n":10,"q":"根據《金融機構運用人工智慧技術作業規範》，金融機構須建立內部治理架構，並指定專責單位或人員負責推動及管理人工智慧事務，下列何者並非規範所明訂須落實的治理措施？","options":{"A":"辦理人工智慧人才培育","B":"清楚了解生成式 AI 技術之運作模式","C":"每日公布人工智慧系統運作狀況","D":"指派高階主管或委員會進行監督管理"},"answer":"C","explanation":"規範要求人才培育、了解技術運作、指派高階監督等治理措施，但並未要求「每日公布」系統運作狀況，故 C 為非規定事項。"},{"n":11,"q":"下列哪一類問題最適合使用非監督式學習（Unsupervised Learning）來處理？","options":{"A":"根據已標記的醫療影像訓練模型診斷疾病","B":"根據使用者行為將用戶分群，以優化行銷策略","C":"透過已知交通事故記錄預測未來事故發生機率","D":"根據歷史股價預測未來股市的走勢"},"answer":"B","explanation":"使用者分群不需標籤，屬非監督式的分群（Clustering）任務，故 B 正確。A、C、D 皆有明確標籤或目標值，屬監督式學習。"},{"n":12,"q":"下列哪一種圖表最適合用來呈現並分析「兩個數值型變數」之間的關係，例如觀察身高與體重的相關性？","options":{"A":"散佈圖（Scatter Plot）","B":"折線圖（Line Chart）","C":"直方圖（Histogram）","D":"長條圖（Bar Chart）"},"answer":"A","explanation":"散佈圖以座標點呈現兩個數值變數的關係，最適合觀察相關性，故 A 正確。折線圖用於趨勢、直方圖看單一變數分布、長條圖比較類別。"},{"n":13,"q":"下列哪一項應用情境與機器學習類型搭配正確？","options":{"A":"醫療影像中僅少部分有專家標註、其餘未標註，結合已標註與未標註資料建立模型 — 監督式學習（Supervised Learning）","B":"自駕車模擬環境中，模型透過試誤獲得「是否安全通過路口」的獎勵或懲罰訊號逐步調整策略 — 非監督式學習（Unsupervised Learning）","C":"根據已標註的顧客歷史資料，預測新顧客未來是否會流失 — 強化學習（Reinforcement Learning）","D":"根據顧客特徵將其自動分成不同群組，無需使用任何標籤 — 非監督式學習（Unsupervised Learning）"},"answer":"D","explanation":"無標籤的自動分群屬非監督式學習，搭配正確，故 D 正確。A 應為半監督式、B 為強化學習、C 為監督式學習，皆搭配錯誤。"},{"n":14,"q":"某企業分析團隊正在處理一組近兩年的營運與銷售數據，共有四個部門提出各自的分析需求，請判斷哪一個最接近「預測性分析（Predictive Analysis）」的特性？","options":{"A":"視覺化所有產品線過去月銷售走勢與標準差，觀察其分佈情況與波動程度","B":"藉由資料比對分析，找出去年母親節促銷失效的地區與品類組合","C":"建構模型推算下一季的主力商品銷量，以規劃備貨與倉儲資源配置","D":"透過熱圖分析廣告投放成本與訂單轉換率之間的潛在關聯性"},"answer":"C","explanation":"預測性分析著重以模型推算「未來」數值，C 建構模型預測下一季銷量正符合。A 為描述性分析、B 為診斷性分析、D 為探索關聯的描述性分析。"},{"n":15,"q":"某模型使用 K-近鄰演算法（KNN）進行分類，K 設為 3。一筆新的測試資料輸入後，與其最接近的 3 筆資料的類別如下：鄰近樣本1 為類別 A、鄰近樣本2 為類別 B、鄰近樣本3 為類別 A。請問模型會將這筆資料預測為哪一類別？","options":{"A":"類別 A","B":"類別 B","C":"類別 A 與 B 各一半，無法分類","D":"類別 A 或 B，視距離遠近加權而定"},"answer":"A","explanation":"標準 KNN 採多數決，3 個鄰近樣本中類別 A 佔 2 票、類別 B 佔 1 票，故預測為類別 A。除非特別指定加權投票，否則以多數決為準。"},{"n":16,"q":"某團隊想採用循環神經網路（Recurrent Neural Network, RNN）建構長期氣候數據的預測模型，以下哪一項敘述最符合使用 RNN 可能遇到的挑戰？","options":{"A":"RNN 無法處理可變長度的序列輸入，因此在實務上限制極大","B":"RNN 在長序列訓練中可能出現梯度消失，影響模型效果","C":"RNN 無法捕捉時間上的依賴關係，因此預測準確度低","D":"RNN 只能用於分類任務，不能應用於時間序列預測"},"answer":"B","explanation":"RNN 在長序列反向傳播時易發生梯度消失（或爆炸），難以學習長期依賴，是其主要挑戰，故 B 正確。RNN 本可處理可變長度序列、能捕捉時間依賴、亦可用於序列預測，故 A、C、D 皆錯。"},{"n":17,"q":"一間金融科技公司設計一款智慧投資系統，該系統會根據市場變化自動決定「買進」、「持有」或「賣出」的行動，並根據每次交易後的盈虧逐步優化下一次的投資策略。整個過程中，系統不依賴事先標記的資料，而是根據歷次行動獲得的獎勵進行調整。請問此系統最可能採用哪種學習方法？","options":{"A":"強化式學習（Reinforcement Learning）","B":"監督式學習（Supervised Learning）","C":"非監督式學習（Unsupervised Learning）","D":"遷移學習（Transfer Learning）"},"answer":"A","explanation":"系統以行動所獲得的獎勵（盈虧）為回饋訊號逐步優化決策策略，正是強化學習的特徵，故 A 正確。它不依賴標籤（非監督式）、非以標記資料訓練（監督式），亦非知識遷移。"},{"n":18,"q":"關於 Q-Learning 與 Deep Q-Learning，下列敘述何者最正確？","options":{"A":"Q-Learning 與 Deep Q-Learning 的差異在於是否使用標記資料作為學習基礎","B":"Q-Learning 可處理任意維度的狀態空間，因此比 Deep Q-Learning 更靈活","C":"Deep Q-Learning 透過深度神經網路近似 Q 值，避免了 Q 表在高維空間中難以擴展的問題","D":"Deep Q-Learning 無法搭配經驗回放（Experience Replay），因為會導致樣本順序被打亂"},"answer":"C","explanation":"Deep Q-Learning 以深度神經網路近似 Q 函數，解決 Q 表在高維狀態空間無法擴展的問題，故 C 正確。兩者皆屬強化學習不用標籤（A 錯）；Q 表難處理高維（B 錯）；DQN 正是搭配經驗回放來打散樣本相關性（D 錯）。"},{"n":19,"q":"在訓練機器學習模型時，若任務為預測房價，應選用下列哪一種損失函數（Loss Function）來衡量預測誤差？","options":{"A":"均方誤差（MSE）","B":"交叉熵損失（Cross-Entropy Loss）","C":"Hinge 損失（Hinge Loss）","D":"KL 散度（Kullback-Leibler Divergence）"},"answer":"A","explanation":"預測房價屬迴歸任務，均方誤差衡量連續數值的預測誤差最適合，故 A 正確。交叉熵與 Hinge 損失用於分類，KL 散度衡量機率分布差異。"},{"n":20,"q":"某醫院希望開發一個系統，根據患者的年齡、血壓與 BMI 等資訊，預測罹病風險機率（0~1），並依據預測值是否超過 0.5 做出風險警示。下列哪一種模型最適合用於此分類任務？","options":{"A":"邏輯迴歸（Logistic Regression）","B":"支援向量機（Support Vector Machine）","C":"決策樹（Decision Tree）","D":"K 平均演算法（K-means）"},"answer":"A","explanation":"邏輯迴歸輸出介於 0~1 的機率值，可依門檻（如 0.5）做二元分類，最符合需求，故 A 正確。SVM 與決策樹雖可分類但非直接輸出機率、K-means 為非監督分群。"},{"n":21,"q":"某金融科技公司正開發一套違約風險預測系統，需大量處理不同客戶的財務特徵資料。考量到資料特徵數量眾多，且希望提升預測的穩定性與泛化能力，下列哪一種鑑別式 AI 模型最適合？","options":{"A":"邏輯迴歸（Logistic Regression）","B":"支援向量機（Support Vector Machine）","C":"決策樹（Decision Tree）","D":"隨機森林（Random Forest）"},"answer":"D","explanation":"隨機森林以多棵決策樹集成，能處理高維特徵並透過 Bagging 降低變異、提升穩定性與泛化能力，故 D 最適合。單棵決策樹易過擬合、邏輯迴歸與 SVM 在高維非線性下泛化較弱。"},{"n":22,"q":"關於變分自編碼器（Variational Autoencoder, VAE）的運作流程，下列何者敘述最為正確？","options":{"A":"解碼器的任務是將低維壓縮向量分類為不同類別","B":"編碼器將輸入資料轉換為可視化圖像以利模型學習","C":"編碼器將資料轉換為潛在空間表示，解碼器再重建資料","D":"編碼器利用最大邊際機率對資料進行異常點偵測"},"answer":"C","explanation":"VAE 由編碼器將輸入映射到潛在空間的機率分布，再由解碼器從潛在向量重建資料，故 C 正確。解碼器負責重建而非分類（A 錯）；編碼器產生潛在表示而非可視化圖像（B 錯）；VAE 核心非最大邊際異常偵測（D 錯）。"},{"n":23,"q":"下列何者不是我國數位發展部 AI 產品與系統評測中心對生成式 AI 的評測項目？","options":{"A":"當責性","B":"可靠性","C":"隱私及資安","D":"互動性"},"answer":"D","explanation":"評測中心對生成式 AI 的評測面向包含當責性、可靠性、隱私及資安等，「互動性」並非其評測項目，故 D 為答案。"},{"n":24,"q":"在保持 GPT-OSS 模型架構不變的前提下，如果將模型參數量從 20 億提升至 120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？","options":{"A":"模型參數增加會線性提升效能，且即使訓練資料不變也不會遇到瓶頸","B":"參數越多模型推理越快，因為每層可以並行計算更多參數","C":"較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資料支持","D":"增加參數量不影響記憶體使用，只會影響計算速度"},"answer":"C","explanation":"更多參數提升模型表達能力與效能，但須有足夠訓練資料方能發揮而不過擬合，故 C 正確。效能非線性提升且資料不足會遇瓶頸（A 錯）；參數增加使推理變慢（B 錯）；參數量增加也提高記憶體用量（D 錯）。"},{"n":25,"q":"在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列哪種資料處理策略屬於常見的「資料去偏（Data Debiasing）」做法？","options":{"A":"讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差","B":"增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見","C":"調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避免模型過度偏向出現頻率高的類別","D":"對訓練資料施加額外正則化或雜訊，使模型在學習過程中對偏見敏感度降低"},"answer":"C","explanation":"資料去偏的常見做法是從資料層面調整或擴充語料，平衡不同群體比例，故 C 正確。隨機替換輸出、單純加大模型或加雜訊都無法針對性消除語料中的系統性偏見。"},{"n":26,"q":"在深度學習模型的微調（Fine-tuning）過程中，可能出現所謂的「災難性遺忘（Catastrophic Forgetting）」，此現象最可能造成哪種情況？","options":{"A":"由於計算資源或訓練步驟不足，模型在微調過程中無法完整收斂，導致學習效果受限","B":"微調後模型的表現變得隨機，無法有效記憶新學到的模式與知識","C":"微調後模型的部分權重產生偏移，導致模型無法針對較長的文字進行回應","D":"模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛知識，在原有任務或廣泛領域上表現變差"},"answer":"D","explanation":"災難性遺忘指模型在新任務微調後過度適應新資料，喪失先前預訓練習得的廣泛知識，導致舊任務表現下降，故 D 正確。其餘選項描述的是收斂不足或隨機化，非災難性遺忘定義。"},{"n":27,"q":"在大型 Transformer 模型的效能優化過程中，常見的方法之一是「剪枝（Pruning）」。下列哪一項最符合該方法的核心概念？","options":{"A":"將模型中所有權重按比例縮小，使其值更接近零，以降低計算量","B":"移除模型中影響較小或冗餘的部分權重參數，以減少模型大小並提升推理效率","C":"在訓練時僅更新部分權重而將其他權重凍結，從而減少要調整的參數數量","D":"根據注意力分數動態跳過處理部分輸入 Token，以減少每次前向傳播的計算"},"answer":"B","explanation":"剪枝的核心是移除影響小或冗餘的權重/連結，縮小模型並加速推理，故 B 正確。A 為權重縮放/量化概念、C 為凍結微調（如 LoRA）、D 為動態稀疏注意力，皆非剪枝定義。"},{"n":28,"q":"對非常長的輸入序列進行推理（Inference），Transformer 模型推理的主要計算瓶頸通常是什麼？","options":{"A":"模型輸出層產生文本的過程，因為每生成一個詞都必須重新訓練整個模型一次","B":"詞嵌入（Embedding）查找操作，因為其時間複雜度隨詞彙表大小指數級增長","C":"Softmax 函數的計算，因為對每個 Token 都需要執行繁重的運算","D":"自注意力層的計算和其記憶體使用，因為注意力矩陣的大小隨序列長度呈平方級增長"},"answer":"D","explanation":"自注意力的計算與記憶體需求隨序列長度呈 O(n²) 平方級成長，是長序列推理的主要瓶頸，故 D 正確。生成不需重新訓練、Embedding 為查表 O(1)、Softmax 非主要瓶頸。"},{"n":29,"q":"在「可解釋人工智慧（Explainable AI, XAI）」中，LIME（Local Interpretable Model-agnostic Explanations）方法最核心的應用目的是什麼？","options":{"A":"解釋單一樣本（局部預測）的黑箱模型決策過程","B":"全面提升黑箱模型整體的預測準確度","C":"將黑箱模型轉換成完全可解釋的模型作為替代","D":"用於生成大量擬真數據來替代訓練集"},"answer":"A","explanation":"LIME 於單一樣本鄰域建立局部代理模型，解釋該筆預測的決策依據，故 A 正確。它是局部、模型無關的解釋工具，不提升準確度、不取代整個模型、亦非資料生成方法。"},{"n":30,"q":"在醫療診斷決策支援系統等高風險領域中，「可解釋人工智慧（Explainable AI, XAI）」的核心價值最主要呈現在哪個面向？","options":{"A":"透過提供可理解的決策依據，促進患者與醫療專業人員對系統診斷結果的信任與接受度","B":"以可解釋性方法優化臨床資料蒐集與管理流程，從而降低整體醫療作業成本","C":"利用解釋機制增強模型預測的統計顯著性與準確度，使其在研究及實務應用中更具科學性","D":"透過提供透明化的運作過程，進而減輕臨床人員負擔，並提升醫療設備的運算效能"},"answer":"A","explanation":"在高風險醫療場景中，XAI 的核心價值在於提供可理解的決策依據以建立醫病雙方的信任與接受度，故 A 正確。XAI 不直接降低成本、不提升準確度或顯著性、也不提升硬體運算效能。"},{"n":31,"q":"在金融科技公司的信貸決策系統中，導入反事實解釋（Counterfactual Explanation）時，實際部署往往伴隨技術與監管挑戰。下列哪一項最符合該情境下的核心挑戰？","options":{"A":"需要建立完整的客戶行為預測模型來估算建議改變的實施成本，並整合到現有的風險管理系統架構中","B":"必須使用聯邦學習技術保護客戶隱私，同時在分散式環境中計算跨機構的反事實解釋結果","C":"需要建構時間序列因果圖來處理客戶信用狀況的動態變化，並預測未來可能的信用評分軌跡","D":"生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同時確保建議的改變在現實中具有可操作性且符合公平放貸法規"},"answer":"D","explanation":"反事實解釋須產生「可行動」的建議，須滿足特徵間因果與業務邏輯約束、現實可操作性並符合公平放貸法規，這是信貸部署的核心挑戰，故 D 正確。其餘選項偏離反事實解釋的可操作性與合規本質。"},{"n":32,"q":"在統計推論中，若樣本來自母體但呈現明顯偏態分布，且樣本數有限，下列哪一項策略最能減少推估母體參數的偏誤？","options":{"A":"直接使用樣本平均數與變異數估計母體參數，不做任何調整","B":"增加樣本數並考慮使用分位數或中位數作為中心趨勢估計","C":"將樣本隨機重新排列後，多次計算平均值以消除偏態影響","D":"完全依賴樣本標準差來估計母體參數，忽略分布形態"},"answer":"B","explanation":"偏態分布下平均數易受極端值影響，改用中位數/分位數等穩健統計量並增加樣本數，較能降低估計偏誤，故 B 正確。單純重排樣本不改變分布（C 錯），A、D 未處理偏態問題。"},{"n":33,"q":"在工業物聯網架構中，進行設備預測性維護（Predictive Maintenance）時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料，下列哪一種方法最能兼顧模型穩定性與異常偵測效能？","options":{"A":"將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭配全序列訓練模型（如 LSTM）","B":"對時間序列進行差分與標準化後，使用傳統監督式學習模型（如 SVM）進行分類訓練","C":"使用經過時間序列特化的 SMOTE 技術生成異常樣本，以平衡異常與正常資料比例","D":"採用基於重建誤差的自編碼器模型（Sequence-to-Sequence Autoencoder）進行異常偵測，並僅使用正常資料進行訓練"},"answer":"D","explanation":"在異常樣本極少、高度不平衡下，僅以正常資料訓練 Seq2Seq 自編碼器、依重建誤差偵測異常，可避開對稀有異常樣本的依賴，兼顧穩定性與偵測效能，故 D 最佳。單純複製或合成異常樣本易造成過擬合或分布失真。"},{"n":34,"q":"在零售業進行客戶行為分析時，資料倉儲中發現多個欄位儲存相同的購買金額資訊（例如 amount_usd、total_price、transaction_value），但其單位、命名慣例及格式不一致，進而導致特徵工程階段混淆模型輸入。針對此種跨欄位語義重疊與結構冗餘問題，下列哪一種資料處理策略最合適且具實務可行性？","options":{"A":"利用資料探勘技術自動選擇資料集中對目標變數最敏感的欄位，其他欄位捨棄即可，避免過度清理干擾原始結構","B":"保留所有相似欄位，交由高階模型（如 Gradient Boosting 或 Deep Learning）自動學習特徵關聯，無需手動處理","C":"建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義合併，減少重複資訊影響特徵重要性估計","D":"將重複欄位視為類別欄位，進行獨熱編碼（One-hot encoding）後輸入模型，以避免數值誤導模型學習過程"},"answer":"C","explanation":"面對語義重疊與結構冗餘，建立命名標準、統一單位格式並進行正規化與語義合併，可消除重複資訊、確保特徵一致性，故 C 最合適。直接捨棄、放任模型自學或錯誤地將金額當類別做 One-hot 皆不妥。"},{"n":35,"q":"某大型零售企業準備將商品推薦模型上線，專案團隊在檢視訓練資料時，發現部分商品類別（例如高價商品）樣本數量極少，而多數樣本集中於低價商品。若此不平衡問題未妥善處理，下列何種狀況最可能在實際推薦結果中發生？","options":{"A":"模型在預測時傾向輸出稀有類別，導致雖能捕捉到少數樣本，但精確率（Precision）顯著下降","B":"模型由於類別分布不均，難以建立有效的線性分離邊界，進而無法收斂","C":"模型過度聚焦於稀有類別樣本，導致對多數類別的預測能力下降，整體效能受損","D":"模型學到的決策邊界主要由多數類別主導，忽視了稀有類別，造成該類別的召回率（Recall）大幅降低"},"answer":"D","explanation":"類別不平衡時，模型多被多數類別主導，決策邊界偏向多數類別而忽視稀有類別，使稀有（高價）類別的召回率大幅下降，故 D 正確。不平衡通常使模型偏向多數而非稀有類別，故 A、C 相反。"},{"n":36,"q":"某電商資料團隊要協助行銷部門規劃再行銷策略。目前取得資料包含使用者點擊、購買紀錄、流量來源與轉換率。若資料團隊希望先進行探索性資料分析（EDA），下列哪一項最符合 EDA 的做法？","options":{"A":"建立隨機森林模型，預測使用者是否會完成購買","B":"使用 K-means 對使用者群進行分群並立即制定對應促銷策略","C":"繪製各類流量來源對轉換率的關聯圖，尋找潛在關係","D":"對不同購物路徑設定統計假設並進行雙樣本 t 檢定"},"answer":"C","explanation":"EDA 以視覺化與描述性方式探索資料、尋找潛在關係與模式，繪製流量來源與轉換率的關聯圖正符合，故 C 正確。A 為建模預測、D 為驗證性假設檢定、B 直接制定策略，皆超出 EDA 的探索階段。"},{"n":37,"q":"某金融科技公司在利用歷史交易資料建立風險控管模型時，嘗試推估整體詐騙交易比例。近期發現，樣本間存在明顯的時間序列相關性，導致模型在實際偵測新交易時誤判率升高。若希望同時改善詐騙比例推估的準確性並提升模型的穩健性，下列哪一種做法最為合適？","options":{"A":"擴充樣本數量，以涵蓋更多潛在的詐騙型態，但維持既有的隨機抽樣方式不變","B":"採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層，以保存原始的時間結構特性","C":"將資料完全隨機打散，以降低序列相關性對模型訓練造成的影響","D":"在模型評估時，針對相鄰時間區段進行誤差合併，以便用整體估計方式修正詐騙比例"},"answer":"B","explanation":"資料具時間序列相關性時，應採時間敏感的分層抽樣以保留時間結構，避免隨機抽樣破壞時序關係，故 B 正確。完全打散會抹除時間資訊造成資料洩漏（C 錯）；維持隨機抽樣或事後合併誤差皆未解決時序相關問題。"},{"n":38,"q":"某公司建置基於檢索增強生成（RAG）的知識查詢系統，需同時兼顧查詢效能與資料的即時更新。近期發現回應內容偶爾過時，且每次更新文件都需完整重建索引，導致系統在更新期間無法服務。若要解決此問題並提升整體穩健性，下列哪項做法最適合？","options":{"A":"調整生成模型的回應隨機性參數，以降低答案偏差並提升一致性","B":"提升檢索與索引的運算效能，以縮短查詢與更新所需時間","C":"採用索引的增量或分段更新方式，使新資料能即時納入而不需全部重建","D":"建立常見問題的標準答案集，透過快速檢索回應以降低模型負擔"},"answer":"C","explanation":"問題核心是完整重建索引導致停機與內容過時，採用增量/分段更新可即時納入新資料、避免全量重建與服務中斷，故 C 最適合。調整隨機性或提升運算效能無法根本解決重建停機；標準答案集無法涵蓋動態知識更新。"},{"n":39,"q":"某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院日數集中在 3-7 天，但仍有少數重症患者因治療需求而住院日數明顯偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合此需求？","options":{"A":"在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指標","B":"僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差","C":"將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影響","D":"僅採用單一整體誤差指標（如整體 RMSE）作為模型優劣的唯一判斷依據"},"answer":"A","explanation":"同時檢視整體 MAE 與重症子群的分層誤差，能兼顧多數病人與少數重症個案的預測表現，故 A 正確。排除重症樣本或僅看單一整體指標都會掩蓋重症個案的預測品質；標準化不能解決評估面向的問題。"},{"n":40,"q":"關於監督式學習（Supervised Learning）與非監督式學習（Unsupervised Learning）的目標，下列敘述何者錯誤？(1) 非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與降維，而不依賴外部標籤。(2) 監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測任務。(3) 非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。(4) 監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間的差距，學習輸入與目標之間的對應函數。(5) 所有監督式學習任務都必須要有大量完整標註資料，否則無法進行任何有效的模型訓練。(6) 非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進行模式學習。","options":{"A":"3、5、6","B":"1、4、6","C":"2、4、6","D":"2、3、5"},"answer":"D","explanation":"敘述 2（監督式亦可用於異常偵測）、3（搭配少量標註屬半監督式而非完全轉為監督式）、5（並非皆需大量完整標註，少量資料仍可訓練）均為錯誤，故選 D。敘述 1、4、6 皆正確。"},{"n":41,"q":"一家旅遊平台希望建立模型，預測顧客下次是否會再次透過該平台預訂。已取得的特徵包含：顧客 ID、年齡、旅遊次數、平均花費金額、主要交通方式（火車/飛機/自駕/公車）、會員等級（普通/進階/白金）、是否為海外旅遊等。下列哪一種特徵工程方法最適合處理「主要交通方式」欄位？","options":{"A":"布林轉換（Boolean Conversion）","B":"序數編碼（Ordinal Encoding）","C":"數值標準化（Numerical Standardization）","D":"獨熱編碼（One-hot Encoding）"},"answer":"D","explanation":"「主要交通方式」為無序的名目類別，應以獨熱編碼避免引入不存在的順序關係，故 D 正確。序數編碼會賦予錯誤大小順序（B 不宜）；布林轉換適用二元、標準化用於數值，皆不適合多類別名目變數。"},{"n":42,"q":"一家跨國醫療研究機構希望利用各地醫院的病患資料，建立一個能夠預測疾病早期風險的機器學習模型。由於各國法規限制，病患的原始資料無法集中到單一伺服器。在此情境下，下列哪一種方法最能同時滿足「各醫院保留資料不外流」與「模型仍能跨院學習」的需求？","options":{"A":"資料匿名化（Data Anonymization）","B":"差分隱私（Differential Privacy）","C":"聯邦學習（Federated Learning）","D":"交叉驗證（Cross-validation）"},"answer":"C","explanation":"聯邦學習讓各機構在本地訓練、僅交換模型參數/梯度而不外流原始資料，同時達成跨院協作學習，故 C 正確。匿名化與差分隱私是隱私保護手段但仍需集中或處理資料；交叉驗證僅為模型評估方法。"},{"n":43,"q":"某公司欲建立員工離職風險預測模型，資料集中包含「年度績效分數」、「平均每月加班時數」、「年齡」等數值型特徵。由於各特徵的數值範圍差異極大（例如績效分數 1-5、加班時數 0-80、年齡 20-65），若直接輸入至使用梯度下降的邏輯迴歸（Logistic Regression）模型，可能導致模型收斂緩慢或權重偏斜。為提升模型訓練效率與準確度，下列哪一種特徵工程方法最適合應用於這些數值特徵？","options":{"A":"布林轉換（Boolean Conversion）","B":"時間序列分解（Time Series Decomposition）","C":"獨熱編碼（One-hot Encoding）","D":"數值標準化（Numerical Standardization）"},"answer":"D","explanation":"各數值特徵範圍差異大會使梯度下降收斂緩慢，數值標準化（縮放至相近尺度）可加速收斂並避免權重偏斜，故 D 正確。布林轉換與 One-hot 用於類別、時間序列分解用於時序資料，皆不適用於此。"},{"n":44,"q":"在機器學習中，「叢集（Clustering）」方法最典型的應用情境是下列何者？","options":{"A":"根據歷史交易紀錄與已標註的詐欺案例，訓練模型來偵測未來的詐欺行為","B":"根據已標註的資料建立迴歸模型，以預測連續的數值結果","C":"根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進行差異化行銷","D":"透過大量已標註影像，訓練深度學習模型來辨識照片中的物件種類"},"answer":"C","explanation":"叢集屬非監督式學習，依樣本特徵相似性自動分群，顧客分群做差異化行銷正是典型應用，故 C 正確。A、B、D 皆使用標籤，屬監督式的分類或迴歸任務。"},{"n":45,"q":"某醫院研究團隊蒐集了大量病患的「收縮壓」數據，經檢驗後顯示此數值大致呈現常態分布。在進行後續模型分析前，研究人員希望妥善處理可能存在的極端血壓數值。下列哪一種做法最為合適？","options":{"A":"將所有極端偏高或偏低的血壓數據直接刪除，以保留最具代表性的數值範圍","B":"使用對數轉換（Log Transformation），將數據壓縮至更接近常態，以降低極端值的影響","C":"透過 Z 分數（Z-score）或標準差範圍檢測異常值，並依研究需求決定是否調整或移除","D":"將檢測到的離群值以 Label Encoding 編碼，轉換為序號標籤以避免影響原始分布"},"answer":"C","explanation":"資料已近常態分布，適合用 Z 分數/標準差範圍偵測離群值，再依研究需求判斷保留、調整或移除，做法穩健，故 C 正確。直接刪除易失真（A 錯）；對數轉換適用右偏資料而非已常態（B 錯）；Label Encoding 用於類別非離群值處理（D 錯）。"},{"n":46,"q":"某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提升模型效能。下列哪一種描述最符合監督式特徵選擇（Supervised Feature Selection）的概念？","options":{"A":"根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目標變數","B":"評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵","C":"使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較大的欄位","D":"將特徵透過降維方法（如 PCA）轉換為新特徵，再用於模型訓練"},"answer":"B","explanation":"監督式特徵選擇的核心在於「參考目標變數」，評估各特徵與目標的相關性以挑選最有預測價值者，故 B 最符合此概念。A 未參考目標變數屬非監督式；D 為降維（特徵轉換）而非選擇；C 雖亦利用目標，但屬包裹式/嵌入式做法，B 為對此概念最直接的描述。"},{"n":47,"q":"在訓練神經網路時，為了提升模型收斂速度與穩定性，避免梯度消失或梯度爆炸，下列哪一種做法最常被使用？","options":{"A":"對輸入資料進行隨機旋轉或水平翻轉，以增加資料多樣性","B":"選用 ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播","C":"減少樣本量提升訓練速度","D":"對目標變數或特徵進行標準化"},"answer":"B","explanation":"ReLU 及其變體在正區間梯度為常數，可有效緩解梯度消失、改善梯度傳播，是避免梯度消失/爆炸最常用的做法，故 B 正確。A 為資料增強、C 反而降低泛化、D 有助收斂但非針對梯度消失/爆炸的核心手段。"},{"n":48,"q":"若希望檢視某一連續型數據的分布情形（如集中程度、偏態或是否呈現多峰），下列哪一種應用情境最適合使用直方圖（Histogram）來進行分析？","options":{"A":"探討顧客年齡資料的整體分布特徵，並檢視是否存在異常集中或分散現象","B":"比較不同商品在各月份的銷售額變化趨勢，以觀察季節性波動","C":"追蹤公司近一年營收的時間序列變化，以了解整體成長趨勢","D":"檢視產品價格與月銷售量之間的關聯性，以評估是否具線性相關"},"answer":"A","explanation":"直方圖用於呈現單一連續變數的次數分布（集中、偏態、多峰），顧客年齡分布分析正符合，故 A 正確。B、C 為時間趨勢應用折線圖，D 為兩變數關聯應用散佈圖。"},{"n":49,"q":"下列何者並非我國數位發展部 AI 產品與評測中心在評估大型語言模型安全性時，所指出的常見使用指標？","options":{"A":"資料複雜性","B":"事實正確性","C":"偏見與歧視","D":"惡意與濫用可能性"},"answer":"A","explanation":"大型語言模型安全性評估常見指標包含事實正確性、偏見與歧視、惡意與濫用可能性等，「資料複雜性」並非其安全性評估指標，故 A 為答案。"},{"n":50,"q":"某雲端服務公司計畫將大型語言模型部署於線上系統，並以批次推論（Batch Inference）方式處理每日上百萬筆用戶請求。專案團隊在評估可能遇到的挑戰時，下列哪一項通常不會被視為批次推論階段的主要難題？","options":{"A":"如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸出","B":"當批次規模增大時，如何降低推論延遲並保持即時回應能力","C":"在推論過程中，有效管理與分配龐大的輸入資料量以避免資源壅塞","D":"在叢集環境中精確安排推論任務，以提升 GPU/TPU 等硬體資源的利用率"},"answer":"A","explanation":"訓練語料的涵蓋性與標註品質屬「訓練階段」議題，並非批次推論階段的主要難題，故 A 為答案。B（延遲與吞吐）、C（資料量管理）、D（硬體資源排程與利用率）皆為批次推論的實際挑戰。"}]},{"id":"s2-115-2","subject":"第二科：生成式AI應用與規劃","exam":"115年第二次","questions":[{"n":1,"q":"一家會計師事務所希望透過 Low-Code 工具，自動處理客戶提交的各類費用報銷單據，格式涵蓋手寫、PDF 掃描、電子發票等多種形式，且各企業的科目分類規則均不相同。負責評估的專案經理正在比較兩種方案：方案甲為「直接呼叫基礎語言模型 API 進行單據內容解析與分類」，方案乙為「使用內建 RAG 元件，比對過去已正確分類的報銷單據」。下列分析何者最為正確？","options":{"A":"方案甲優於方案乙，因為基礎語言模型具備更廣泛的通用知識，足以應對所有格式變化","B":"方案乙優於方案甲，因為 RAG 能提供歷史分類案例作為參考上下文，顯著提升非結構化文件的分類準確率","C":"兩者效果相同，差異僅在於系統複雜度，應優先選擇建置較簡單的方案甲","D":"可透過預先設定固定分類規則的方式處理報銷單據，以提升處理效率並降低系統複雜度"},"answer":"B","explanation":"各企業科目分類規則不同且單據格式多元，需要參考歷史正確分類案例。RAG 可將過去已正確分類的單據作為檢索上下文，顯著提升非結構化文件的分類準確率，故 B 正確。基礎語言模型缺乏企業專屬規則（A），固定規則難以涵蓋多變格式（D），兩者效果亦不相同（C）。"},{"n":2,"q":"某客服主管希望在 Low-Code 平台中設定自動化流程：當客戶訊息被 AI 判定為「退費意圖」，且退費金額大於 10,000 元時，即自動發送緊急通知給主管。此需求最可能透過下列哪一種元件實現？","options":{"A":"條件分支（Branching / Router），依據多重條件判斷流程走向","B":"資料格式化（Formatter），用於整理與轉換流程中的資料格式","C":"迭代／迴圈（Iterator），逐筆處理多筆資料並依序執行流程","D":"陣列聚合器（Array Aggregator），將多筆資料整合後再進行後續處理"},"answer":"A","explanation":"需求為「符合特定條件（退費意圖且金額大於一萬）才觸發後續動作」，屬於依條件判斷流程走向，應使用條件分支（Branching / Router）元件，故 A 正確。格式化、迴圈與聚合器皆非用於條件判斷。"},{"n":3,"q":"某人資部門使用 Dify 平台建立了一個 AI 面試輔助機器人，協助 HR 在面試過程中即時查詢應徵者的過往提問紀錄。然而測試時發現，機器人完全無法記住同一位應徵者在五分鐘前說過的話，每次回應都像是全新對話。以下哪個措施能從根本上解決此問題？","options":{"A":"提升語言模型的溫度參數（Temperature）","B":"在每次 API 請求中，手動將歷史對話內容（Chat History）一併打包送入模型進行推理","C":"改用具備更多參數的大型多模態模型，以強化跨輪對話的理解能力","D":"為伺服器增加記憶體容量，擴充系統可儲存的對話快取空間"},"answer":"B","explanation":"LLM 本身無狀態，跨輪記憶須靠應用層將歷史對話（Chat History）隨每次請求一併送入模型，故 B 正確。溫度只影響隨機性（A），換更大模型或加記憶體（C、D）都無法讓無狀態的模型自動記住上一輪對話。"},{"n":4,"q":"在使用 API 串接生成式 AI 服務時，Token 會影響模型的計費。請問下列何者最正確敘述 Token 在 LLM 應用中的意義？","options":{"A":"Token 是模型將文字切分後的基本單位，通常與字詞或子詞對應，文件長度與 Token 數量具有一定關聯性","B":"Token 是模型用來表示整段文字語意的向量單位，用於理解輸入內容的語意結構","C":"Token 的數量會影響模型的輸入輸出長度與計費，而上下文長度受限於模型可處理的最大 Token 數","D":"Token 只影響模型的運算速度，不影響 API 的使用成本"},"answer":"C","explanation":"本題聚焦 Token 在 LLM 應用上的意義。C 完整說明 Token 數量同時影響輸入輸出長度與計費，且上下文受限於模型最大 Token 數，最為周全正確。A 僅描述切分定義而未涵蓋計費與上下文限制；B 混淆 Token 與向量；D 錯誤，Token 直接影響 API 成本。"},{"n":5,"q":"一家連鎖零售業者使用某封閉式 No-Code 平台多年，將客戶資料、訂單流程與內部作業高度整合於該平台。近期業者進行系統盤點時發現，該平台資料採專有格式儲存，匯出功能有限，且未提供標準 API 支援。在此情境下，長期而言，該企業最可能面臨下列何種風險？","options":{"A":"員工需具備撰寫進階程式語法的能力，才能持續使用該平台進行系統操作","B":"隨著系統使用時間增加，平台運算效能將逐漸下降，影響營運效率","C":"系統運作過程中較容易發生資安漏洞，導致資料外洩風險提高","D":"企業在未來更換系統時，將因資料與功能難以轉移而高度依賴原平台"},"answer":"D","explanation":"專有格式、匯出受限且無標準 API，代表資料與功能難以遷移，形成典型的供應商鎖定（Vendor Lock-in）風險，故 D 正確。其餘選項與封閉專有格式所導致的遷移困難無直接因果關係。"},{"n":6,"q":"某物流公司評估導入 No-Code/Low-C
